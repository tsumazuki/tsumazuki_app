<!-- つまずきマップ研究 Webアプリ版 v2：ダミー/本番モード + 問題生成 -->
<div id="app-root"></div>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Spline+Sans+Mono:wght@400;600&display=swap');

  #app-root {
    --ink: #1a2233;
    --paper: #f4f1ea;
    --card: #ffffff;
    --line: #d8d2c4;
    --accent: #b5462f;
    --accent2: #2f5d62;
    --good: #2f7d4f;
    --warn: #c98a2b;
    --bad: #b5462f;
    --mute: #8a8474;
    --dummy: #2f5d62;
    --live: #b5462f;
    font-family: 'Zen Kaku Gothic New', sans-serif;
    color: var(--ink);
    background: var(--paper);
    background-image: radial-gradient(var(--line) 0.6px, transparent 0.6px);
    background-size: 22px 22px;
    padding: 24px 20px 60px;
    line-height: 1.7;
    max-width: 1100px;
    margin: 0 auto;
  }
  #app-root * { box-sizing: border-box; }

  .hdr { border-bottom: 3px solid var(--ink); padding-bottom: 12px; margin-bottom: 14px; }
  .hdr h1 { font-size: 1.55rem; font-weight: 700; margin: 0 0 3px; letter-spacing: -0.01em; }
  .hdr .sub { color: var(--mute); font-size: 0.84rem; }

  /* モード切替 */
  .mode-switch {
    display: flex; gap: 0; margin: 14px 0 6px; border: 2px solid var(--ink);
    border-radius: 4px; overflow: hidden; width: fit-content;
  }
  .mode-btn {
    padding: 9px 22px; cursor: pointer; font-weight: 700; font-size: 0.9rem;
    background: var(--card); border: none; transition: all .15s;
    display: flex; align-items: center; gap: 7px;
  }
  .mode-btn:first-child { border-right: 2px solid var(--ink); }
  .mode-btn .dot { width: 9px; height: 9px; border-radius: 50%; }
  .mode-btn[data-mode=dummy] .dot { background: var(--dummy); }
  .mode-btn[data-mode=live] .dot { background: var(--live); }
  .mode-btn.active[data-mode=dummy] { background: var(--dummy); color: #fff; }
  .mode-btn.active[data-mode=dummy] .dot { background: #fff; }
  .mode-btn.active[data-mode=live] { background: var(--live); color: #fff; }
  .mode-btn.active[data-mode=live] .dot { background: #fff; }

  .mode-banner {
    font-size: 0.8rem; padding: 7px 14px; border-radius: 3px; margin-bottom: 16px;
    font-weight: 500;
  }
  .mode-banner.dummy { background: #e3eded; color: var(--dummy);
    border-left: 4px solid var(--dummy); }
  .mode-banner.live { background: #f6e4df; color: var(--live);
    border-left: 4px solid var(--live); }

  .steps { display: flex; gap: 5px; margin: 0 0 22px; flex-wrap: wrap; }
  .step-tab {
    flex: 1; min-width: 120px; border: 1.5px solid var(--line);
    background: var(--card); padding: 9px 11px; cursor: pointer;
    border-radius: 3px; transition: all .15s;
  }
  .step-tab:hover { border-color: var(--accent2); }
  .step-tab.active { border-color: var(--ink); box-shadow: 3px 3px 0 var(--ink); }
  .step-tab .n {
    font-family: 'Spline Sans Mono', monospace; font-size: 0.68rem;
    color: var(--accent); font-weight: 600;
  }
  .step-tab .t { font-size: 0.85rem; font-weight: 500; }
  .step-tab.done .n::after { content: ' ✓'; color: var(--good); }
  .step-tab.locked { opacity: .45; cursor: not-allowed; }

  .panel { display: none; }
  .panel.active { display: block; animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .card {
    background: var(--card); border: 1.5px solid var(--line);
    border-radius: 4px; padding: 19px 21px; margin-bottom: 16px;
  }
  .card h2 {
    font-size: 1.02rem; margin: 0 0 4px; font-weight: 700;
    display: flex; align-items: baseline; gap: 8px;
  }
  .card h2 .tag {
    font-family: 'Spline Sans Mono', monospace; font-size: 0.66rem;
    background: var(--ink); color: var(--paper); padding: 2px 7px;

  .card .desc { color: var(--mute); font-size: 0.84rem; margin-bottom: 13px; }

  .ctrl .val {

  .ctrl input[type=range] { width: 100%; accent-color: var(--accent2); }

  button.run {

    background: var(--ink); color: var(--paper); border: none;
    padding: 10px 20px; font-size: 0.9rem; cursor: pointer;
    border-radius: 3px; box-shadow: 3px 3px 0 var(--accent);

  button.run:hover { transform: translate(-1px,-1px); }
  button.run:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 var(--accent); }
  button.ghost {
    background: transparent; color: var(--ink); border: 1.5px solid var(--ink);
    box-shadow: none; padding: 8px 15px; font-size: 0.82rem; font-weight: 500;

  button.ghost:hover { background: var(--ink); color: var(--paper); }
  button:disabled { opacity: .4; cursor: not-allowed; }

  .metrics { display: flex; gap: 12px; flex-wrap: wrap; margin: 13px 0; }
  .metric {

  .metric .k { font-size: 0.71rem; color: var(--mute); }
  .metric .v {

  .metric .v.good { color: var(--good); }
  .metric .v.warn { color: var(--warn); }

  .bar-row { display: flex; align-items: center; gap: 9px; margin: 5px 0; }

  /* タグ選択モーダル */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(26,34,51,0.55);
    display: flex; align-items: center; justify-content: center;

  }
  .modal {
    background: var(--card); border: 2px solid var(--ink); border-radius: 6px;
    padding: 20px 22px; max-width: 460px; width: 100%;
    box-shadow: 6px 6px 0 var(--ink);
  }
  .modal h3 { margin: 0 0 4px; font-size: 1rem; font-weight: 700; }
  .modal .msub { font-size: 0.78rem; color: var(--mute); margin-bottom: 12px; }
  .tag-pick-grid {
    display: grid; grid-template-columns: repeat(2,1fr); gap: 7px; margin: 10px 0;
  }
  .tag-pick {
    border: 1.5px solid var(--line); border-radius: 4px; padding: 8px 10px;

  .tag-pick:hover { border-color: var(--accent2); }
  .tag-pick.sel {
    border-color: var(--ink); background: var(--ink); color: #fff;
  }
  .tag-pick .chk {
    width: 16px; height: 16px; border: 1.5px solid var(--line);

  /* 折れ線グラフの色別凡例 */

    display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 8px 0 4px;
    padding: 10px 12px; background: var(--paper);
    border: 1px solid var(--line); border-radius: 4px;
  }
  .ll-item { font-size: 0.78rem; display: flex; align-items: center; gap: 5px; }
  .ll-line {
    display: inline-block; width: 18px; height: 3px; border-radius: 2px;
  }
  .ll-en {
    font-family: 'Spline Sans Mono', monospace; font-size: 0.66rem;
    color: var(--mute); margin-left: 3px;
  }
  /* 回めくり（◀▶） */
  .map-nav {
    display: flex; align-items: center; gap: 12px; margin: 6px 0 10px;
  }
  .map-nav button {
    width: 32px; height: 32px; border: 1.5px solid var(--ink);
    background: var(--card); border-radius: 4px; cursor: pointer;
    font-size: 0.9rem; font-weight: 700; color: var(--ink);

  .map-nav button:hover:not(:disabled) { background: var(--ink); color: #fff; }
  .map-nav button:disabled { opacity: .3; cursor: not-allowed; }
  .map-nav .mn-label {
    font-weight: 700; font-size: 0.92rem; min-width: 130px; text-align: center;

  .empty { color: var(--mute); font-size: 0.84rem; font-style: italic;
    text-align: center; padding: 28px; }
  .legend { font-size: 0.73rem; color: var(--mute); margin-top: 8px; }
  .legend span { display: inline-block; margin-right: 13px; }
  .swatch { display: inline-block; width: 11px; height: 11px;
    border-radius: 2px; vertical-align: middle; margin-right: 3px; }

  /* 本番モード入力 */
  .input-tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .itab {
    padding: 7px 14px; border: 1.5px solid var(--line); border-radius: 3px;
    cursor: pointer; font-size: 0.82rem; font-weight: 500; background: var(--card);
  }
  .itab.active { border-color: var(--ink); background: var(--ink); color: #fff; }
  /* テスト回タブ */
  .test-tabs { display: flex; gap: 5px; margin: 4px 0 8px; flex-wrap: wrap; }
  .ttab {
    padding: 5px 13px; border: 1.5px solid var(--line); border-radius: 3px;
    cursor: pointer; font-size: 0.78rem; font-weight: 600; background: var(--card);
    text-align: center; line-height: 1.25;
  }
  .ttab.active { border-color: var(--live); background: var(--live); color: #fff; }
  .ttab .tprog {
    font-family: 'Spline Sans Mono', monospace; font-size: 0.62rem;
    font-weight: 400; opacity: 0.7;
  }
  .ttab.add, .ttab.del {
    font-weight: 500; color: var(--mute); display: flex; align-items: center;
  }
  .ttab.add:hover { border-color: var(--good); color: var(--good); }
  .ttab.del:hover { border-color: var(--bad); color: var(--bad); }
  .grid-input { overflow-x: auto; margin: 10px 0; }
  table.entry { border-collapse: collapse; font-size: 0.76rem; }
  table.entry th, table.entry td {
    border: 1px solid var(--line); padding: 0; text-align: center; min-width: 38px;
  }
  table.entry th {
    background: var(--ink); color: #fff; padding: 4px 6px; font-weight: 500;

  table.entry th.qhdr { cursor: help; }
  table.entry td.sid {
    background: var(--paper); font-family: 'Spline Sans Mono', monospace;
    padding: 3px 8px; font-weight: 600; white-space: nowrap;
  }
  .cell-btn {

    font-family: 'Spline Sans Mono', monospace; background: var(--card);
  }
  .cell-btn.c1 { background: #d6ead9; color: var(--good); font-weight: 700; }
  .cell-btn.c0 { background: #f2dcd7; color: var(--bad); font-weight: 700; }
  .cell-btn.cx { background: var(--card); color: var(--line); }

  .dropzone {
    border: 2px dashed var(--line); border-radius: 5px; padding: 26px;
    text-align: center; color: var(--mute); font-size: 0.85rem;
    cursor: pointer; transition: all .15s; background: var(--card);
  }
  .dropzone:hover, .dropzone.drag { border-color: var(--accent2); background: #eef2f1; }
  .dropzone b { color: var(--ink); }

  .qgen-block {
    border: 1.5px solid var(--line); border-radius: 4px; padding: 13px 15px;
    margin: 9px 0; background: var(--paper);
  }
  .qgen-block .qg-head {
    display: flex; justify-content: space-between; align-items: center;
    font-weight: 700; font-size: 0.88rem; margin-bottom: 6px;
  }
  .qg-pill {
    font-family: 'Spline Sans Mono', monospace; font-size: 0.7rem;
    padding: 2px 8px; border-radius: 10px; color: #fff;
  }
  /* STEP5-B 通常問題生成 */
  .level-pick { display: flex; gap: 6px; flex-wrap: wrap; }
  .level-btn {
    border: 1.5px solid var(--line); background: var(--card); cursor: pointer;
    padding: 7px 13px; border-radius: 4px; font-weight: 700; font-size: 0.85rem;
    display: flex; flex-direction: column; align-items: center; line-height: 1.2;
  }
  .level-btn:hover { border-color: var(--accent2); }
  .level-btn.sel { border-color: var(--ink); background: var(--ink); color: #fff; }
  .level-btn .lv-cefr {
    font-family: 'Spline Sans Mono', monospace; font-size: 0.6rem;
    font-weight: 400; opacity: 0.7;
  }
  .cg-tag-list {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));

  .cg-tag-row {

  .cg-stepper { display: flex; align-items: center; gap: 8px; }
  .cg-stepper button {
    width: 24px; height: 24px; border: 1.5px solid var(--ink);

    font-size: 0.68rem; color: #fff; font-family: 'Spline Sans Mono', monospace; }
  .navbtns { display: flex; justify-content: flex-end; margin-top: 6px; gap: 6px; }
  .small { font-size: 0.78rem; color: var(--mute); }

<script>
(function () {
  const root = document.getElementById('app-root');

  // ============================================================
  // 共通定義
  // ============================================================
  // ▼▼▼ タグを変更したいときは、この TAG_CONFIG だけを編集してください ▼▼▼
  //   en       : タグの英語名（半角英数とハイフンのみ。スペース不可）
  //   ja       : タグの日本語名（画面に併記される）
  //   baseline : ダミーモード用の「クラスの初期理解度」0〜1。
  //              小さいほどそのタグが弱点。本番モードでは使われない。
  //   行を増減すればタグが増減します。8〜10個程度を推奨。
  //   （ハイフンを含む英語名でも可。例 "relative-clause"）
  const TAG_CONFIG = [
    { en:"vocabulary",         ja:"語彙",    baseline:0.75 },
    { en:"idiom",              ja:"熟語",    baseline:0.60 },
    { en:"tense",              ja:"時制",    baseline:0.70 },
    { en:"relative-clause",    ja:"関係詞",  baseline:0.35 },
    { en:"participle",         ja:"分詞",    baseline:0.40 },
    { en:"sentence-structure", ja:"文構造",  baseline:0.55 },
    { en:"reference",          ja:"指示語",  baseline:0.65 },
    { en:"inference",          ja:"推論",    baseline:0.45 },
  ];
  // ダミーモードで「AIが混同しやすいタグの組」。左のタグを右のタグと取り違える。
  // 使うタグ名は上の TAG_CONFIG の en と一致させること。不要なら {} でよい。
  const AI_CONFUSION = { "participle":"relative-clause", "inference":"reference" };
  // ▲▲▲ 編集はここまで。以下は TAG_CONFIG から自動生成されるので触らない ▲▲▲

  const TAGS = TAG_CONFIG.map(t=>t.en);
  const TAG_JA = {};
  const CLASS_BASELINE = {};
  TAG_CONFIG.forEach(t=>{ TAG_JA[t.en]=t.ja; CLASS_BASELINE[t.en]=t.baseline; });

  function makeRng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
  function gauss(rng,m,sd){const u1=Math.max(rng(),1e-9),u2=rng();
    return m+sd*Math.sqrt(-2*Math.log(u1))*Math.cos(2*Math.PI*u2);}
  const clip01 = x => Math.min(0.98, Math.max(0.02, x));

  // ---- ダミーデータ生成（中程度モデル） ----
  function generate(cfg){
    const rng = makeRng(cfg.seed);
    const ability=[], gain=[];
    for(let s=0;s<cfg.nStudents;s++){
      ability.push(gauss(rng,0,cfg.spread));
      gain.push(Math.max(0,gauss(rng,cfg.gain,0.03)));
    }
    const truth=[];
    for(let s=0;s<cfg.nStudents;s++){
      truth.push([]);
      for(let t=1;t<=cfg.nTests;t++){
        const row={};
        for(const tag of TAGS){
          const base=CLASS_BASELINE[tag]+ability[s];
          row[tag]=clip01(base+gain[s]*(t-1)+gauss(rng,0,0.04));
        }
        truth[s].push(row);
      }
    }
    // 問題のタグ構成は「1セット」だけ決めて全テスト回で使い回す。
    // こうしないと回ごとにタグ分布が変わり、時系列比較が成立しない。
    const qTemplate=[];   // [{teacher:[...], ai:[...]}, ...] 長さ nQ
    for(let q=1;q<=cfg.nQ;q++){
      const nTag=rng()<0.7?1:2;
      const pool=TAGS.slice(), chosen=[];
      for(let i=0;i<nTag;i++) chosen.push(pool.splice(Math.floor(rng()*pool.length),1)[0]);
      let aiSet=new Set(chosen);
      if(rng()<0.20){
        const r=rng();
        if(r<0.34){for(const c of[...aiSet])if(AI_CONFUSION[c]){aiSet.delete(c);aiSet.add(AI_CONFUSION[c]);}}
        else if(r<0.67&&aiSet.size>1){aiSet.delete([...aiSet][Math.floor(rng()*aiSet.size)]);}
        else{aiSet.add(TAGS[Math.floor(rng()*TAGS.length)]);}
      }
      qTemplate.push({teacher:chosen,ai:[...aiSet]});
    }
    // 全テスト回に同じタグ構成を展開
    const questions=[];
    for(let t=1;t<=cfg.nTests;t++){
      for(let q=1;q<=cfg.nQ;q++){
        const tmpl=qTemplate[q-1];
        questions.push({test:t,q:q,
          teacher:tmpl.teacher.slice(), ai:tmpl.ai.slice()});
      }
    }
    const responses=[];
    for(const qq of questions){
      for(let s=0;s<cfg.nStudents;s++){
        const p=qq.teacher.reduce((a,tg)=>a+truth[s][qq.test-1][tg],0)/qq.teacher.length;
        responses.push({test:qq.test,q:qq.q,student:s,correct:rng()<p?1:0});
      }
    }
    return {truth,questions,responses,cfg,mode:'dummy'};
  }

  // ---- 分析関数（両モード共通） ----
  function buildMap(data,upToTest){
    const acc={}; TAGS.forEach(t=>acc[t]={sum:0,n:0});
    const qmap={}; data.questions.forEach(q=>qmap[q.test+'_'+q.q]=q);
    for(const r of data.responses){
      if(r.test>upToTest) continue;
      if(r.correct===null||r.correct===undefined) continue;
      const q=qmap[r.test+'_'+r.q]; if(!q) continue;
      for(const tg of q.teacher){acc[tg].sum+=r.correct;acc[tg].n++;}
    }
    const out={}; TAGS.forEach(t=>out[t]=acc[t].n?acc[t].sum/acc[t].n:null);
    return out;
  }
  // 特定のテスト回1回分だけのタグ別正答率（時系列表示用）
  function buildMapForTest(data,testNo){
    const acc={}; TAGS.forEach(t=>acc[t]={sum:0,n:0});
    const qmap={}; data.questions.forEach(q=>qmap[q.test+'_'+q.q]=q);
    for(const r of data.responses){
      if(r.test!==testNo) continue;
      if(r.correct===null||r.correct===undefined) continue;
      const q=qmap[r.test+'_'+r.q]; if(!q) continue;
      for(const tg of q.teacher){acc[tg].sum+=r.correct;acc[tg].n++;}
    }
    const out={}; TAGS.forEach(t=>out[t]=acc[t].n?acc[t].sum/acc[t].n:null);
    return out;
  }
  // 各タグが「何回のテストで出題されたか」を数える（欠損回の把握用）
  // 返り値: { tag: {present: 出題された回数, total: 全テスト回数} }
  function tagPresence(data){
    const nT=data.cfg.nTests;
    const out={}; TAGS.forEach(t=>out[t]={present:0,total:nT});
    for(let k=1;k<=nT;k++){
      const m=buildMapForTest(data,k);
      TAGS.forEach(t=>{ if(m[t]!==null) out[t].present++; });
    }
    return out;
  }
  function truthMean(data,upToTest){
    const out={};
    TAGS.forEach(tg=>{
      let sum=0,n=0;
      for(let s=0;s<data.cfg.nStudents;s++)
        for(let t=0;t<upToTest;t++){sum+=data.truth[s][t][tg];n++;}
      out[tg]=sum/n;
    });
    return out;
  }
  function tagAgreement(data){
    let sum=0,perfect=0,evaluated=0;
    for(const q of data.questions){
      if(!q.ai||q.ai.length===0) continue;
      const a=new Set(q.teacher),b=new Set(q.ai);
      const inter=[...a].filter(x=>b.has(x)).length;
      const uni=new Set([...a,...b]).size;
      const j=uni?inter/uni:1;
      sum+=j; if(j===1)perfect++; evaluated++;
    }
    return {mean:evaluated?sum/evaluated:0,perfect,total:evaluated};
  }
  function pearson(x,y){
    const n=x.length,mx=x.reduce((a,b)=>a+b)/n,my=y.reduce((a,b)=>a+b)/n;
    let sxy=0,sxx=0,syy=0;
    for(let i=0;i<n;i++){const dx=x[i]-mx,dy=y[i]-my;sxy+=dx*dy;sxx+=dx*dx;syy+=dy*dy;}
    return sxy/Math.sqrt(sxx*syy||1e-9);
  }
  function recovery(data,upToTest){
    const est=buildMap(data,upToTest),tru=truthMean(data,upToTest);
    let errSum=0,sqSum=0,n=0; const ex=[],ey=[];
    TAGS.forEach(tg=>{
      if(est[tg]===null) return;
      const e=est[tg]-tru[tg];
      errSum+=Math.abs(e);sqSum+=e*e;n++;ex.push(tru[tg]);ey.push(est[tg]);
    });
    return {mae:errSum/n,rmse:Math.sqrt(sqSum/n),corr:pearson(ex,ey),est,tru};
  }

        <div class="map-nav">
          <button id="map-prev" ${vt<=0?'disabled':''}>&#9664;</button>
          <span class="mn-label">第${vt+1}回 / 全${nT}回</span>
          <button id="map-next" ${vt>=nT-1?'disabled':''}>&#9654;</button>
        </div>
        ${barRows(shown,shownTags,null)}
        ${mapLegend()}
        <div class="small" style="margin-top:6px;color:var(--warn)">
        ※「出題なし」のタグは、その回にそのタグの問題が無かったことを示します。</div>

        <h2 style="font-size:.9rem;margin:18px 0 4px">③ 第1回 → 第${nT}回 の変化</h2>
        <table class="cmp"><tr><th>タグ</th><th>第1回</th><th>第${nT}回</th>
          <th>変化</th><th>出題回数</th></tr>
        ${sorted.map(tg=>{
          const v0=first[tg], v1=latest[tg];
          const p=presence[tg];
          const f0=v0===null?'－':(v0*100).toFixed(0)+'%';
          const f1=v1===null?'－':(v1*100).toFixed(0)+'%';
          let chg='－', col='var(--mute)';
          if(v0!==null&&v1!==null){
            const d=v1-v0;
            col=d>0.01?'var(--good)':d<-0.01?'var(--bad)':'var(--mute)';
            chg=(d>0?'+':'')+(d*100).toFixed(1)+'pt';
          }
          return `<tr><td>${tg} ${TAG_JA[tg]}</td><td>${f0}</td><td>${f1}</td>
            <td style="color:${col};font-weight:600">${chg}</td>
            <td>${p.present}/${p.total}回</td></tr>`;
        }).join('')}</table>
        <div class="callout">正答率が上がったタグは指導の効果が出た可能性、
        下がった・伸びないタグは引き続き重点的な指導が必要、と読み取れます。
        出題回数が全回に満たないタグは、変化の判断に注意が必要です。</div>

        <h2 style="font-size:.9rem;margin:18px 0 4px">④ タグ別 正答率の推移（折れ線）</h2>
        ${lineChartSVG(perTest,sorted)}
        ${lineLegendHTML(sorted,presence)}
        <div class="small" style="margin-top:4px">
        折れ線が途切れている箇所は、その回にそのタグの問題が出題されなかったことを示します。</div>`;
      }
    }
    return `<div class="panel ${state.step===1?'active':''}" data-panel="1">
      <div class="card"><h2><span class="tag">STEP 2</span>つまずきマップ</h2>${body}</div></div>`;
  }

  // 棒グラフの行（共通）。presence を渡すと出題頻度（4/5など）を添える
  function barRows(map,sorted,presence){
    return sorted.map(tg=>{
      const v=map[tg];
      // 出題頻度の注記
      let freq='';
      if(presence&&presence[tg]){
        const p=presence[tg];
        if(p.present<p.total){
          freq=` <span style="color:var(--warn);font-size:.66rem">出題 ${p.present}/${p.total}回</span>`;
        }
      }
      if(v===null){
        // この集計範囲で一度も出題されなかったタグ
        return `<div class="bar-row">
          <div class="lbl">${tg}<br><span style="font-family:'Zen Kaku Gothic New';font-size:.68rem;color:var(--mute)">${TAG_JA[tg]}</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:0%"></div></div>
          <div class="pct" style="color:var(--mute)">出題なし</div></div>`;
      }
      const col=v<0.5?'var(--bad)':v<0.7?'var(--warn)':'var(--good)';
      return `<div class="bar-row">
        <div class="lbl">${tg}<br><span style="font-family:'Zen Kaku Gothic New';font-size:.68rem;color:var(--mute)">${TAG_JA[tg]}${freq}</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${v*100}%;background:${col}"></div></div>
        <div class="pct">${(v*100).toFixed(1)}%</div></div>`;
    }).join('');
  }
  function mapLegend(){
    return `<div class="legend">
      <span><span class="swatch" style="background:var(--bad)"></span>弱点 (〜50%)</span>
      <span><span class="swatch" style="background:var(--warn)"></span>要強化 (50-70%)</span>
      <span><span class="swatch" style="background:var(--good)"></span>定着 (70%〜)</span></div>`;
  }

  // タグごとの色を返す（折れ線と凡例で共通利用）
  // 基本は固定パレット。タグ数がパレットを超えたら色相環から自動生成して補う。
  const LINE_PALETTE=['#b5462f','#c98a2b','#3f7d6e','#2f5d62','#46587a',
                      '#7a6f54','#a04a6a','#5a7a3a','#385f8a','#9a5a2a',
                      '#5a3a6a','#2a6a5a'];
  function tagColor(tags,tg){
    const i=tags.indexOf(tg);
    const idx=(i<0?0:i);
    if(idx<LINE_PALETTE.length) return LINE_PALETTE[idx];
    // パレットを超えたぶんは色相を等間隔にずらして生成（色被りを防ぐ）
    const hue=(idx*47)%360;
    return `hsl(${hue},45%,42%)`;
  }

  // 折れ線グラフSVG：タグ別正答率の推移
  // 欠損回（その回にそのタグの問題が無い）では線が途切れ、
  // 再びそのタグが出題された回でまた線がつながる。
  function lineChartSVG(perTest,tags){
    const nT=perTest.length;
    const W=640,H=320,padL=46,padR=92,padT=18,padB=38;
    const plotW=W-padL-padR, plotH=H-padT-padB;
    const sx=i=>padL + (nT<=1?plotW/2:i/(nT-1)*plotW);
    const sy=v=>padT + (1-v)*plotH;
    let grid='';
    [0,0.25,0.5,0.75,1].forEach(v=>{
      grid+=`<line x1="${padL}" y1="${sy(v)}" x2="${padL+plotW}" y2="${sy(v)}"
        stroke="#d8d2c4" stroke-width="0.7"/>
        <text x="${padL-6}" y="${sy(v)+3}" font-size="9" text-anchor="end"
        fill="#8a8474" font-family="monospace">${Math.round(v*100)}%</text>`;
    });
    for(let i=0;i<nT;i++){
      grid+=`<text x="${sx(i)}" y="${H-padB+15}" font-size="9.5" text-anchor="middle"
        fill="#8a8474">第${i+1}回</text>`;
    }
    // 各タグの折れ線：連続して値がある区間ごとに別パスを描く
    let lines='';
    const labelData=[];   // 右端ラベル用 {tag, col, y}
    tags.forEach(tg=>{
      const col=tagColor(tags,tg);
      let dots='';
      let segments=[], cur=[];
      let lastY=null;
      for(let i=0;i<nT;i++){
        const v=perTest[i][tg];
        if(v===null){
          if(cur.length) segments.push(cur);
          cur=[];
        } else {
          const x=sx(i),y=sy(v);
          cur.push([x,y]);
          dots+=`<circle cx="${x}" cy="${y}" r="3.4" fill="${col}"/>`;
          lastY=y;
        }
      }
      if(cur.length) segments.push(cur);
      segments.forEach(seg=>{
        if(seg.length===1){
          const [x,y]=seg[0];
          lines+=`<circle cx="${x}" cy="${y}" r="5.5" fill="none"
            stroke="${col}" stroke-width="1.3" stroke-dasharray="2 2"/>`;
          return;
        }
        let d='';
        seg.forEach((p,k)=>{ d+=(k===0?'M':'L')+p[0]+' '+p[1]+' '; });
        lines+=`<path d="${d}" fill="none" stroke="${col}" stroke-width="2"/>`;
      });
      lines+=dots;
      // 最後に値があった点の高さを右端ラベルの初期位置にする
      if(lastY!==null) labelData.push({tag:tg,col:col,y:lastY});
    });

    // 右端ラベルの衝突回避：y順に並べ、最小間隔(11px)を確保するよう調整
    const MIN_GAP=11;
    labelData.sort((a,b)=>a.y-b.y);
    for(let i=1;i<labelData.length;i++){
      if(labelData[i].y - labelData[i-1].y < MIN_GAP){
        labelData[i].y = labelData[i-1].y + MIN_GAP;
      }
    }
    // 下にはみ出したぶんを上方向へ押し戻す
    const bottom=padT+plotH;
    let overflow=labelData.length?labelData[labelData.length-1].y-bottom:0;
    if(overflow>0){
      for(let i=0;i<labelData.length;i++) labelData[i].y-=overflow;
    }
    // ラベルと、線の終点からラベルへの引き出し線を描く
    let labels='';
    labelData.forEach(ld=>{
      labels+=`<text x="${padL+plotW+6}" y="${ld.y+3}" font-size="9"
        fill="${ld.col}" font-weight="600">${TAG_JA[ld.tag]}</text>`;
    });

    return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg"
      style="width:100%;max-width:${W}px;display:block;margin:6px auto">
      <rect x="${padL}" y="${padT}" width="${plotW}" height="${plotH}"
        fill="#f4f1ea" stroke="#1a2233" stroke-width="1"/>
      ${grid}${lines}${labels}
      <text x="${padL+plotW/2}" y="${H-4}" font-size="10" text-anchor="middle"
        fill="#1a2233">テスト回</text>
    </svg>`;
  }

  // 折れ線グラフの色別タグ名リスト（凡例）
  function lineLegendHTML(tags,presence){
    return `<div class="line-legend">
      ${tags.map(tg=>{
        const col=tagColor(tags,tg);
        let freq='';
        if(presence&&presence[tg]&&presence[tg].present<presence[tg].total){
          freq=` <span style="color:var(--warn);font-size:.66rem">(${presence[tg].present}/${presence[tg].total}回)</span>`;
        }
        return `<span class="ll-item">
          <span class="ll-line" style="background:${col}"></span>
          ${TAG_JA[tg]}<span class="ll-en">${tg}</span>${freq}</span>`;
      }).join('')}
    </div>`;
  }

  // ---- STEP 3: AIタグ検証 ----
  function panelAgree(){
    let body=`<div class="empty">STEP 1 でデータを準備してください。</div>`;
    if(state.data){
      const ag=tagAgreement(state.data);
      if(ag.total===0){
        body=`<div class="empty">AIタグが未設定です。${state.appMode==='live'
          ?'本番モードでAIタグ検証を行うには、各問題にAIタグも入力してください（今回は省略可）。'
          :''}</div>`;
      } else {
        const cls=ag.mean>0.85?'good':ag.mean>0.7?'warn':'bad';
        const stat={}; TAGS.forEach(t=>stat[t]={tp:0,fn:0,fp:0});
        state.data.questions.forEach(q=>{
          if(!q.ai||q.ai.length===0) return;
          const ts=new Set(q.teacher),as=new Set(q.ai);
          TAGS.forEach(t=>{
            if(ts.has(t)&&as.has(t))stat[t].tp++;
            else if(ts.has(t)&&!as.has(t))stat[t].fn++;
            else if(!ts.has(t)&&as.has(t))stat[t].fp++;
          });
        });
        body=`<div class="desc">生成AIにタグ付けさせた結果と教師タグの一致度を測ります。
        一致度が高いほど、AIによるタグ付けを信頼して使えることを示します。</div>
        <div class="metrics">
          <div class="metric"><div class="k">平均Jaccard一致度</div>
            <div class="v ${cls}">${ag.mean.toFixed(3)}</div></div>
          <div class="metric"><div class="k">完全一致した問題</div>
            <div class="v">${ag.perfect}/${ag.total}</div></div>
        </div>
        <table class="cmp"><tr><th>タグ</th><th>一致</th><th>AI見落とし</th><th>AI過剰付与</th></tr>
        ${TAGS.map(t=>`<tr><td>${t} ${TAG_JA[t]}</td><td>${stat[t].tp}</td>
          <td>${stat[t].fn}</td><td>${stat[t].fp}</td></tr>`).join('')}</table>
        ${state.appMode==='dummy'?`<div class="callout warn">ダミーでは
        <b>分詞→関係詞</b>、<b>推論→指示語</b> をAIが混同しやすく設定しています。</div>`:''}`;
      }
    }
    return `<div class="panel ${state.step===2?'active':''}" data-panel="2">
      <div class="card"><h2><span class="tag">STEP 3</span>AIタグ付けの信頼性</h2>${body}</div></div>`;
  }

  // ---- STEP 4: パラメータリカバリー（ダミー専用） ----
  function panelRecovery(){
    let body;
    if(state.appMode==='live'){
      body=`<div class="callout warn"><b>本番モードではこのステップは行いません。</b>
      パラメータリカバリーは「仕込んだ真値」と推定値を照合する検証で、真値が存在するダミーモード専用です。
      実データの妥当性は STEP 3（AIタグ検証）で確認します。</div>`;
    } else if(!state.data){
      body=`<div class="empty">STEP 1 でダミークラスを生成してください。</div>`;
    } else {
      const full=recovery(state.data,state.data.cfg.nTests);
      const corrCls=full.corr>0.9?'good':full.corr>0.75?'warn':'bad';
      const maeCls=full.mae<0.05?'good':full.mae<0.1?'warn':'bad';
      const series=[];
      for(let k=1;k<=state.data.cfg.nTests;k++) series.push({k,...recovery(state.data,k)});
      body=`<div class="desc">最初に仕込んだ「本当の理解度」と、マップが正答率から推定した値を照合します。
      真値を知っているのはダミーだからこそ。実生徒では不可能な検証です。</div>
      <div class="metrics">
        <div class="metric"><div class="k">真値との相関</div>
          <div class="v ${corrCls}">${full.corr.toFixed(3)}</div></div>
        <div class="metric"><div class="k">平均絶対誤差 MAE</div>
          <div class="v ${maeCls}">${full.mae.toFixed(3)}</div></div>
        <div class="metric"><div class="k">RMSE</div>
          <div class="v">${full.rmse.toFixed(3)}</div></div>
      </div>
      ${scatterSVG(full)}
      <h2 style="font-size:.9rem;margin:16px 0 4px">テスト回数と推定精度</h2>
      <div class="desc">回数を増やすと誤差が下がるなら、実践に必要なテスト回数の目安になります。</div>
      <table class="cmp"><tr><th>テスト回数</th><th>MAE（誤差）</th><th>相関</th></tr>
      ${series.map(s=>`<tr><td>${s.k}回</td><td>${s.mae.toFixed(4)}</td>
        <td>${s.corr.toFixed(4)}</td></tr>`).join('')}</table>`;
    }
    return `<div class="panel ${state.step===3?'active':''}" data-panel="3">
      <div class="card"><h2><span class="tag">STEP 4</span>パラメータリカバリー</h2>${body}</div></div>`;
  }

  // ---- STEP 5: 問題自動生成 ----
  function panelQGen(){
    // パートA：弱点連動の出題計画（つまずきマップに基づく。データがある時のみ）
    let weakPart='';
    if(state.data){
      const map=buildMap(state.data,state.data.cfg.nTests);
      const valid=TAGS.filter(t=>map[t]!==null);
      if(valid.length>0){
        const TOTAL=20;
        const weights={}; let wsum=0;
        valid.forEach(t=>{ const w=Math.max(0.05,1-map[t]); weights[t]=w; wsum+=w; });
        const plan=valid.map(t=>({
          tag:t, acc:map[t],
          n:Math.max(1,Math.round(TOTAL*weights[t]/wsum))
        })).sort((a,b)=>a.acc-b.acc);
        const planTotal=plan.reduce((a,p)=>a+p.n,0);
        const planTags=plan.map(p=>p.tag);

        weakPart=`<div class="card">
        <h2><span class="tag">STEP 5-A</span>弱点連動の出題計画</h2>
        <div class="desc">つまずきマップの弱点に連動して、補習問題の<b>出題計画</b>を自動で立てます。
        正答率が低いタグほど多く出題します。実際の英文生成は、下の生成プロンプトを
        ChatGPTやClaudeに貼り付けて行います（このアプリはAPIに接続しません）。</div>

        <h2 style="font-size:.9rem;margin:14px 0 2px">出題計画の根拠：全${state.data.cfg.nTests}回 累計のつまずきマップ</h2>
        <div class="small" style="margin-bottom:6px">
        下の出題計画は、この累計つまずきマップ（全テスト回をまとめた正答率）に基づいて算出されています。</div>
        ${barRows(map,planTags,null)}
        ${mapLegend()}

        <h2 style="font-size:.9rem;margin:18px 0 4px">出題配分（合計${planTotal}問）</h2>
        <div class="seg-bar">
          ${plan.map(p=>`<div class="seg" style="width:${p.n/planTotal*100}%;
            background:${tagColor(planTags,p.tag)}" title="${TAG_JA[p.tag]} ${p.n}問">
            ${p.n>=2?TAG_JA[p.tag]:''}</div>`).join('')}
        </div>
        <table class="cmp"><tr><th>タグ</th><th>クラス正答率</th><th>出題数</th><th>狙い</th></tr>
        ${plan.map(p=>`<tr><td>${p.tag} ${TAG_JA[p.tag]}</td><td>${(p.acc*100).toFixed(0)}%</td>
          <td>${p.n}問</td><td style="text-align:left">${
            p.acc<0.5?'最優先で強化':p.acc<0.7?'底上げ':'維持確認'}</td></tr>`).join('')}
        </table>

        <h2 style="font-size:.9rem;margin:18px 0 4px">生成AIに渡すプロンプト</h2>
        <div class="desc">各弱点タグについて、生成AIにそのまま渡せる指示文を自動で組み立てました。
        コピーして ChatGPT / Claude に貼り付けてください。</div>
        ${plan.filter(p=>p.acc<0.7).map(p=>{
          const col=tagColor(planTags,p.tag);
          return `<div class="qgen-block">
            <div class="qg-head"><span>${TAG_JA[p.tag]}（${p.tag}）の強化問題</span>
              <span class="qg-pill" style="background:${col}">${p.n}問</span></div>
            <div class="prompt-box" id="pb-${p.tag}">${buildPrompt(p)}<button
              class="copy-btn" data-copy="pb-${p.tag}">コピー</button></div>
          </div>`;
        }).join('')}

        <div class="callout">この出題計画と生成問題を生徒に解かせ、次のテストで
        同じタグの正答率が上がるかを追うことで、弱点に連動した指導の効果を測定できます。</div>
        <div class="navbtns">
          <button class="ghost" id="export-plan">出題計画をCSVで保存</button>
        </div></div>`;
      }
    } else {
      weakPart=`<div class="card">
        <h2><span class="tag">STEP 5-A</span>弱点連動の出題計画</h2>
        <div class="callout">つまずきマップに基づく弱点連動の出題計画は、
        STEP 1 で生徒の解答データを入力すると表示されます。
        マップに依存しない通常の問題は、下の「通常問題の作成」で今すぐ作れます。</div>
      </div>`;
    }

    // パートB：通常問題生成（つまずきマップに依存しない。常に表示）
    const customPart=customGenCard();

    return `<div class="panel ${state.step===4?'active':''}" data-panel="4">
      ${weakPart}
      ${customPart}
    </div>`;
  }

  // STEP5-B：通常問題の作成カード（タグと出題数を手動指定）
  function customGenCard(){
    const cg=state.customGen;
    // タグごとの出題数入力欄
    const tagRows=TAGS.map(t=>{
      const n=cg.counts[t]||0;
      return `<div class="cg-tag-row">
        <span class="cg-tag-name">${t} <span style="color:var(--mute)">${TAG_JA[t]}</span></span>
        <div class="cg-stepper">
          <button class="cg-minus" data-cgtag="${t}">−</button>
          <span class="cg-count" id="cg-n-${t}">${n}</span>
          <button class="cg-plus" data-cgtag="${t}">＋</button>
        </div>
      </div>`;
    }).join('');
    const total=TAGS.reduce((a,t)=>a+(cg.counts[t]||0),0);
    // プレビュー用 plan
    const plan=TAGS.filter(t=>(cg.counts[t]||0)>0)
      .map(t=>({tag:t,n:cg.counts[t]}));
    const promptText = total>0
      ? buildCustomPrompt(plan,cg.level)
      : '（出題するタグの問題数を1問以上に設定すると、ここにプロンプトが表示されます）';

    return `<div class="card">
      <h2><span class="tag">STEP 5-B</span>通常問題の作成（つまずきマップ不要）</h2>
      <div class="desc">つまずきマップに関係なく、出題したいタグと問題数・難易度を自分で指定して
      問題作成プロンプトを作ります。第1回テストの作成や、弱点補強に偏らない
      バランスのとれた出題に使えます。生徒データの入力は不要です。</div>

      <div class="small" style="font-weight:500;margin-bottom:4px">① 難易度（学年）を選ぶ</div>
      <div class="level-pick">
        ${LEVELS.map(l=>`<button class="level-btn ${cg.level===l.name?'sel':''}"
          data-level="${l.name}">${l.name}<span class="lv-cefr">${l.cefr}</span></button>`).join('')}
      </div>

      <div class="small" style="font-weight:500;margin:12px 0 4px">
        ② 出題するタグと問題数を指定（＋－で増減）</div>
      <div class="cg-tag-list">${tagRows}</div>
      <div class="cg-total">合計 <b>${total}</b> 問</div>

        class="copy-btn" data-copy="pb-custom">コピー</button></div>

      このプロンプトを ChatGPT / Claude に貼り付けて問題を作成できます。

  // AIにタグ付けさせるためのプロンプトを組み立てる
  // questionText: 教師が貼り付けた問題文（英文＋設問）。複数問まとめて渡せる。
  function buildTaggingPrompt(questionText){
    const tagList = TAGS.map(t=>` - ${t}（${TAG_JA[t]}）`).join('\n');
    const body = questionText && questionText.trim()
      ? questionText.trim()
      : '（ここに問題文を貼り付けてください。複数問ある場合は Q1: … Q2: … のように番号を付ける）';
    return `あなたは英語教育の専門家です。
以下の英語読解問題それぞれについて、その問題が問うている文法・読解要素を、
下の【タグ一覧】の中から選んでください。

【タグ一覧】（この中の語だけを使うこと。一覧にない語は使わない）
${tagList}

【判定のルール】
 - 1問につき1〜2個のタグを選ぶ（最も中心的に問われている要素を優先）
 - 必ずタグ一覧の英語の語（vocabulary 等）で答える
 - 各問題について、なぜそのタグを選んだか一文で理由も書く

【出力形式】次の形式を厳守してください。
Q1: tag1;tag2
理由: …
Q2: tag1
理由: …

【対象の問題】
${body}`;
  }

  // AIの返答（Q1: tag;tag 形式）を解析して問題ごとのタグ配列にする
  function parseTaggingReply(text){
    const result = {};   // { 0: ['vocabulary'], 1: [...] }
    // ハイフン入りタグを「スペース表記」でも照合できるよう対応表を作る
    const norm = {};     // 'relative clause' -> 'relative-clause'
    TAGS.forEach(t=>{ norm[t]=t; norm[t.replace(/-/g,' ')]=t; });
    const lines = text.split(/\r?\n/);
    for(const line of lines){
      const m = line.match(/Q\s*(\d+)\s*[:：]\s*(.+)/i);
      if(!m) continue;
      const qi = parseInt(m[1],10) - 1;
      // セミコロン・読点・スラッシュで区切る（スペースは区切らない）
      const tags = m[2].split(/[;,；、\/]+/)
        .map(s=>s.trim().toLowerCase())
        .map(s=>norm[s])               // 正規化（一覧外は undefined）
        .filter(Boolean);
      if(qi>=0) result[qi] = [...new Set(tags)];
    }
    return result;
  }

  // 難易度レベル（中1〜高3）。CEFR と語数の目安を併記して生成AIに伝わりやすくする
  const LEVELS = [
    { name:"中1", cefr:"A1",     words:"30〜50語",   note:"be動詞・一般動詞の現在形が中心" },
    { name:"中2", cefr:"A1〜A2", words:"50〜70語",   note:"過去形・未来表現・助動詞が中心" },
    { name:"中3", cefr:"A2",     words:"60〜90語",   note:"現在完了・受動態・関係代名詞の初歩" },
    { name:"高1", cefr:"A2〜B1", words:"80〜110語",  note:"関係詞・分詞・比較などを一通り含む" },
    { name:"高2", cefr:"B1",     words:"100〜140語", note:"仮定法・分詞構文などやや複雑な構文" },

     - 各問題の正解と、なぜその選択肢が正解かの解説
     - 各問題がどの要素（上記のタグ名）を問うているかの明示
問題部分はそのまま生徒に配布できる形式にすること。`;

  // 散布図SVG
  function scatterSVG(rec){
    const W=420,H=420,pad=44;
    const sx=v=>pad+v*(W-2*pad), sy=v=>H-pad-v*(H-2*pad);
    let pts='';
    TAGS.forEach(tg=>{
      if(rec.est[tg]===null) return;
      pts+=`<circle cx="${sx(rec.tru[tg])}" cy="${sy(rec.est[tg])}" r="6"
        fill="#2f5d62" fill-opacity="0.75" stroke="#1a2233" stroke-width="0.7"/>`;
    });
    const ticks=[0,0.25,0.5,0.75,1]; let grid='';
    ticks.forEach(t=>{
      grid+=`<line x1="${sx(t)}" y1="${pad}" x2="${sx(t)}" y2="${H-pad}" stroke="#d8d2c4" stroke-width="0.7"/>
        <line x1="${pad}" y1="${sy(t)}" x2="${W-pad}" y2="${sy(t)}" stroke="#d8d2c4" stroke-width="0.7"/>
        <text x="${sx(t)}" y="${H-pad+15}" font-size="10" text-anchor="middle" fill="#8a8474" font-family="monospace">${t}</text>
        <text x="${pad-7}" y="${sy(t)+3}" font-size="10" text-anchor="end" fill="#8a8474" font-family="monospace">${t}</text>`;
    });
    return `<svg class="scatter" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
      <rect x="${pad}" y="${pad}" width="${W-2*pad}" height="${H-2*pad}" fill="#f4f1ea" stroke="#1a2233" stroke-width="1.2"/>
      ${grid}
      <line x1="${sx(0)}" y1="${sy(0)}" x2="${sx(1)}" y2="${sy(1)}" stroke="#b5462f" stroke-width="1.5" stroke-dasharray="5 4"/>
      ${pts}
      <text x="${W/2}" y="${H-7}" font-size="11" text-anchor="middle" fill="#1a2233">仕込んだ真の理解度</text>
      <text x="13" y="${H/2}" font-size="11" text-anchor="middle" fill="#1a2233" transform="rotate(-90 13 ${H/2})">マップの推定値（正答率）</text>
    </svg>`;
  }

  // ============================================================
  // 本番モード：入力データを分析用 data 形式に変換（全テスト回）
  // ============================================================
  function liveToData(){
    const lv=state.live;
    ensureGrid();
    const questions=[], responses=[];
    lv.tests.forEach((t,ti)=>{
      const testNo=ti+1;
      for(let q=0;q<lv.nQ;q++){
        const tg=t.questions[q]||{teacher:[],ai:[]};
        questions.push({test:testNo,q:q+1,
          teacher:tg.teacher||[],ai:tg.ai||[]});
      }
      for(let s=0;s<lv.nStudents;s++){
        for(let q=0;q<lv.nQ;q++){
          const v=(t.grid[s]&&t.grid[s][q]!==undefined)?t.grid[s][q]:null;
          if(v===null) continue;
          responses.push({test:testNo,q:q+1,student:s,correct:v});
        }
      }
    });
    return {
      truth:null, questions, responses,
      cfg:{nStudents:lv.nStudents,nTests:lv.tests.length,nQ:lv.nQ}, mode:'live'
    };
  }

  // CSVパース（test_id,question_id,student_id,correct）
  function parseCSV(text){
    const lines=text.trim().split(/\r?\n/).filter(l=>l.trim());
    const header=lines[0].toLowerCase().split(',').map(s=>s.trim());
    const idx={
      test:header.indexOf('test_id'),
      q:header.indexOf('question_id'),
      s:header.indexOf('student_id'),
      c:header.indexOf('correct')
    };
    if(idx.q<0||idx.s<0||idx.c<0) throw new Error('列名 question_id / student_id / correct が必要です');
    const recs=[];
    for(let i=1;i<lines.length;i++){
      const c=lines[i].split(',').map(s=>s.trim());
      recs.push({
        test: idx.test>=0?c[idx.test]:'test01',
        q:c[idx.q], s:c[idx.s], correct:parseInt(c[idx.c],10)
      });
    }
    return recs;
  }

  // ============================================================
  // イベントバインド
  // ============================================================
  function bind(){
    // モード切替
    root.querySelectorAll('.mode-btn').forEach(b=>{
      b.onclick=()=>{
        if(state.appMode===b.dataset.mode) return;
        state.appMode=b.dataset.mode;
        state.data=null; state.step=0;
        render();
      };
    });
    // ステップタブ
    root.querySelectorAll('.step-tab').forEach(tab=>{
      tab.onclick=()=>{
        const s=+tab.dataset.step;
        // 本番モードのSTEP5（通常問題生成）はデータ未入力でも開ける
        const step5Open = (state.appMode==='live' && s===4);
        if(s>0 && !state.data && !step5Open) return;
        if(state.appMode==='live'&&s===3) return; // 本番はリカバリー無効
        state.step=s; render();
      };
    });

    // --- ダミーモードのスライダー ---
    if(state.appMode==='dummy'){
      const sliders=[
        ['r-st','v-st','nStudents',v=>v,v=>v],
        ['r-ts','v-ts','nTests',v=>v,v=>v],
        ['r-q','v-q','nQ',v=>v,v=>v],
        ['r-sp','v-sp','spread',v=>v/100,v=>(v/100).toFixed(2)],
        ['r-gn','v-gn','gain',v=>v/100,v=>(v/100).toFixed(2)],
        ['r-sd','v-sd','seed',v=>v,v=>v]
      ];
      sliders.forEach(([rid,vid,key,conv,disp])=>{
        const el=root.querySelector('#'+rid); if(!el)return;
        el.oninput=()=>{
          state.cfg[key]=conv(+el.value);
          root.querySelector('#'+vid).textContent=disp(+el.value);
        };
      });
      const gen=root.querySelector('#gen');
      if(gen) gen.onclick=()=>{
        gen.disabled=true; gen.textContent='生成中…';
        setTimeout(()=>{
          state.data=generate({...state.cfg});
          const d=state.data;
          root.querySelector('#gen-result').innerHTML=`<div class="callout" style="margin-top:13px">
            生成完了：生徒 <b>${d.cfg.nStudents}</b>名 ／ テスト <b>${d.cfg.nTests}</b>回 ／
            問題 <b>${d.questions.length}</b>問 ／ 解答 <b>${d.responses.length}</b>件。</div>`;
          state.step=1; render();
        },260);
      };
    }

    // --- 本番モードの操作 ---
    if(state.appMode==='live'){
      // 入力方式タブ
      root.querySelectorAll('.itab').forEach(t=>{
        t.onclick=()=>{ state.inputTab=t.dataset.itab; render(); };
      });
      // 生徒数・問題数スライダー
      const rlst=root.querySelector('#rl-st'), rlq=root.querySelector('#rl-q');
      if(rlst) rlst.oninput=()=>{
        state.live.nStudents=+rlst.value;
        root.querySelector('#lv-st').textContent=rlst.value;
        ensureGrid(); render();
      };
      if(rlq) rlq.oninput=()=>{
        state.live.nQ=+rlq.value;
        root.querySelector('#lv-q').textContent=rlq.value;
        ensureGrid(); render();
      };
      // テスト回タブ（切替・追加・削除）
      root.querySelectorAll('.ttab').forEach(tt=>{
        tt.onclick=()=>{
          const v=tt.dataset.ttab;
          if(v==='add'){
            // 新しい回を追加。問題のタグは直前の回から引き継ぐ
            const lv=state.live;
            const prev=lv.tests[lv.tests.length-1];
            const newQs=prev.questions.map(q=>({teacher:[...q.teacher],ai:[]}));
            lv.tests.push({questions:newQs,grid:[]});
            lv.activeTest=lv.tests.length-1;
            ensureGrid(); render();
          } else if(v==='del'){
            const lv=state.live;
            if(lv.tests.length<=1) return;
            if(!confirm(`第${lv.activeTest+1}回のデータを削除します。よろしいですか？`)) return;
            lv.tests.splice(lv.activeTest,1);
            lv.activeTest=Math.max(0,lv.activeTest-1);
            ensureGrid(); render();
          } else {
            state.live.activeTest=+v;
            render();
          }
        };
      });
      // グリッドのセルクリック（○→×→－）。現在の編集回に書き込む
      root.querySelectorAll('.cell-btn').forEach(btn=>{
        btn.onclick=()=>{
          const s=+btn.dataset.s,q=+btn.dataset.q;
          ensureGrid();
          const at=activeTest();
          const cur=at.grid[s][q];
          at.grid[s][q]= cur===1?0 : cur===0?undefined : 1;
          render();
        };
      });
      // 問題ヘッダクリック → タグ設定
      root.querySelectorAll('th.qhdr').forEach((th,qi)=>{
        th.onclick=()=>openTagPicker(qi);
      });
      // CSVドロップゾーン
      const dz=root.querySelector('#dropzone'), fi=root.querySelector('#fileinp');
      if(dz&&fi){
        dz.onclick=()=>fi.click();
        dz.ondragover=e=>{e.preventDefault();dz.classList.add('drag');};
        dz.ondragleave=()=>dz.classList.remove('drag');
        dz.ondrop=e=>{e.preventDefault();dz.classList.remove('drag');
          if(e.dataTransfer.files[0]) handleCSV(e.dataTransfer.files[0]);};
        fi.onchange=()=>{ if(fi.files[0]) handleCSV(fi.files[0]); };
      }
      const dlt=root.querySelector('#dl-template');
      if(dlt) dlt.onclick=downloadCSVTemplate;
      const expL=root.querySelector('#export-live');
      if(expL) expL.onclick=exportLiveCSV;
      // 「この内容で分析する」
      const apply=root.querySelector('#live-apply');
      if(apply) apply.onclick=()=>{
        const d=liveToData();
        const tagged=d.questions.filter(q=>q.teacher.length>0).length;
        if(d.responses.length===0){
          root.querySelector('#live-result').innerHTML=
            `<div class="callout warn" style="margin-top:12px">解答データがありません。
            表に入力するか、CSVを読み込んでください。</div>`;

        if(tagged===0){
          root.querySelector('#live-result').innerHTML=
            `<div class="callout warn" style="margin-top:12px">問題にタグが未設定です。
            問題ヘッダ Q1… をクリックして教師タグを設定してください。</div>`;
          return;
        }

        root.querySelector('#live-result').innerHTML=`<div class="callout" style="margin-top:12px">
          分析準備完了：問題 <b>${d.questions.length}</b>問（タグ付き${tagged}問）／
          解答 <b>${d.responses.length}</b>件。STEP 2 以降に進めます。</div>`;
        state.step=1; render();

      // AIタグ付けプロンプトを作る
      const mkTag=root.querySelector('#make-tagprompt');

            class="copy-btn" data-copy="pb-tagging">コピー</button></div>
          <div class="small" style="margin-top:5px">これをChatGPT / Claudeに貼り付け、
          返ってきた結果を下の欄②に貼り付けてください。</div>`;
        // コピーボタンを有効化
        const cb=root.querySelector('[data-copy="pb-tagging"]');
        if(cb) cb.onclick=()=>{
          const box=root.querySelector('#pb-tagging');
          navigator.clipboard.writeText(box.childNodes[0].textContent).then(()=>{
            cb.textContent='コピー済'; setTimeout(()=>cb.textContent='コピー',1400);
          });
        };
      };

      // AIの返答を取り込んで ai_tags に反映（現在の編集回に適用）
      const impTag=root.querySelector('#import-aitags');
      if(impTag) impTag.onclick=()=>{

          status.textContent=' AIの返答を貼り付けてください。'; return;

        ensureGrid();

          const i=+qi;

    if(mapNext) mapNext.onclick=()=>{
      const nT=state.data?state.data.cfg.nTests:1;
      if(state.mapViewTest<nT-1){ state.mapViewTest++; render(); }
    };

    // タグ選択モーダルのイベント
    if(state.tagPicker.open){
      root.querySelectorAll('.tag-pick').forEach(el=>{
        el.onclick=()=>{
          const tag=el.dataset.pick;
          const sel=state.tagPicker.selected;
          const i=sel.indexOf(tag);
          if(i>=0) sel.splice(i,1); else sel.push(tag);
          render();
        };
      });
      const ok=root.querySelector('#tagmodal-ok');
      if(ok) ok.onclick=commitTagPicker;
      const cancel=root.querySelector('#tagmodal-cancel');
      if(cancel) cancel.onclick=closeTagPicker;
      const ov=root.querySelector('#tagmodal-overlay');
      if(ov) ov.onclick=e=>{ if(e.target===ov) closeTagPicker(); };
    }
  }

  // 本番モードのグリッド配列を生徒数・問題数・テスト回数に合わせる
  function ensureGrid(){
    const lv=state.live;
    if(!lv.tests || lv.tests.length===0) lv.tests=[{questions:[],grid:[]}];
    lv.tests.forEach(t=>{
      while(t.questions.length<lv.nQ) t.questions.push({teacher:[],ai:[]});
      t.questions.length=lv.nQ;
      while(t.grid.length<lv.nStudents) t.grid.push([]);
      t.grid.length=lv.nStudents;
    });
    if(lv.activeTest>=lv.tests.length) lv.activeTest=lv.tests.length-1;
  }
  // いま編集中のテスト回を返す
  function activeTest(){ return state.live.tests[state.live.activeTest]; }

  // タグ選択モーダルを開く（クリックで選択。番号入力も併用可）
  function openTagPicker(qi){
    ensureGrid();
    const at=activeTest();
    state.tagPicker={
      open:true, qi:qi,
      selected:[...(at.questions[qi].teacher||[])]
    };
    render();
  }
  // モーダルで選んだタグを確定（全テスト回のQ(qi)に適用）
  function commitTagPicker(){
    const tp=state.tagPicker;
    const picked=[...new Set(tp.selected)];
    state.live.tests.forEach(t=>{
      if(t.questions[tp.qi]) t.questions[tp.qi].teacher=picked;
    });
    state.tagPicker={open:false,qi:null,selected:[]};
    render();
  }
  function closeTagPicker(){
    state.tagPicker={open:false,qi:null,selected:[]};
    render();
  }
  // タグ選択モーダルのHTML
  function tagPickerHTML(){
    const tp=state.tagPicker;
    if(!tp.open) return '';
    const cells=TAGS.map((t,i)=>{
      const sel=tp.selected.includes(t);
      return `<div class="tag-pick ${sel?'sel':''}" data-pick="${t}">
        <span class="chk">${sel?'&#10003;':''}</span>
        <span class="tnum">${i+1}</span>
        <span>${TAG_JA[t]}<br><span style="font-size:.66rem;opacity:.6">${t}</span></span>
      </div>`;
    }).join('');
    return `<div class="modal-overlay" id="tagmodal-overlay">
      <div class="modal">
        <h3>Q${tp.qi+1} の教師タグを選択</h3>
        <div class="msub">クリックで選択／解除（複数可）。
        ここで設定したタグは全テスト回のQ${tp.qi+1}に共通で適用されます。</div>
        <div class="tag-pick-grid">${cells}</div>
        <div class="modal-actions">
          <button class="ghost" id="tagmodal-cancel">キャンセル</button>
          <button class="run" id="tagmodal-ok" style="margin-right:0">
            ${tp.selected.length}個を確定</button>
        </div>
      </div>
    </div>`;
  }

  function handleCSV(file){
    const reader=new FileReader();
    reader.onload=()=>{
      try{
        const recs=parseCSV(reader.result);
        // test_id ごとにテスト回を復元
        const testIds=[...new Set(recs.map(r=>r.test))].sort();
        const students=[...new Set(recs.map(r=>r.s))].sort();
        const qs=[...new Set(recs.map(r=>r.q))].sort();
        const sIdx={}; students.forEach((s,i)=>sIdx[s]=i);
        const qIdx={}; qs.forEach((q,i)=>qIdx[q]=i);
        const tIdx={}; testIds.forEach((t,i)=>tIdx[t]=i);

        state.live.nStudents=students.length;
        state.live.nQ=qs.length;
        // テスト回数ぶんの空データを用意
        state.live.tests=testIds.map(()=>({questions:[],grid:[]}));
        state.live.activeTest=0;
        ensureGrid();
        // 各レコードを該当テスト回のグリッドに書き込む
        recs.forEach(r=>{
          const ti=tIdx[r.test], si=sIdx[r.s], qi=qIdx[r.q];
          if(ti!==undefined&&si!==undefined&&qi!==undefined)
            state.live.tests[ti].grid[si][qi]=(r.correct===1?1:0);
        });
        const st=root.querySelector('#csv-status');
        if(st) st.textContent=` 読込成功：テスト${testIds.length}回 × `
          +`生徒${students.length}名 × 問題${qs.length}問。`
          +'問題のタグは「表に手入力」タブで設定してください。';
        state.inputTab='grid'; render();
      }catch(e){
        const st=root.querySelector('#csv-status');
        if(st) st.textContent=' エラー: '+e.message;
      }
    };
    reader.readAsText(file);
  }

  // 入力用CSVテンプレート（現在のテスト回数ぶん）
  function downloadCSVTemplate(){
    const lv=state.live;
    let csv='test_id,question_id,student_id,correct\n';
    for(let t=1;t<=lv.tests.length;t++)
      for(let q=1;q<=lv.nQ;q++)
        for(let s=1;s<=lv.nStudents;s++)
          csv+=`test${String(t).padStart(2,'0')},`
            +`Q${String(q).padStart(2,'0')},`
            +`S${String(s).padStart(2,'0')},\n`;
    downloadFile(csv,'responses_template.csv');
  }

  // 入力済みの全テスト回データをCSVで書き出し（保存・引き継ぎ用）
  function exportLiveCSV(){
    const lv=state.live;
    ensureGrid();
    let csv='test_id,question_id,student_id,correct\n';
    let count=0;
    lv.tests.forEach((t,ti)=>{
      for(let q=0;q<lv.nQ;q++){
        for(let s=0;s<lv.nStudents;s++){
          const v=(t.grid[s]&&t.grid[s][q]!==undefined)?t.grid[s][q]:null;
          if(v===null) continue;
          csv+=`test${String(ti+1).padStart(2,'0')},`
            +`Q${String(q+1).padStart(2,'0')},`
            +`S${String(s+1).padStart(2,'0')},${v}\n`;
          count++;
        }
      }
    });
    const st=root.querySelector('#csv-status');
    if(count===0){
      if(st) st.textContent=' 保存できる入力データがありません。';
      return;
    }
    downloadFile(csv,'responses_saved.csv');
    if(st) st.textContent=` ${count}件の解答データをCSVに保存しました。`;
  }

  function exportPlan(){
    const map=buildMap(state.data,state.data.cfg.nTests);
    const valid=TAGS.filter(t=>map[t]!==null);
    const TOTAL=20; const weights={}; let wsum=0;
    valid.forEach(t=>{const w=Math.max(0.05,1-map[t]);weights[t]=w;wsum+=w;});
    let csv='tag,tag_ja,class_accuracy,planned_questions\n';
    valid.map(t=>({t,acc:map[t],n:Math.max(1,Math.round(TOTAL*weights[t]/wsum))}))
      .sort((a,b)=>a.acc-b.acc)
      .forEach(p=>csv+=`${p.t},${TAG_JA[p.t]},${p.acc.toFixed(4)},${p.n}\n`);
    downloadFile(csv,'question_plan.csv');
  }

  function downloadFile(text,name){
    const blob=new Blob([text],{type:'text/csv'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download=name; a.click();
  }

  // HTMLエスケープ（プロンプト中の < > & を安全に表示）
  function escapeHTML(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;');
  }

  // 初期化
  ensureGrid();
  render();
})();
</script>
</body>
</html>
