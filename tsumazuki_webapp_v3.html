  // AIにタグ付けさせるためのプロンプトを組み立てる。
  //   questionText が空 → 問題はPDF等で別途AIに渡す前提（「上記の英語の問題」と書く）
  //   questionText に貼り付けあり → 末尾に【対象の問題】セクションとして埋め込む
  // 両方併用も可能（PDFを添付しつつテキストでも示す等）。
  // qtextをQ番号で分割し {1: "Q1の問題文", 2: "Q2の問題文", ...} を返す
  function extractQuestionTexts(text){
    const result = {};
    if(!text||!text.trim()) return result;
    // "Q1:" "Q 2:" "Q1：" など各種表記に対応
    const parts = text.split(/(?=(?:^|\n)\s*Q\s*\d+\s*[:：])/m);
    parts.forEach(part=>{
      const m = part.trim().match(/^Q\s*(\d+)\s*[:：]\s*([\s\S]*)/i);
      if(m) result[parseInt(m[1],10)] = m[2].trim();
    });
    // Qで始まらない場合はQ1扱い
    if(Object.keys(result).length===0 && text.trim())
      result[1] = text.trim();
    return result;
  }

  // STEP3：不一致問題リストからフィードバック用プロンプトを生成
  //   mismatches: [{qn, teacher, ai, missed, extra, text}, ...]
  function buildFeedbackPrompt(mismatches){
    const tagList = TAGS.map(t=>` - ${t}（${TAG_JA[t]}）`).join('\n');
    const header = `前回あなたが付けたタグについて、教師が確認した結果をフィードバックします。
以下の問題でタグが正解と異なっていました。修正方針を確認した上で、
このチャットで引き続きタグ付けをする場合の参考にしてください。

【タグ一覧（使用可能なタグ）】
${tagList}

【フィードバック】`;

    const items = mismatches.map(m=>{
      const lines = [];
      lines.push(`▼ Q${m.qn}`);
      if(m.text) lines.push(`【問題文】\n${m.text}`);
      lines.push(`【教師タグ（正解）】${m.teacher.join('; ')}`);
      lines.push(`【AIが付けたタグ】${m.ai.join('; ')}`);
      if(m.missed.length)
        lines.push(`【見落とし】${m.missed.map(t=>`${t}（${TAG_JA[t]}）`).join('、')} → 本来付けるべきでした`);
      if(m.extra.length)
        lines.push(`【過剰付与】${m.extra.map(t=>`${t}（${TAG_JA[t]}）`).join('、')} → 付けるべきではありませんでした`);
      return lines.join('\n');
    }).join('\n\n');

    const footer = `\n\n【依頼】
上記のフィードバックを踏まえ、今後の問題に同じミスをしないよう注意してください。
次の問題のタグ付けに進む準備ができたら「了解しました」と答えてください。`;

    return `${header}\n\n${items}${footer}`;
  }

  function buildTaggingPrompt(questionText){
    const tagList = TAGS.map(t=>` - ${t}（${TAG_JA[t]}）`).join('\n');
    const hasText = questionText && questionText.trim();
    const intro = hasText
      ? 'あなたは英語教育の専門家です。\n下の【対象の問題】に示した英語の問題それぞれについて、その問題が問うている文法・読解要素を、'
      : 'あなたは英語教育の専門家です。\n上記の英語の問題それぞれについて、その問題が問うている文法・読解要素を、';
    const head = `${intro}
下の【タグ一覧】の中から選んでください。
【タグ一覧】（この中の語だけを使うこと。一覧にない語は使わない）
${tagList}
【判定のルール】
 - 1問につき1〜2個のタグを選ぶ（最も中心的に問われている要素を優先）
 - 必ずタグ一覧の英語の語（vocabulary 等）で答える
 - 各問題について、なぜそのタグを選んだか一文で理由も書く
【出力形式】次の形式を厳守してください。
Q1: tag1;tag2
理由: …
Q2: tag1
理由: …`;
    if(!hasText) return head;
    return `${head}

【対象の問題】
${questionText.trim()}`;
  }

  // AIの返答（Q1: tag;tag 形式）を解析して問題ごとのタグ配列にする
  function parseTaggingReply(text){
    const result = {};   // { 0: ['vocabulary'], 1: [...] }
    // ハイフン入りタグを「スペース表記」でも照合できるよう対応表を作る
    const norm = {};     // 'relative clause' -> 'relative-clause'
    TAGS.forEach(t=>{ norm[t]=t; norm[t.replace(/-/g,' ')]=t; });
    const lines = text.split(/\r?\n/);
    for(const line of lines){
      const m = line.match(/Q\s*(\d+)\s*[:：]\s*(.+)/i);
      if(!m) continue;
      const qi = parseInt(m[1],10) - 1;
      // セミコロン・読点・スラッシュで区切る（スペースは区切らない）
      const tags = m[2].split(/[;,；、\/]+/)
        .map(s=>s.trim().toLowerCase())
        .map(s=>norm[s])               // 正規化（一覧外は undefined）
        .filter(Boolean);
      if(qi>=0) result[qi] = [...new Set(tags)];
    }
    return result;
  }

  // parseTaggingReplyの逆変換：現在の回のai_tagsを「Q1: tag;tag」形式のテキストにする
  //   （問題タグCSVを読み込んだ直後、STEP1bのテキストエリアに反映するために使う）
  function aiTagsToReplyText(test){
    if(!test||!test.questions) return '';
    const lines=[];
    test.questions.forEach((q,i)=>{
      if(q&&q.ai&&q.ai.length>0) lines.push(`Q${i+1}: ${q.ai.join(';')}`);
    });
    return lines.join('\n');
  }

  // 生成AI向けプロンプトの自動組み立て（弱点連動）
  //   p           : {tag, n, acc} 出題対象
  //   levelName   : 難易度（'中1'〜'高3'。未指定なら null）
  //   exampleText : 例示問題のテキスト（未指定なら null）
  function buildPrompt(p, levelName, exampleText){
    const levelNote = p.acc<0.5
      ? 'このクラスはこの分野が大きな弱点です。基礎から段階的に。'
      : 'このクラスはこの分野がやや弱いです。標準レベルで。';
    // 学年・語数の指定
    let levelLine, wordsLine;
    if(levelName){
      const lv=levelInfo(levelName);
      levelLine = `【対象の学年・レベル】${lv.name}（CEFR ${lv.cefr} 相当）― ${lv.note}`;
      wordsLine = `${lv.words}程度の英文パッセージ（課題文）`;
    } else {
      levelLine = `【対象】高校生・クラス平均正答率${(p.acc*100).toFixed(0)}%`;
      wordsLine = `80〜120語程度の英文パッセージ（課題文）`;
    }
    // 例示問題ブロック（あれば末尾に追加）
    const exampleBlock = exampleText && exampleText.trim()
      ? `\n【難易度の見本】次の問題と同程度の難易度・語彙・構文レベルで作成してください。
（あくまで難易度の目安。下の見本そのものを真似た問題は作らない。）
─────
${exampleText.trim()}
─────\n`
      : '';
    return `あなたは英語の問題作成者です。
次の条件で英文読解問題を${p.n}問作成してください。

【強化したい文法・読解要素】${TAG_JA[p.tag]}（${p.tag}）
${levelLine}
【方針】${levelNote}
【各問題の構成】
 - ${wordsLine}
 - その英文に関する設問1つ（4択）
【使用言語】英文パッセージ（課題文）は英語で書くこと。
それ以外の設問文・選択肢・解説・指示はすべて日本語で書くこと。
【難易度】${p.n}問すべて同程度の難易度に揃えること。${exampleBlock}
【出力の順序】次の順で出力すること。
 1. まず ${p.n}問すべての「問題」（英文パッセージ＋設問＋選択肢）を続けて出題する。
    この部分には正解・解説・タグを書かないこと。
 2. すべての問題を出し終えたあとに「───」で区切り、
    末尾に「【解答・解説】」としてまとめて次を記載する。
     - 各問題の正解と、なぜその選択肢が正解かの解説
     - 各問題が「${p.tag}」を問うていることが分かる箇所の明示
問題部分はそのまま生徒に配布できる形式にすること。`;
  }

  // 生徒一人分のパーソナライズプロンプトを生成
  // 弱点TOP（acc < 0.7）を最大3タグ抽出し、その生徒専用の文面を組み立てる
  function buildPromptForStudent(data, studentIdx, levelName, exampleText){
    const map = buildMapForStudent(data, studentIdx, null);
    const weakTags = TAGS
      .filter(t => map[t] !== null && map[t] < 0.7)
      .sort((a,b) => map[a]-map[b])
      .slice(0, 3);
    if(weakTags.length === 0) return null; // 弱点なし

    const sid = 'S'+String(studentIdx+1).padStart(2,'0');
    const totalAcc = TAGS.filter(t=>map[t]!==null).length > 0
      ? TAGS.filter(t=>map[t]!==null).reduce((a,t)=>a+map[t],0)
        / TAGS.filter(t=>map[t]!==null).length
      : null;

    const weakDesc = weakTags
      .map(t=>`・${TAG_JA[t]}（${t}）― 正答率 ${(map[t]*100).toFixed(0)}%`)
      .join('\n');

    let levelLine, wordsLine;
    if(levelName){
      const lv = levelInfo(levelName);
      levelLine = `【対象の学年・レベル】${lv.name}（CEFR ${lv.cefr} 相当）― ${lv.note}`;
      wordsLine = `${lv.words}程度の英文パッセージ（課題文）`;
    } else {
      levelLine = `【対象】高校生`;
      wordsLine = `80〜120語程度の英文パッセージ（課題文）`;
    }

    const totalQs = weakTags.length * 3; // 各弱点タグにつき3問
    const tagSections = weakTags.map(t=>{
      const acc = map[t];
      const priority = acc < 0.4 ? '最優先（基礎から丁寧に）'
                     : acc < 0.6 ? '重点強化（標準レベルで）'
                     : '底上げ（やや応用も含めて）';
      return `◆ ${TAG_JA[t]}（${t}）― 正答率 ${(acc*100).toFixed(0)}%　→ ${priority}　3問`;
    }).join('\n');

    const exampleBlock = exampleText && exampleText.trim()
      ? `\n【難易度の見本】次の問題と同程度の難易度・語彙・構文レベルで作成してください。\n（あくまで難易度の目安。見本をそのまま真似た問題は作らない。）\n─────\n${exampleText.trim()}\n─────\n`
      : '';

    return `あなたは英語の問題作成者です。
以下の生徒の弱点データに基づき、個別強化問題を合計${totalQs}問作成してください。

【生徒ID】${sid}
【この生徒の弱点】
${weakDesc}

【出題内訳】
${tagSections}

${levelLine}
【各問題の構成】
 - ${wordsLine}
 - その英文に関する設問1つ（4択）
【使用言語】英文パッセージは英語で。設問・選択肢・解説は日本語で。
【難易度】各タグの問題はすべて同程度の難易度に揃えること。${exampleBlock}
【出力の順序】
 1. まず全問題（英文＋設問＋選択肢）を続けて出力する。正解・解説は書かない。
 2. 全問題の後に「───」で区切り、「【解答・解説】」として各問の正解と解説を出力する。
問題部分はそのまま生徒に配布できる形式にすること。`;
  }

  // 全生徒分のプロンプトカードHTMLを生成（STEP5-A 個人モード用）
  function buildAllStudentPromptsHTML(data, levelName, exampleText){
    const nS = data.cfg.nStudents;
    const cards = [];
    for(let si=0; si<nS; si++){
      const map = buildMapForStudent(data, si, null);
      const weakTags = TAGS
        .filter(t=>map[t]!==null && map[t]<0.7)
        .sort((a,b)=>map[a]-map[b])
        .slice(0,3);
      const validTags = TAGS.filter(t=>map[t]!==null);
      const totalAcc = validTags.length
        ? validTags.reduce((a,t)=>a+map[t],0)/validTags.length : null;
      const sid = 'S'+String(si+1).padStart(2,'0');
      const accPct = totalAcc!==null ? Math.round(totalAcc*100) : null;
      const pillCls = accPct===null?'': accPct>=70?'ok': accPct>=50?'mid':'';

      if(weakTags.length===0){
        cards.push(`<div class="stu-prompt-card">
          <div class="stu-prompt-head">
            <span>${sid}</span>
            ${accPct!==null?`<span class="stu-acc-pill ok">総合 ${accPct}%</span>`:''}
            <span style="color:var(--good);font-size:.8rem">✅ 弱点なし（全タグ70%以上）</span>
          </div>
        </div>`);
        continue;
      }

      const prompt = buildPromptForStudent(data, si, levelName, exampleText);
      const pid = 'stu-pb-'+si;
      const tagPills = weakTags.map(t=>`<span class="stu-weak-tag">${TAG_JA[t]} ${(map[t]*100).toFixed(0)}%</span>`).join('');

      cards.push(`<div class="stu-prompt-card">
        <div class="stu-prompt-head">
          <span>${sid}</span>
          ${accPct!==null?`<span class="stu-acc-pill ${pillCls}">総合 ${accPct}%</span>`:''}
          <span style="font-weight:400;font-size:.78rem;color:var(--mute)">弱点${weakTags.length}タグ</span>
        </div>
        <div class="stu-prompt-body">
          <div class="stu-weak-tags">${tagPills}</div>
          <div class="qr-area">
            <div class="qr-canvas-wrap" id="qr-wrap-${si}"></div>
            <div style="flex:1">
              <div class="qr-prompt-text" id="${pid}">${escapeHTML(prompt||'')}</div>
              <div class="qr-btns">
                <button class="ghost" data-copy-stu="${si}" title="詳細な指示を含む完全版プロンプトをコピー">&#128203; コピー（完全版）</button>
                <button class="ghost" data-qr-stu="${si}" title="生徒がスキャンして即AIに貼り付けられる簡易QRを生成">&#9636; QRコード（簡易版）</button>
                <button class="ghost" data-qr-dl="${si}" style="display:none">&#11015; QR画像を保存</button>
              </div>
              <div class="qr-note" id="qr-note-${si}"></div>
            </div>
          </div>
        </div>
      </div>`);
    }
    return cards.join('');
  }

  // QRコード用プロンプト（完全ASCII・qrcodejsのescape()計測対策）
  // qrcodejsは内部でescape()を使うため日本語1文字が約6倍に膨張する。
  // 純粋なASCIIなら1文字=1単位。ECC L上限2956内に収まる。
  // 完全版（日本語）はコピーボタンで別途配布。
  function buildShortPromptForQR(data, studentIdx, levelName){
    const map = buildMapForStudent(data, studentIdx, null);
    const weakTags = TAGS
      .filter(t=>map[t]!==null && map[t]<0.7)
      .sort((a,b)=>map[a]-map[b])
      .slice(0,3);
    if(weakTags.length===0) return null;

    const sid = 'S'+String(studentIdx+1).padStart(2,'0');
    // 学年をASCII表記にマップ
    const lvMap = {'中1':'JHS1','中2':'JHS2','中3':'JHS3',
                   '高1':'SHS1','高2':'SHS2','高3':'SHS3'};
    const lvStr = levelName ? (lvMap[levelName]||levelName) : 'SHS';
    const totalQ = weakTags.length * 3;

    // タグ名はすでにASCII（relative-clause等）
    const tagLines = weakTags.map(t=>{
      const pct = Math.round(map[t]*100);
      const pri = map[t]<0.5 ? '[TOP]' : '[MID]';
      return `-${t} ${pct}% =>${3}Qs${pri}`;
    }).join('\n');

    // 出力はすべてASCII（スラッシュ・括弧等で簡略化）
    return `${totalQ} English reading Qs for ${sid} (${lvStr}).
Weak areas:
${tagLines}
Each Q: 80-140 word passage + 4-choice Q.
Passage=English, Qs/choices/answers=Japanese.
Print all ${totalQ} Qs first, then [---] then answers.`;
  }

  // 難易度レベル（中1〜高3）。CEFR と語数の目安を併記して生成AIに伝わりやすくする
  const LEVELS = [
    { name:"中1", cefr:"A1",     words:"30〜50語",   note:"be動詞・一般動詞の現在形が中心" },
    { name:"中2", cefr:"A1〜A2", words:"50〜70語",   note:"過去形・未来表現・助動詞が中心" },
    { name:"中3", cefr:"A2",     words:"60〜90語",   note:"現在完了・受動態・関係代名詞の初歩" },
    { name:"高1", cefr:"A2〜B1", words:"80〜110語",  note:"関係詞・分詞・比較などを一通り含む" },
    { name:"高2", cefr:"B1",     words:"100〜140語", note:"仮定法・分詞構文などやや複雑な構文" },
    { name:"高3", cefr:"B1〜B2", words:"120〜170語", note:"抽象的な内容・推論を要する読解" },
  ];
  function levelInfo(name){
    return LEVELS.find(l=>l.name===name) || LEVELS[3];
  }

  // 問題文テキストから Q1（最初の問題）の部分だけを抽出する。
  // Q1〜Q2 など Q番号で区切られた文を想定。区切りが無ければ全文を返す。
  function extractFirstQuestion(text){
    if(!text) return '';
    const t = text.trim();
    if(!t) return '';
    const m = t.match(/(^|\n)\s*Q\s*[2-9]\d*\b/i);
    if(m && m.index>0) return t.slice(0,m.index).trim();
    return t;
  }
  // STEP5-A用：例示問題チェックボックスのHTML
  function weakExampleCheckHTML(){
    const qtext = (activeTest()&&activeTest().qtext)||state.live.qtext||'';
    const hasText = qtext.trim().length>0;
    const example = hasText ? extractFirstQuestion(qtext) : '';
    const preview = example.length>80 ? example.slice(0,80)+'…' : example;
    if(!hasText){
      return `<div class="small" style="color:var(--mute);margin:8px 0">
        ※ STEP 1b の「①問題文を貼り付け」に問題が入っていれば、
        その Q1 を例示として難易度の見本にできます（現在は未入力）。</div>`;
    }
    return `<div class="weak-ex-row">
      <label class="weak-ex-label">
        <input type="checkbox" id="weak-use-ex" ${state.weakGen.useExample?'checked':''}>
        <span>例示問題を使う（STEP 1b の問題文 Q1 を難易度の見本としてプロンプトに含める）</span>
      </label>
      <div class="weak-ex-preview" title="${escapeAttr(example)}">
        Q1の例示プレビュー：<span style="color:var(--mute)">${escapeHTML(preview)}</span>
      </div>
    </div>`;
  }
  function escapeAttr(s){
    return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;')
      .replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // 通常問題（つまずきマップに依存しない）用プロンプトの組み立て
  //   plan: [{tag, n}, ...]（出題したいタグと問題数）, levelName: 難易度
  function buildCustomPrompt(plan, levelName){
    const lv = levelName ? levelInfo(levelName) : null;
    const total=plan.reduce((a,p)=>a+p.n,0);
    const tagLines=plan.map(p=>
      ` - ${TAG_JA[p.tag]}（${p.tag}）：${p.n}問`).join('\n');
    const levelLine = lv
      ? `【対象の学年・レベル】${lv.name}（CEFR ${lv.cefr} 相当）
【レベルの目安】${lv.note}`
      : '【対象の学年・レベル】高校生向け（標準）';
    const wordsLine = lv
      ? `${lv.words}程度の英文パッセージ（課題文）`
      : `80〜120語程度の英文パッセージ（課題文）`;
    return `あなたは英語の問題作成者です。
次の条件で英文読解問題を合計${total}問作成してください。

${levelLine}
【出題する文法・読解要素と問題数】
${tagLines}
【各問題の構成】
 - ${wordsLine}
 - その英文に関する設問1つ（4択）
【使用言語】英文パッセージ（課題文）は英語で書くこと。
それ以外の設問文・選択肢・解説・指示はすべて日本語で書くこと。
【難易度】${lv?'指定した学年レベルに揃え':'同程度の難易度に揃え'}、問題ごとのばらつきを抑えること。
【出力の順序】次の順で出力すること。
 1. まず ${total}問すべての「問題」（英文パッセージ＋設問＋選択肢）を続けて出題する。
    この部分には正解・解説・タグを書かないこと。
 2. すべての問題を出し終えたあとに「───」で区切り、
    末尾に「【解答・解説】」としてまとめて次を記載する。
     - 各問題の正解と、なぜその選択肢が正解かの解説
     - 各問題がどの要素（上記のタグ名）を問うているかの明示
問題部分はそのまま生徒に配布できる形式にすること。`;
  }

  // 散布図SVG
  function scatterSVG(rec){
    const W=420,H=420,pad=44;
    const sx=v=>pad+v*(W-2*pad), sy=v=>H-pad-v*(H-2*pad);
    let pts='';
    TAGS.forEach(tg=>{
      if(rec.est[tg]===null) return;
      pts+=`<circle cx="${sx(rec.tru[tg])}" cy="${sy(rec.est[tg])}" r="6"
        fill="#2f5d62" fill-opacity="0.75" stroke="#1a2233" stroke-width="0.7"/>`;
    });
    const ticks=[0,0.25,0.5,0.75,1]; let grid='';
    ticks.forEach(t=>{
      grid+=`<line x1="${sx(t)}" y1="${pad}" x2="${sx(t)}" y2="${H-pad}" stroke="#d8d2c4" stroke-width="0.7"/>
        <line x1="${pad}" y1="${sy(t)}" x2="${W-pad}" y2="${sy(t)}" stroke="#d8d2c4" stroke-width="0.7"/>
        <text x="${sx(t)}" y="${H-pad+15}" font-size="10" text-anchor="middle" fill="#8a8474" font-family="monospace">${t}</text>
        <text x="${pad-7}" y="${sy(t)+3}" font-size="10" text-anchor="end" fill="#8a8474" font-family="monospace">${t}</text>`;
    });
    return `<svg class="scatter" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
      <rect x="${pad}" y="${pad}" width="${W-2*pad}" height="${H-2*pad}" fill="#f4f1ea" stroke="#1a2233" stroke-width="1.2"/>
      ${grid}
      <line x1="${sx(0)}" y1="${sy(0)}" x2="${sx(1)}" y2="${sy(1)}" stroke="#b5462f" stroke-width="1.5" stroke-dasharray="5 4"/>
      ${pts}
      <text x="${W/2}" y="${H-7}" font-size="11" text-anchor="middle" fill="#1a2233">仕込んだ真の理解度</text>
      <text x="13" y="${H/2}" font-size="11" text-anchor="middle" fill="#1a2233" transform="rotate(-90 13 ${H/2})">マップの推定値（正答率）</text>
    </svg>`;
  }

  // ============================================================
  // 本番モード：入力データを分析用 data 形式に変換（全テスト回）
  // ============================================================
  function liveToData(){
    const lv=state.live;
    ensureGrid();
    const questions=[], responses=[];
    lv.tests.forEach((t,ti)=>{
      const testNo=ti+1;
      if(t.kind!=='individual'){
        // 共通テスト：全員同じ問題（q = 1..nQ）
        const nQ=t.nQ||lv.nQ;
        for(let q=0;q<nQ;q++){
          const tg=t.questions[q]||{teacher:[],ai:[],teacherSource:null,subLabel:null,parentQ:null};
          // サブ問は parentQ+1 を q の代表値として使い、サブラベルを別途記録
          const qNum = tg.subLabel!==null ? (tg.parentQ+1) : (q+1);
          questions.push({test:testNo,q:qNum,subLabel:tg.subLabel||null,qIdx:q,
            teacher:tg.teacher||[],ai:tg.ai||[],
            teacherSource:tg.teacherSource||null});
        }
        for(let s=0;s<lv.nStudents;s++){
          for(let q=0;q<nQ;q++){
            const v=(t.grid[s]&&t.grid[s][q]!==undefined)?t.grid[s][q]:null;
            if(v===null||v===undefined) continue;
            const tg=t.questions[q]||{};
            const qNum = tg.subLabel!==null ? (tg.parentQ+1) : (q+1);
            responses.push({test:testNo,q:qNum,subLabel:tg.subLabel||null,qIdx:q,student:s,correct:v});
          }
        }
      } else {
        // 個人別問題：生徒ごとに別の問題。q空間を生徒ごとに分離する
        //   qIDは (生徒index+1)*1000 + 問題番号 として衝突を防ぐ
        for(let s=0;s<lv.nStudents;s++){
          const ps=t.perStudent[s]; if(!ps) continue;
          const base=(s+1)*1000;
          for(let q=0;q<ps.nQ;q++){
            const tg=ps.questions[q]||{teacher:[],ai:[],teacherSource:null};
            const qid=base+q+1;
            questions.push({test:testNo,q:qid,
              teacher:tg.teacher||[],ai:tg.ai||[],
              teacherSource:tg.teacherSource||null});
            const v=ps.answers[q];
            if(v===null||v===undefined) continue;
            responses.push({test:testNo,q:qid,student:s,correct:v});
          }
        }
      }
    });
    return {
      truth:null, questions, responses,
      cfg:{nStudents:lv.nStudents,nTests:lv.tests.length,nQ:lv.nQ,
        testKinds: lv.tests.map(t=>t.kind||'common'),
        testNQs: lv.tests.map(t=>t.nQ||lv.nQ)}, mode:'live'
    };
  }

  // CSVパース（test_id,question_id,student_id,correct）
  function parseCSV(text){
    const lines=text.trim().split(/\r?\n/).filter(l=>l.trim());
    const header=lines[0].toLowerCase().split(',').map(s=>s.trim());
    const idx={
      test:header.indexOf('test_id'),
      q:header.indexOf('question_id'),
      s:header.indexOf('student_id'),
      c:header.indexOf('correct')
    };
    if(idx.q<0||idx.s<0||idx.c<0) throw new Error('列名 question_id / student_id / correct が必要です');
    const recs=[];
    for(let i=1;i<lines.length;i++){
      const c=lines[i].split(',').map(s=>s.trim());
      recs.push({
        test: idx.test>=0?c[idx.test]:'test01',
        q:c[idx.q], s:c[idx.s], correct:parseInt(c[idx.c],10)
      });
    }
    return recs;
  }

  // ============================================================
  // イベントバインド
  // ============================================================
  function bind(){
    // モード切替
    root.querySelectorAll('.mode-btn').forEach(b=>{
      b.onclick=()=>{
        if(state.appMode===b.dataset.mode) return;
        state.appMode=b.dataset.mode;
        state.data=null; state.step=0;
        render();
      };
    });
    // セッション保存バー
    const ssJson = root.querySelector('#sess-save-json');
    if(ssJson) ssJson.onclick = exportSession;

    const ssLoad = root.querySelector('#sess-load-inp');
    if(ssLoad) ssLoad.onchange = e => {
      if(e.target.files[0]) importSession(e.target.files[0]);
      e.target.value = '';
    };

    const ssToggle = root.querySelector('#sess-autosave-toggle');
    if(ssToggle) ssToggle.onclick = () => {
      const enabled = autoSaveEnabled();
      localStorage.setItem(LS_AUTO, enabled ? 'off' : 'on');
      if(!enabled) autoSave(); // 有効にした瞬間に保存
      render();
    };

    // ステップタブ
    root.querySelectorAll('.step-tab').forEach(tab=>{
      tab.onclick=()=>{
        const s=+tab.dataset.step;
        // 本番モードのSTEP5（通常問題生成）はデータ未入力でも開ける
        const step5Open = (state.appMode==='live' && s===4);
        if(s>0 && !state.data && !step5Open) return;
        if(state.appMode==='live'&&s===3) return; // 本番はリカバリー無効
        state.step=s; render();
      };
    });

    // --- ダミーモードのスライダー ---
    if(state.appMode==='dummy'){
      const sliders=[
        ['r-st','v-st','nStudents',v=>v,v=>v],
        ['r-ts','v-ts','nTests',v=>v,v=>v],
        ['r-q','v-q','nQ',v=>v,v=>v],
        ['r-sp','v-sp','spread',v=>v/100,v=>(v/100).toFixed(2)],
        ['r-gn','v-gn','gain',v=>v/100,v=>(v/100).toFixed(2)],
        ['r-sd','v-sd','seed',v=>v,v=>v]
      ];
      sliders.forEach(([rid,vid,key,conv,disp])=>{
        const el=root.querySelector('#'+rid); if(!el)return;
        el.oninput=()=>{
          state.cfg[key]=conv(+el.value);
          root.querySelector('#'+vid).textContent=disp(+el.value);
        };
      });
      const gen=root.querySelector('#gen');
      if(gen) gen.onclick=()=>{
        gen.disabled=true; gen.textContent='生成中…';
        setTimeout(()=>{
          state.data=generate({...state.cfg});
          state.dummyDataViewTest=0;  // プレビューは第1回から表示
          const d=state.data;
          root.querySelector('#gen-result').innerHTML=`<div class="callout" style="margin-top:13px">
            生成完了：生徒 <b>${d.cfg.nStudents}</b>名 ／ テスト <b>${d.cfg.nTests}</b>回 ／
            問題 <b>${d.questions.length}</b>問 ／ 解答 <b>${d.responses.length}</b>件。
            STEP 2 に進みました。<b>STEP 1 タブに戻ると、生成された生徒データの参考表示を確認できます。</b></div>`;
          state.step=1; render();   // STEP 2 へ自動遷移（mapを見せる）
        },260);
      };
    }

    // --- 本番モードの操作 ---
    if(state.appMode==='live'){
      // 入力方式タブ
      root.querySelectorAll('.itab').forEach(t=>{
        t.onclick=()=>{ state.inputTab=t.dataset.itab; render(); };
      });
      // 生徒数スライダー
      const rlst=root.querySelector('#rl-st');
      if(rlst) rlst.oninput=()=>{
        state.live.nStudents=+rlst.value;
        root.querySelector('#lv-st').textContent=rlst.value;
        ensureGrid(); render();
      };
      // テスト回タブ（切替・追加・削除）
      root.querySelectorAll('.ttab').forEach(tt=>{
        tt.onclick=()=>{
          const v=tt.dataset.ttab;
          if(v==='add'){
            // 新しい回を追加。問題のタグは直前の回（共通テスト）から引き継ぐ
            const lv=state.live;
            const prev=lv.tests[lv.tests.length-1];
            const prevQs=(prev.kind==='individual')
              ? (prev.perStudent[0]?prev.perStudent[0].questions:[])
              : (prev.questions||[]);
            const prevNQ=prev.nQ||lv.nQ;
            const newQs=prevQs.map(q=>({teacher:[...(q.teacher||[])],ai:[],
              teacherSource:q.teacherSource||null}));
            // 追加回は「個人別問題」をデフォルトに（弱点補強の結果を記録する想定）。
            lv.tests.push({kind:'individual', nQ:prevNQ, perStudent:[]});
            lv.activeTest=lv.tests.length-1;
            lv.indivStudentIdx=0;
            ensureGrid();
            // 直前回のタグを各生徒の初期問題タグに反映（任意の出発点）
            const nt=lv.tests[lv.activeTest];
            nt.perStudent.forEach(ps=>{
              for(let i=0;i<ps.questions.length&&i<newQs.length;i++){
                ps.questions[i].teacher=[...newQs[i].teacher];
                ps.questions[i].teacherSource=newQs[i].teacherSource;
              }
            });
            render();
          } else if(v==='del'){
            const lv=state.live;
            if(lv.tests.length<=1) return;
            if(!confirm(`第${lv.activeTest+1}回のデータを削除します。よろしいですか？`)) return;
            lv.tests.splice(lv.activeTest,1);
            lv.activeTest=Math.max(0,lv.activeTest-1);
            ensureGrid(); render();
          } else {
            state.live.activeTest=+v;
            render();
          }
        };
      });
      // テスト回の種別（共通/個人別）ラジオ
      root.querySelectorAll('input[name="testkind"]').forEach(r=>{
        r.onchange=()=>{
          ensureGrid();
          state.live.tests[state.live.activeTest].kind=r.value;
          state.live.indivStudentIdx=0;
          ensureGrid(); render();
        };
      });
      // 共通テスト回：この回の問題数スライダー
      const rlrq=root.querySelector('#rl-roundq');
      if(rlrq) rlrq.oninput=()=>{
        ensureGrid();
        const at=activeTest(); if(!at||at.kind==='individual') return;
        const targetMain=+rlrq.value;
        const curMain=mainQCount(at.questions);
        const lv=state.live;
        if(targetMain>curMain){
          // 大問を末尾に追加
          const add=targetMain-curMain;
          for(let i=0;i<add;i++){
            at.questions.push(emptyQuestion());
            // grid: 各生徒行に列を追加
            (at.grid||[]).forEach(row=>row.push(null));
          }
          at.nQ=at.questions.length;
        } else if(targetMain<curMain){
          // 末尾の大問（とそのサブ問）を削除
          let toRemove=curMain-targetMain;
          while(toRemove>0&&at.questions.length>0){
            const last=at.questions.length-1;
            const q=at.questions[last];
            if(q.subLabel!==null){
              // サブ問なら親ごと（兄弟サブ問も）削除
              const pq=q.parentQ;
              const idxs=at.questions.map((qq,i)=>qq.parentQ===pq?i:-1).filter(i=>i>=0);
              (at.grid||[]).forEach(row=>row.splice(idxs[0],idxs.length));
              at.questions.splice(idxs[0],idxs.length);
              toRemove--;
            } else {
              (at.grid||[]).forEach(row=>row.splice(last,1));
              at.questions.splice(last,1);
              toRemove--;
            }
          }
          at.nQ=at.questions.length;
        }
        root.querySelector('#lv-roundq').textContent=mainQCount(at.questions);
        ensureGrid(); render();
      };
      // 個人別回：生徒切替（◀▶・プルダウン）
      const ipPrev=root.querySelector('#indiv-prev');
      if(ipPrev) ipPrev.onclick=()=>{
        if(state.live.indivStudentIdx>0){ state.live.indivStudentIdx--; render(); }
      };
      const ipNext=root.querySelector('#indiv-next');
      if(ipNext) ipNext.onclick=()=>{
        if(state.live.indivStudentIdx<state.live.nStudents-1){ state.live.indivStudentIdx++; render(); }
      };
      const ipSel=root.querySelector('#indiv-select');
      if(ipSel) ipSel.onchange=()=>{ state.live.indivStudentIdx=+ipSel.value; render(); };
      // 個人別回：この生徒の問題数スライダー
      const rliq=root.querySelector('#rl-indivq');
      if(rliq) rliq.oninput=()=>{
        ensureGrid();
        const ps=activeStudentSet();
        if(ps){ ps.nQ=+rliq.value; }
        root.querySelector('#indiv-q').textContent=rliq.value;
        ensureGrid(); render();
      };
      // 個人別回：正誤ボタン（○→×→－）
      root.querySelectorAll('.indiv-cell').forEach(btn=>{
        btn.onclick=()=>{
          ensureGrid();
          const q=+btn.dataset.iq;
          const ps=activeStudentSet(); if(!ps) return;
          const cur=ps.answers[q];
          ps.answers[q]= cur===1?0 : cur===0?undefined : 1;
          render();
        };
      });
      // 個人別回：タグ設定（クリックでモーダル）
      root.querySelectorAll('.indiv-tag').forEach(td=>{
        td.onclick=()=>openIndivTagPicker(+td.dataset.iq);
      });
      // グリッドのセルクリック（○→×→－）。現在の編集回に書き込む
      root.querySelectorAll('.cell-btn').forEach(btn=>{
        btn.onclick=()=>{
          const s=+btn.dataset.s,q=+btn.dataset.q;
          ensureGrid();
          const at=activeTest();
          const cur=at.grid[s][q];
          at.grid[s][q]= cur===1?0 : cur===0?undefined : 1;
          render();
        };
      });
      // 問題ヘッダクリック → タグ設定
      root.querySelectorAll('th.qhdr').forEach((th,qi)=>{
        th.onclick=()=>openTagPicker(qi);
      });
      // CSVドロップゾーン（解答データ）
      const dz=root.querySelector('#dropzone'), fi=root.querySelector('#fileinp');
      if(dz&&fi){
        dz.onclick=()=>fi.click();
        dz.ondragover=e=>{e.preventDefault();dz.classList.add('drag');};
        dz.ondragleave=()=>dz.classList.remove('drag');
        dz.ondrop=e=>{e.preventDefault();dz.classList.remove('drag');
          if(e.dataTransfer.files[0]) handleCSV(e.dataTransfer.files[0]);};
        fi.onchange=()=>{ if(fi.files[0]) handleCSV(fi.files[0]); };
      }
      // CSVドロップゾーン（問題タグ）
      const dzT=root.querySelector('#dropzone-tags'), fiT=root.querySelector('#fileinp-tags');
      if(dzT&&fiT){
        dzT.onclick=()=>fiT.click();
        dzT.ondragover=e=>{e.preventDefault();dzT.classList.add('drag');};
        dzT.ondragleave=()=>dzT.classList.remove('drag');
        dzT.ondrop=e=>{e.preventDefault();dzT.classList.remove('drag');
          if(e.dataTransfer.files[0]) handleTagsCSV(e.dataTransfer.files[0]);};
        fiT.onchange=()=>{ if(fiT.files[0]) handleTagsCSV(fiT.files[0]); };
      }
      const dlt=root.querySelector('#dl-template');
      if(dlt) dlt.onclick=downloadCSVTemplate;
      const dltT=root.querySelector('#dl-template-tags');
      if(dltT) dltT.onclick=downloadCSVTemplateTags;
      const expL=root.querySelector('#export-live');
      if(expL) expL.onclick=exportLiveCSV;
      const expT=root.querySelector('#export-tags');
      if(expT) expT.onclick=exportTagsCSV;
      // 「この内容で分析する」
      const apply=root.querySelector('#live-apply');
      if(apply) apply.onclick=()=>{
        const d=liveToData();
        const tagged=d.questions.filter(q=>q.teacher.length>0).length;
        if(d.responses.length===0){
          root.querySelector('#live-result').innerHTML=
            `<div class="callout warn" style="margin-top:12px">解答データがありません。
            表に入力するか、CSVを読み込んでください。</div>`;
          return;
        }
        if(tagged===0){
          root.querySelector('#live-result').innerHTML=
            `<div class="callout warn" style="margin-top:12px">問題にタグが未設定です。
            問題ヘッダ Q1… をクリックして教師タグを設定してください。</div>`;
          return;
        }
        state.data=d;
        root.querySelector('#live-result').innerHTML=`<div class="callout" style="margin-top:12px">
          分析準備完了：問題 <b>${d.questions.length}</b>問（タグ付き${tagged}問）／
          解答 <b>${d.responses.length}</b>件。STEP 2 以降に進めます。</div>`;
        state.step=1; render();
      };

      // 問題文の入力をstateに保存（STEP5でも参照できるよう）
      const qtTa=root.querySelector('#qtext');
      // qtext oninput handled above via qtTa2

      // AIタグ付けプロンプトを作る
      const mkTag=root.querySelector('#make-tagprompt');
      if(mkTag) mkTag.onclick=()=>{
        const qtEl=root.querySelector('#qtext');
        const txt=qtEl?qtEl.value:'';
        const atNow=activeTest();
        if(atNow) atNow.qtext=txt;   // 回ごとに保存
        const prompt=buildTaggingPrompt(txt);
        root.querySelector('#tagprompt-area').innerHTML=`
          <div class="prompt-box" id="pb-tagging">${escapeHTML(prompt)}<button
            class="copy-btn" data-copy="pb-tagging">コピー</button></div>
          <div class="small" style="margin-top:5px">これをChatGPT / Claudeに貼り付け、
          返ってきた結果を下の欄②に貼り付けてください。</div>`;
        const cb=root.querySelector('[data-copy="pb-tagging"]');
        if(cb) cb.onclick=()=>{
          const box=root.querySelector('#pb-tagging');
          navigator.clipboard.writeText(box.childNodes[0].textContent).then(()=>{
            cb.textContent='コピー済'; setTimeout(()=>cb.textContent='コピー',1400);
          });
        };
      };

      // 問題文テキストエリアの入力を現在の回に同期
      const qtTa2=root.querySelector('#qtext');
      if(qtTa2) qtTa2.oninput=()=>{
        const atNow=activeTest(); if(atNow) atNow.qtext=qtTa2.value;
      };

      // AI返答テキストエリアの入力を現在の回に同期
      const arEl=root.querySelector('#aireply');
      if(arEl) arEl.oninput=()=>{
        const atNow=activeTest(); if(atNow) atNow.aireply=arEl.value;
      };

      // AIの返答を取り込んで ai_tags に反映（現在の編集回に適用）
      const impTag=root.querySelector('#import-aitags');
      if(impTag) impTag.onclick=()=>{
        const reply=root.querySelector('#aireply').value;
        ensureGrid();
        const at=activeTest();
        if(!at){ render(); return; }
        at.aireply=reply;  // 確実に同期
        if(!reply.trim()){
          at.aitagStatus=' AIの返答を貼り付けてください。';
          render(); return;
        }
        const parsed=parseTaggingReply(reply);
        let applied=0;
        if(at.kind==='individual'){
          // 個人別回：生徒ごとに適用（Q番号はそのまま各生徒のqi として使う）
          const lv=state.live;
          for(let s=0;s<lv.nStudents;s++){
            const ps=at.perStudent&&at.perStudent[s]; if(!ps) continue;
            Object.keys(parsed).forEach(qi=>{
              const i=+qi;
              if(i<ps.nQ){
                if(!ps.questions[i]) ps.questions[i]=emptyQuestion();
                ps.questions[i].ai=parsed[i];
                applied++;
              }
            });
          }
          // 重複カウント防止：問題数単位で出す
          const appliedQ=Object.keys(parsed).filter(qi=>+qi<((at.perStudent&&at.perStudent[0]&&at.perStudent[0].nQ)||at.nQ||lv.nQ)).length;
          if(appliedQ===0){
            at.aitagStatus=' 取り込めるタグがありません。形式 "Q1: tag;tag" を確認してください。';
          } else {
            at.aitagStatus=` 第${state.live.activeTest+1}回（個人別）の${appliedQ}問にAIタグを取り込みました。`;
          }
        } else {
          const nQ=at.nQ||state.live.nQ;
          Object.keys(parsed).forEach(qi=>{
            const i=+qi;
            if(i<nQ){ at.questions[i].ai=parsed[i]; applied++; }
          });
          if(applied===0){
            at.aitagStatus=' 取り込めるタグがありません。形式 "Q1: tag;tag" を確認してください。';
          } else {
            at.aitagStatus=` 第${state.live.activeTest+1}回の${applied}問にAIタグを取り込みました。`;
            // 複数タグが付いた問題を検出して分割提案
            if(at.kind!=='individual'){
              const multiTagQs = [];
              const nQ2 = at.nQ||state.live.nQ;
              for(let i=0;i<nQ2;i++){
                const q=at.questions[i];
                if(q && q.ai && q.ai.length>=2 && q.subLabel===null)
                  multiTagQs.push({qi:i, tags:q.ai, lbl:qLabel(i,at.questions)});
              }
              if(multiTagQs.length>0){
                const lineItems = multiTagQs.map(function(m2){
                  return m2.lbl+'（'+m2.tags.map(function(t){return TAG_JA[t]||t;}).join('・')+' → '+m2.tags.length+'分割）';
                });
                const confirmMsg = '以下の問題にAIが複数タグを付けました。\nサブ問に分割しますか？\n\n'
                  + lineItems.join('\n') + '\n\n「OK」で分割、「キャンセル」でそのまま維持します。';
                if(confirm(confirmMsg)){
                  const sorted=[...multiTagQs].sort(function(a,b){return b.qi-a.qi;});
                  sorted.forEach(function(m2){
                    state.live.tests.forEach(function(t){
                      if(t.kind!=='individual'&&t.questions[m2.qi]){
                        t.questions[m2.qi].teacher=[...t.questions[m2.qi].ai];
                        t.questions[m2.qi].teacherSource='ai-copy';
                      }
                    });
                    splitQuestion(state.live.activeTest, m2.qi);
                  });
                  at.aitagStatus+=` ${multiTagQs.length}問をサブ問に分割しました。`;
                  return;
                }
              }
            }
          }
        }
        render();
      };

      // STEP3 フィードバック用プロンプト生成ボタン
      const mkFb=root.querySelector('#make-fbprompt');
      if(mkFb) mkFb.onclick=()=>{
        if(!state.data) return;
        const qTexts = extractQuestionTexts(state.live ? state.live.qtext : '');
        const mismatches = [];
        state.data.questions.forEach((q,qi)=>{
          if(!q.ai||q.ai.length===0) return;
          const ts=new Set(q.teacher), as=new Set(q.ai);
          const missed=[...ts].filter(t=>!as.has(t));
          const extra =[...as].filter(t=>!ts.has(t));
          if(missed.length===0&&extra.length===0) return;
          mismatches.push({qi, qn:qi+1, teacher:[...ts], ai:[...as], missed, extra,
            text: qTexts[qi+1]||''});
        });
        const prompt = buildFeedbackPrompt(mismatches);
        const area = root.querySelector('#fb-prompt-area');
        if(!area) return;
        area.innerHTML=`<div class="prompt-box" id="pb-feedback">${escapeHTML(prompt)}<button
          class="copy-btn" data-copy="pb-feedback">コピー</button></div>
          <div class="small" style="margin-top:5px">
          このプロンプトをタグ付けを依頼したAIとの<b>継続中の会話</b>に貼り付けてください。
          AIが修正方針を確認し、次の問題へのタグ付けに備えます。</div>`;
        const cb=area.querySelector('[data-copy="pb-feedback"]');
        if(cb) cb.onclick=()=>{
          const box=area.querySelector('#pb-feedback');
          navigator.clipboard.writeText(box.childNodes[0].textContent).then(()=>{
            cb.textContent='コピー済'; setTimeout(()=>cb.textContent='コピー',1400);
          });
        };
      };

      // AIタグをそのまま教師タグとしてコピー（現在の編集回に適用）
      const cpAi=root.querySelector('#copy-ai-to-teacher');
      if(cpAi) cpAi.onclick=()=>{
        ensureGrid();
        const at=activeTest();
        const lv=state.live;
        let aiCount=0;
        if(at.kind==='individual'){
          (at.perStudent||[]).forEach(ps=>{
            (ps.questions||[]).forEach(q=>{ if(q.ai&&q.ai.length>0) aiCount++; });
          });
        } else {
          const nQ=at.nQ||lv.nQ;
          for(let q=0;q<nQ;q++){
            if(at.questions[q]&&at.questions[q].ai&&at.questions[q].ai.length>0) aiCount++;
          }
        }
        if(aiCount===0){
          state.live.aiCopyStatus=' AIタグがまだ取り込まれていません。先に③で取り込んでください。';
          render(); return;
        }
        // 教師タグが既にある問題は上書き確認
        let existing=0;
        if(at.kind==='individual'){
          (at.perStudent||[]).forEach(ps=>{
            (ps.questions||[]).forEach(q=>{
              if(q.teacher&&q.teacher.length>0&&q.teacherSource!=='ai-copy') existing++;
            });
          });
        } else {
          const nQ2=at.nQ||lv.nQ;
          for(let q=0;q<nQ2;q++){
            const qq=at.questions[q];
            if(qq&&qq.teacher&&qq.teacher.length>0&&qq.teacherSource!=='ai-copy') existing++;
          }
        }
        if(existing>0){
          if(!confirm(`現在 ${existing} 問に教師タグが入力されています。AIタグで上書きしますか？`)) return;
        }
        let copied=0;
        if(at.kind==='individual'){
          (at.perStudent||[]).forEach(ps=>{
            (ps.questions||[]).forEach(q=>{
              if(!q.ai||q.ai.length===0) return;
              q.teacher=[...q.ai]; q.teacherSource='ai-copy'; copied++;
            });
          });
          // 重複回避：問題数単位で出す
          copied=Math.ceil(copied/Math.max(1,(at.perStudent||[]).length));
        } else {
          const nQ2=at.nQ||lv.nQ;
          for(let q=0;q<nQ2;q++){
            const aiTags=at.questions[q]&&at.questions[q].ai?at.questions[q].ai:[];
            if(aiTags.length===0) continue;
            at.questions[q].teacher=[...aiTags];
            at.questions[q].teacherSource='ai-copy';
            copied++;
          }
        }
        state.live.aiCopyStatus=` ${copied}問の教師タグをAIタグからコピーしました。`;
        state.live.aiCopyUsed=true;
        render();
      };
    }

    // --- 共通：プロンプトのコピー、CSVエクスポート ---
    root.querySelectorAll('.copy-btn').forEach(b=>{
      b.onclick=()=>{
        const box=root.querySelector('#'+b.dataset.copy);
        const txt=box.childNodes[0].textContent;
        navigator.clipboard.writeText(txt).then(()=>{
          b.textContent='コピー済'; setTimeout(()=>b.textContent='コピー',1400);
        });
      };
    });
    const ep=root.querySelector('#export-plan');
    if(ep) ep.onclick=exportPlan;

    // STEP5-A 弱点連動：対象切替（クラス/個人）
    root.querySelectorAll('.scope-tab[data-wscope]').forEach(t=>{
      t.onclick=()=>{ state.weakGen.scope=t.dataset.wscope; render(); };
    });
    // STEP5-A 弱点連動：個人別の生徒切替
    const wsPrev=root.querySelector('#wstu-prev');
    if(wsPrev) wsPrev.onclick=()=>{
      if(state.weakGen.studentIdx>0){ state.weakGen.studentIdx--; render(); }
    };
    const wsNext=root.querySelector('#wstu-next');
    if(wsNext) wsNext.onclick=()=>{
      const nS=state.data?state.data.cfg.nStudents:1;
      if(state.weakGen.studentIdx<nS-1){ state.weakGen.studentIdx++; render(); }
    };
    // STEP5-A 弱点連動：個人別の生徒切替（プルダウン）
    const wsSel=root.querySelector('#wstu-select');
    if(wsSel) wsSel.onchange=()=>{
      state.weakGen.studentIdx=+wsSel.value; render();
    };
    // STEP5-A 弱点連動：難易度ボタン（data-weak-level）
    root.querySelectorAll('.level-btn[data-weak-level]').forEach(b=>{
      b.onclick=()=>{
        state.weakGen.level=b.dataset.weakLevel;
        render();
      };
    });
    // STEP5-A 弱点連動：難易度クリア
    const wlc=root.querySelector('#weak-lvl-clear');
    if(wlc) wlc.onclick=()=>{ state.weakGen.level=null; render(); };
    // STEP5-A 弱点連動：例示問題チェックボックス
    const wex=root.querySelector('#weak-use-ex');
    if(wex) wex.onchange=()=>{
      state.weakGen.useExample = wex.checked;
      render();
    };

    // STEP5-A 全生徒プロンプト生成ボタン
    const genAllBtn = root.querySelector('#gen-all-stu-prompts');
    if(genAllBtn) genAllBtn.onclick = ()=>{
      if(!state.data) return;
      const wg = state.weakGen;
      const levelName = wg.level || null;
      const exText = wg.useExample
        ? extractFirstQuestion((activeTest()&&activeTest().qtext)||state.live.qtext||'')
        : null;
      const listEl = root.querySelector('#all-stu-prompt-list');
      if(!listEl) return;
      listEl.innerHTML = '<div class="stu-prompt-list">'
        + buildAllStudentPromptsHTML(state.data, levelName, exText)
        + '</div>';
      // コピーボタン
      listEl.querySelectorAll('[data-copy-stu]').forEach(btn=>{
        const si = +btn.dataset.copyStu;
        btn.onclick = ()=>{
          const el = listEl.querySelector('#stu-pb-'+si);
          if(!el) return;
          navigator.clipboard.writeText(el.textContent).then(()=>{
            btn.textContent='コピー済'; setTimeout(()=>btn.textContent='コピー',1400);
          });
        };
      });
      // QRコード表示ボタン（短縮プロンプト版でQR化）
      listEl.querySelectorAll('[data-qr-stu]').forEach(btn=>{
        const si = +btn.dataset.qrStu;
        btn.onclick = ()=>{
          const wrap = listEl.querySelector('#qr-wrap-'+si);
          const noteEl = listEl.querySelector('#qr-note-'+si);
          const dlBtn = listEl.querySelector('[data-qr-dl="'+si+'"]');
          if(!wrap) return;
          if(wrap.classList.contains('show')){
            wrap.classList.remove('show');
            wrap.innerHTML='';
            btn.textContent='QRコード表示';
            if(dlBtn) dlBtn.style.display='none';
            if(noteEl) noteEl.textContent='';
            return;
          }
          // QR用に短縮プロンプトを生成（ECC L で確実に収まるサイズ）
          const qrText = buildShortPromptForQR(state.data, si, state.weakGen.level);
          if(!qrText){
            if(noteEl) noteEl.textContent='この生徒は弱点がないためQRを生成できません。';
            return;
          }
          wrap.innerHTML='';
          wrap.classList.add('show');
          try{
            new QRCode(wrap,{
              text: qrText,
              width:180, height:180,
              correctLevel: QRCode.CorrectLevel.L
            });
            btn.textContent='QRを閉じる';
            if(dlBtn) dlBtn.style.display='inline-flex';
            if(noteEl) noteEl.innerHTML='<b>QR = 簡易プロンプト（ASCII版）</b> '+qrText.length+' chars<br>'
              +'スキャン → AIに貼り付けで即開始。設問指示は英語ですがAIは正しく動作します。<br>'
              +'詳細な日本語指示が必要な場合は「コピー（完全版）」を使ってください。';
            if(dlBtn){
              dlBtn.onclick=()=>{
                const canvas=wrap.querySelector('canvas');
                if(!canvas) return;
                const a=document.createElement('a');
                a.href=canvas.toDataURL('image/png');
                a.download='qr_S'+String(si+1).padStart(2,'0')+'.png';
                a.click();
              };
            }
          }catch(e){
            wrap.classList.remove('show');
            if(noteEl) noteEl.textContent='QRコードの生成に失敗しました: '+e.message
              +' ('+qrText.length+'文字)';
          }
        };
      });
      // 生成後にボタンをスクロール
      listEl.scrollIntoView({behavior:'smooth', block:'start'});
    };

    // STEP5-B 通常問題生成：難易度ボタン（data-level のみ。data-weak-level は除外）
    root.querySelectorAll('.level-btn[data-level]').forEach(b=>{
      b.onclick=()=>{
        state.customGen.level=b.dataset.level;
        render();
      };
    });
    // STEP5-B 通常問題生成：難易度クリア
    const cglc=root.querySelector('#cg-lvl-clear');
    if(cglc) cglc.onclick=()=>{ state.customGen.level=null; render(); };
    // STEP5-B 通常問題生成：タグ出題数の増減（＋－）
    root.querySelectorAll('.cg-plus').forEach(b=>{
      b.onclick=()=>{
        const t=b.dataset.cgtag;
        const cur=state.customGen.counts[t]||0;
        state.customGen.counts[t]=Math.min(20,cur+1);
        render();
      };
    });
    root.querySelectorAll('.cg-minus').forEach(b=>{
      b.onclick=()=>{
        const t=b.dataset.cgtag;
        const cur=state.customGen.counts[t]||0;
        state.customGen.counts[t]=Math.max(0,cur-1);
        render();
      };
    });

    // STEP2 つまずきマップの回めくり（◀▶）
    const mapPrev=root.querySelector('#map-prev');
    if(mapPrev) mapPrev.onclick=()=>{
      if(state.mapViewTest>0){ state.mapViewTest--; render(); }
    };
    const mapNext=root.querySelector('#map-next');
    if(mapNext) mapNext.onclick=()=>{
      const nT=state.data?state.data.cfg.nTests:1;
      if(state.mapViewTest<nT-1){ state.mapViewTest++; render(); }
    };
    // STEP1ダミーモード：ダミーデータプレビューの回めくり
    const dumPrev=root.querySelector('#dummy-prev');
    if(dumPrev) dumPrev.onclick=()=>{
      if(state.dummyDataViewTest>0){ state.dummyDataViewTest--; render(); }
    };
    const dumNext=root.querySelector('#dummy-next');
    if(dumNext) dumNext.onclick=()=>{
      const nT=state.data?state.data.cfg.nTests:1;
      if(state.dummyDataViewTest<nT-1){ state.dummyDataViewTest++; render(); }
    };

    // STEP2 クラス/個人 スコープ切替
    root.querySelectorAll('.scope-tab[data-scope]').forEach(t=>{
      t.onclick=()=>{ state.mapScope=t.dataset.scope; render(); };
    });
    // STEP2 個人ビューの生徒切替（◀▶）
    const stuPrev=root.querySelector('#stu-prev');
    if(stuPrev) stuPrev.onclick=()=>{
      if(state.mapStudentIdx>0){ state.mapStudentIdx--; render(); }
    };
    const stuNext=root.querySelector('#stu-next');
    if(stuNext) stuNext.onclick=()=>{
      const nS=state.data?state.data.cfg.nStudents:1;
      if(state.mapStudentIdx<nS-1){ state.mapStudentIdx++; render(); }
    };
    // STEP2 個人ビューの生徒切替（プルダウン）
    const stuSel=root.querySelector('#stu-select');
    if(stuSel) stuSel.onchange=()=>{
      state.mapStudentIdx=+stuSel.value; render();
    };

    // タグ選択モーダルのイベント
    if(state.tagPicker.open){
      root.querySelectorAll('.tag-pick').forEach(el=>{
        el.onclick=()=>{
          const tag=el.dataset.pick;
          const sel=state.tagPicker.selected;
          const i=sel.indexOf(tag);
          if(i>=0) sel.splice(i,1); else sel.push(tag);
          render();
        };
      });
      const ok=root.querySelector('#tagmodal-ok');
      if(ok) ok.onclick=commitTagPicker;
      const cancel=root.querySelector('#tagmodal-cancel');
      if(cancel) cancel.onclick=closeTagPicker;
      const ov=root.querySelector('#tagmodal-overlay');
      if(ov) ov.onclick=e=>{ if(e.target===ov) closeTagPicker(); };
      // 分割ボタン
      const splitBtn=root.querySelector('#tagmodal-split');
      if(splitBtn&&!splitBtn.disabled) splitBtn.onclick=()=>{
        const tp=state.tagPicker;
        // タグを確定してから分割
        const picked=[...new Set(tp.selected)];
        state.live.tests.forEach(t=>{
          if(t.kind!=='individual'&&t.questions[tp.qi]){
            t.questions[tp.qi].teacher=picked;
            t.questions[tp.qi].teacherSource='manual';
          }
        });
        state.tagPicker={open:false,qi:null,selected:[]};
        splitQuestion(state.live.activeTest, tp.qi);
      };
      // 結合ボタン
      const mergeBtn=root.querySelector('#tagmodal-merge');
      if(mergeBtn) mergeBtn.onclick=()=>{
        const tp=state.tagPicker;
        state.tagPicker={open:false,qi:null,selected:[]};
        mergeSubQuestions(state.live.activeTest, tp.qi);
      };
    }
  }

  // 本番モードのグリッド配列を生徒数・問題数・テスト回数に合わせる
  // 空の問題オブジェクトを作る
  function emptyQuestion(){ return {teacher:[],ai:[],teacherSource:null,subLabel:null,parentQ:null}; }

  // 問題ラベル文字列  Q3 / Q3-a / Q3-b ...
  function qLabel(qi, questions){
    const q = questions[qi];
    if(!q) return `Q${qi+1}`;
    const base = q.parentQ !== null ? q.parentQ+1 : qi+1;
    return q.subLabel ? `Q${base}-${q.subLabel}` : `Q${base}`;
  }

  // 大問数を返す（サブ問を除く）
  function mainQCount(questions){
    return questions.filter(q=>q.subLabel===null).length;
  }

  // Q${qi}（共通テスト回）を複数サブ問に分割する
  // tags 配列の長さぶんサブ問を作り、元の正誤を各サブ問にコピー
  function splitQuestion(testIdx, qi){
    const lv = state.live;
    lv.tests.forEach((t, ti) => {
      if(t.kind==='individual') return;
      // qi 番目を削除し、サブ問を挿入
      const orig = t.questions[qi] || emptyQuestion();
      const tags  = orig.teacher.length ? orig.teacher : orig.ai.length ? orig.ai : [''];
      const subs  = tags.map((tag, idx) => ({
        ...emptyQuestion(),
        teacher: tag ? [tag] : [],
        ai: tag ? [tag] : [],
        teacherSource: orig.teacherSource,
        subLabel: String.fromCharCode(97 + idx),  // 'a','b','c'...
        parentQ: qi
      }));
      t.questions.splice(qi, 1, ...subs);
      t.nQ = t.nQ + tags.length - 1;
      // grid: 各生徒の qi 列を削除し、サブ問列を挿入（同じ値をコピー）
      (t.grid||[]).forEach(row => {
        const orig_v = row[qi] !== undefined ? row[qi] : null;
        const newCols = subs.map(() => orig_v);
        row.splice(qi, 1, ...newCols);
      });
      // parentQ インデックスを再計算（qi より後の問題はシフト）
      const inserted = subs.length - 1;
      for(let i=qi+subs.length; i<t.questions.length; i++){
        const q = t.questions[i];
        if(q.parentQ !== null && q.parentQ >= qi) q.parentQ += inserted;
      }
    });
    ensureGrid();
    render();
  }

  // Q${qi}（サブ問の1つを指定）を結合して1問に戻す
  function mergeSubQuestions(testIdx, qi){
    const lv = state.live;
    lv.tests.forEach((t, ti) => {
      if(t.kind==='individual') return;
      const q = t.questions[qi];
      if(!q || q.subLabel===null) return;
      const pq = q.parentQ;
      // 同じ parentQ を持つ全サブ問のインデックスを収集
      const idxs = t.questions.map((qq,i)=>qq.parentQ===pq ? i : -1).filter(i=>i>=0);
      // 結合後の問題（タグは全サブ問の union）
      const merged = emptyQuestion();
      merged.teacher = [...new Set(idxs.flatMap(i=>t.questions[i].teacher))];
      merged.ai      = [...new Set(idxs.flatMap(i=>t.questions[i].ai))];
      merged.teacherSource = t.questions[idxs[0]].teacherSource;
      // グリッド：先頭サブ問の値を代表値として使う
      (t.grid||[]).forEach(row => {
        const val = row[idxs[0]] !== undefined ? row[idxs[0]] : null;
        row.splice(idxs[0], idxs.length, val);
      });
      t.questions.splice(idxs[0], idxs.length, merged);
      t.nQ = t.nQ - idxs.length + 1;
      // parentQ インデックスを再計算
      const removed = idxs.length - 1;
      for(let i=idxs[0]+1; i<t.questions.length; i++){
        const qq = t.questions[i];
        if(qq.parentQ !== null && qq.parentQ > pq) qq.parentQ -= removed;
      }
    });
    ensureGrid();
    render();
  }

  function ensureTestFields(t){
    // 回ごとのフィールドが存在しない（古いデータ互換）場合に初期化
    if(t.qtext===undefined) t.qtext='';
    if(t.aireply===undefined) t.aireply='';
    if(t.aitagStatus===undefined) t.aitagStatus='';
  }

  function ensureGrid(){
    const lv=state.live;
    if(!lv.tests || lv.tests.length===0)
      lv.tests=[{kind:'common',nQ:lv.nQ,questions:[],grid:[]}];
    lv.tests.forEach(t=>{
      ensureTestFields(t);
      if(t.kind===undefined) t.kind='common';
      if(t.nQ===undefined || t.nQ===null) t.nQ=lv.nQ;  // 回ごとの問題数
      if(t.kind==='common'){
        if(!t.questions) t.questions=[];
        while(t.questions.length<t.nQ) t.questions.push(emptyQuestion());
        t.questions.forEach(q=>{ if(q.teacherSource===undefined) q.teacherSource=null; });
        t.questions.length=t.nQ;
        if(!t.grid) t.grid=[];
        while(t.grid.length<lv.nStudents) t.grid.push([]);
        t.grid.length=lv.nStudents;
      } else {
        // 個人別問題：生徒ごとに独立した問題セット
        if(!t.perStudent) t.perStudent=[];
        while(t.perStudent.length<lv.nStudents)
          t.perStudent.push({nQ:t.nQ, questions:[], answers:[]});
        t.perStudent.length=lv.nStudents;
        t.perStudent.forEach(ps=>{
          if(ps.nQ===undefined||ps.nQ===null) ps.nQ=t.nQ;
          if(!ps.questions) ps.questions=[];
          while(ps.questions.length<ps.nQ) ps.questions.push(emptyQuestion());
          ps.questions.forEach(q=>{ if(q.teacherSource===undefined) q.teacherSource=null; });
          ps.questions.length=ps.nQ;
          if(!ps.answers) ps.answers=[];
          ps.answers.length=ps.nQ;
        });
      }
    });
    if(lv.activeTest>=lv.tests.length) lv.activeTest=lv.tests.length-1;
  }
  // テスト回 kind の値:
  //   'common'     : 共通テスト（全員が同じ問題）。偏差値の算出対象。
  //   'individual' : 個人別問題（生徒ごとに違う問題）。偏差値は出さない。
  // teacherSource の値:
  //   null       : タグ未設定
  //   'manual'   : 教員が手動で入力
  //   'ai-copy'  : AIタグをそのままコピーした
  //   'ai-edited': AIコピー後に教員が編集した
  // いま編集中のテスト回を返す
  function activeTest(){ return state.live.tests[state.live.activeTest]; }
  // 個人別回でいま編集中の生徒の問題セットを返す
  function activeStudentSet(){
    const t=activeTest();
    if(!t || t.kind!=='individual') return null;
    ensureGrid();
    return t.perStudent[state.live.indivStudentIdx||0];
  }

  // タグ選択モーダルを開く（クリックで選択。番号入力も併用可）
  function openTagPicker(qi){
    ensureGrid();
    const at=activeTest();
    state.tagPicker={
      open:true, mode:'common', qi:qi,
      selected:[...(at.questions[qi].teacher||[])]
    };
    render();
  }
  // 個人別回：特定生徒の特定問題のタグを編集
  function openIndivTagPicker(qi){
    ensureGrid();
    const ps=activeStudentSet(); if(!ps) return;
    state.tagPicker={
      open:true, mode:'indiv', qi:qi,
      studentIdx: state.live.indivStudentIdx||0,
      selected:[...((ps.questions[qi]||{}).teacher||[])]
    };
    render();
  }
  // モーダルで選んだタグを確定
  function commitTagPicker(){
    const tp=state.tagPicker;
    const picked=[...new Set(tp.selected)];
    const applyTo=(q)=>{
      if(!q) return;
      const wasAI = (q.teacherSource==='ai-copy' || q.teacherSource==='ai-edited');
      q.teacher=picked;
      q.teacherSource = (picked.length===0) ? null : wasAI ? 'ai-edited' : 'manual';
    };
    if(tp.mode==='indiv'){
      // その生徒・その問題だけに適用
      const t=activeTest();
      if(t && t.kind==='individual' && t.perStudent[tp.studentIdx])
        applyTo(t.perStudent[tp.studentIdx].questions[tp.qi]);
    } else {
      // 共通テスト：全共通テスト回の同じQ番号に適用（個人別回は対象外）
      state.live.tests.forEach(t=>{
        if(t.kind!=='individual' && t.questions[tp.qi]) applyTo(t.questions[tp.qi]);
      });
    }
    state.tagPicker={open:false,qi:null,selected:[]};
    render();
  }
  function closeTagPicker(){
    state.tagPicker={open:false,qi:null,selected:[]};
    render();
  }
  // タグ選択モーダルのHTML
  function tagPickerHTML(){
    const tp=state.tagPicker;
    if(!tp.open) return '';
    const cells=TAGS.map((t,i)=>{
      const sel=tp.selected.includes(t);
      return `<div class="tag-pick ${sel?'sel':''}" data-pick="${t}">
        <span class="chk">${sel?'&#10003;':''}</span>
        <span class="tnum">${i+1}</span>
        <span>${TAG_JA[t]}<br><span style="font-size:.66rem;opacity:.6">${t}</span></span>
      </div>`;
    }).join('');
    // 分割/結合ボタン（共通テスト回のみ）
    const at=activeTest();
    const isCommon = tp.mode==='common';
    let splitMergeBtns='';
    if(isCommon && at){
      const q = at.questions[tp.qi];
      const isSub = q && q.subLabel!==null;
      if(isSub){
        splitMergeBtns=`<button class="ghost" id="tagmodal-merge"
          style="color:var(--bad);border-color:var(--bad)">
          &#10548; Q${q.parentQ+1} に結合（サブ問を解除）</button>`;
      } else {
        const tagCount = tp.selected.length;
        const qlb = qLabel(tp.qi, at.questions);
        if(tagCount >= 2){
          splitMergeBtns = '<button class="ghost" id="tagmodal-split"'
            +' style="color:var(--accent);border-color:var(--accent)">'
            +'&#10549; '+tagCount+'タグで分割 → '+qlb+'-a〜'+String.fromCharCode(96+tagCount)+'</button>';
        } else {
          splitMergeBtns = '<button class="ghost" id="tagmodal-split" disabled'
            +' title="タグを2つ以上選択すると分割できます" style="opacity:.45">'
            +'&#10549; タグを2つ以上選択で分割可能</button>';
        }
      }
    }
    const lbl = at ? qLabel(tp.qi, at.questions) : 'Q'+(tp.qi+1);
    const modeDesc = tp.mode==='common'
      ? 'ここで設定したタグは全共通テスト回の'+lbl+'に適用されます。'
      : 'この生徒のこの問題に適用されます。';
    return '<div class="modal-overlay" id="tagmodal-overlay">'
      +'<div class="modal">'
      +'<h3>'+lbl+' の教師タグを選択</h3>'
      +'<div class="msub">クリックで選択／解除（複数可）。'+modeDesc+'</div>'
      +`<div class="tag-pick-grid">${cells}</div>
        <div class="modal-actions" style="flex-wrap:wrap;gap:6px">
          ${splitMergeBtns}
          <div style="flex:1"></div>
          <button class="ghost" id="tagmodal-cancel">キャンセル</button>
          <button class="run" id="tagmodal-ok" style="margin-right:0">
            ${tp.selected.length}個を確定</button>
        </div>
      </div>
    </div>`;
  }


  function handleCSV(file){
    const reader=new FileReader();
    reader.onload=()=>{
      try{
        const recs=parseCSV(reader.result);
        const testIds=[...new Set(recs.map(r=>r.test))].sort();
        const tIdx={}; testIds.forEach((t,i)=>tIdx[t]=i);

        // question_id が SXX_QYY 形式なら個人別回と判定
        const indivPattern=/^S\d+_Q\d+$/i;
        const testKinds={};
        testIds.forEach(tid=>{
          const sample=recs.find(r=>r.test===tid);
          testKinds[tid]=(sample&&indivPattern.test(sample.q))?'individual':'common';
        });

        // 生徒リスト（全回のstudent_idをまとめてユニーク化）
        const students=[...new Set(recs.map(r=>r.s))].sort();
        const sIdx={}; students.forEach((s,i)=>sIdx[s]=i);
        const nStudents=students.length;

        // 共通回の問題数をQ番号の最大値から求める
        const commonRecs=recs.filter(r=>testKinds[r.test]==='common');
        let maxCommonQ=0;
        commonRecs.forEach(r=>{
          const m=r.q.match(/(\d+)$/);
          if(m) maxCommonQ=Math.max(maxCommonQ,parseInt(m[1],10));
        });
        const defaultNQ=maxCommonQ||10;

        state.live.nStudents=nStudents;
        state.live.nQ=defaultNQ;
        state.live.tests=testIds.map(tid=>({
          questions:[], grid:[], kind:testKinds[tid], nQ:defaultNQ, perStudent:[]
        }));
        state.live.activeTest=0;
        ensureGrid();

        // 共通テスト回：サブ問を考慮してグリッドに書き込む
        // question_id形式: Q01（通常）/ Q01a, Q01b（サブ問）
        // まずサブ問マップを構築してから questions と grid を組み立てる
        testIds.filter(tid=>testKinds[tid]==='common').forEach(tid=>{
          const ti=tIdx[tid];
          const t=state.live.tests[ti];
          const testRecs=recs.filter(r=>r.test===tid);
          // question_id → qi マッピングを構築（出現順）
          const qidOrder=[];
          testRecs.forEach(r=>{
            if(!qidOrder.includes(r.q)) qidOrder.push(r.q);
          });
          qidOrder.sort(); // Q01 < Q01a < Q01b < Q02...
          // 列数を再設定
          t.nQ=qidOrder.length;
          t.questions=qidOrder.map(qid=>{
            const m=qid.match(/^Q(\d+)([a-z]?)$/i);
            const q=emptyQuestion();
            if(m&&m[2]){
              q.subLabel=m[2].toLowerCase();
              q.parentQ=parseInt(m[1],10)-1;
            }
            return q;
          });
          t.grid=[];
          for(let s=0;s<nStudents;s++) t.grid.push(new Array(qidOrder.length).fill(null));
          testRecs.forEach(r=>{
            const si=sIdx[r.s]; if(si===undefined) return;
            const qi=qidOrder.indexOf(r.q); if(qi<0) return;
            t.grid[si][qi]=(r.correct===1?1:0);
          });
        });

        // 個人別回：生徒ごとの最大問題数を求めてからperStudentに書き込む
        testIds.filter(tid=>testKinds[tid]==='individual').forEach(tid=>{
          const ti=tIdx[tid];
          const t=state.live.tests[ti];
          const testRecs=recs.filter(r=>r.test===tid);
          const perStuMax={};
          testRecs.forEach(r=>{
            const si=sIdx[r.s]; if(si===undefined) return;
            const m=r.q.match(/(\d+)$/); if(!m) return;
            const qi=parseInt(m[1],10);
            if(!perStuMax[si]||qi>perStuMax[si]) perStuMax[si]=qi;
          });
          for(let s=0;s<nStudents;s++){
            const nQ=perStuMax[s]||defaultNQ;
            t.perStudent[s]={nQ, questions:[], answers:[]};
          }
          testRecs.forEach(r=>{
            const si=sIdx[r.s]; if(si===undefined) return;
            const m=r.q.match(/(\d+)$/); if(!m) return;
            const qi=parseInt(m[1],10)-1;
            const ps=t.perStudent[si]; if(!ps) return;
            if(!ps.answers) ps.answers=[];
            ps.answers[qi]=(r.correct===1?1:0);
          });
        });

        ensureGrid();
        const nCommon=testIds.filter(tid=>testKinds[tid]==='common').length;
        const nIndiv =testIds.filter(tid=>testKinds[tid]==='individual').length;
        let msg=` 読込成功：テスト${testIds.length}回（共通${nCommon}・個人別${nIndiv}）× 生徒${nStudents}名。`;
        msg+='問題のタグは「表に入力」タブで設定してください。';
        state.live.csvStatus=msg;
        state.live.responsesCsvLoaded=true;
        state.inputTab='grid'; render();
      }catch(e){
        state.live.csvStatus=' エラー: '+e.message;
        render();
      }
    };
    reader.readAsText(file);
  }

  // 入力用CSVテンプレート（現在のテスト回数ぶん）
  function downloadCSVTemplate(){
    const lv=state.live;
    let csv='test_id,question_id,student_id,correct\n';
    for(let t=1;t<=lv.tests.length;t++)
      for(let q=1;q<=lv.nQ;q++)
        for(let s=1;s<=lv.nStudents;s++)
          csv+=`test${String(t).padStart(2,'0')},`
            +`Q${String(q).padStart(2,'0')},`
            +`S${String(s).padStart(2,'0')},\n`;
    downloadFile(csv,'responses_template.csv');
  }

  // 問題タグ用CSV（教員のタグ付け）の読み込み
  //   共通テスト回: question_id = Q01 形式 → 全共通テスト回の同Q番号に適用
  //   個人別回:    question_id = S01_Q01 形式 → 該当生徒・該当回のみに適用
  function handleTagsCSV(file){
    const reader=new FileReader();
    reader.onload=()=>{
      try{
        const text=reader.result;
        const lines=text.split(/\r?\n/).filter(l=>l.trim()&&!l.trim().startsWith('#'));
        if(lines.length===0) throw new Error('CSVが空です');
        const first=lines[0].split(',').map(s=>s.trim());
        const hasHeader=first.some(c=>/^question_id$/i.test(c));
        const dataLines=hasHeader?lines.slice(1):lines;
        const lv=state.live;
        const validTags=new Set(TAGS);
        const indivPattern=/^S(\d+)_Q(\d+)$/i;
        let applied=0, appliedAi=0, skipped=0, unknownTags=[];

        // test_id列があれば使う（なければ全共通回に適用）
        // ヘッダから列インデックスを取得
        let colQ=0, colTags=1, colTest=-1, colAiTags=-1, colSrc=-1;
        if(hasHeader){
          const h=lines[0].split(',').map(s=>s.trim().toLowerCase());
          colQ=h.indexOf('question_id'); if(colQ<0) colQ=0;
          colTags=h.indexOf('teacher_tags'); if(colTags<0) colTags=1;
          colTest=h.indexOf('test_id');
          colAiTags=h.indexOf('ai_tags');
          colSrc=h.indexOf('teacher_source');
        }

        // 先読み：共通回の最大問題番号を調べ、表の問題数をタグCSVに
        // 合わせる（表に入力タブがまだ空でも、タグCSV単体の問題数が
        // そのまま表の列数になるように）。
        //   回答も教師/AIタグも何も入っていない「手つかず」の回だけは
        //   タグCSVの問題数にぴったり合わせる（デフォルト10問のまま
        //   引きずられない）。何か入力済みの回は、タグCSVの方が多い
        //   場合だけ広げる（入力済みデータを消さないよう縮めない）。
        const isCommonTestUntouched=t=>{
          const gridEmpty=!t.grid||t.grid.every(row=>!row||row.every(v=>v===undefined||v===null));
          const tagsEmpty=!t.questions||t.questions.every(q=>
            (!q.teacher||q.teacher.length===0)&&(!q.ai||q.ai.length===0));
          return gridEmpty&&tagsEmpty;
        };
        let maxCommonQ=0;
        dataLines.forEach(line=>{
          const cols=line.split(',').map(s=>s.trim().replace(/^"|"$/g,''));
          const qid=(cols[colQ]||'').trim();
          const mSub=qid.match(/^Q(\d+)[a-z]?$/i);
          if(mSub) maxCommonQ=Math.max(maxCommonQ,parseInt(mSub[1],10));
        });
        if(maxCommonQ>0){
          if(!lv.tests||lv.tests.length===0){
            lv.nQ=maxCommonQ;
          } else {
            const commonTests=lv.tests.filter(t=>t.kind===undefined||t.kind==='common');
            commonTests.forEach(t=>{
              if(isCommonTestUntouched(t)) t.nQ=maxCommonQ;
              else if(maxCommonQ>(t.nQ||lv.nQ)) t.nQ=maxCommonQ;
            });
            const allUntouched=commonTests.length>0&&commonTests.every(isCommonTestUntouched);
            if(allUntouched||maxCommonQ>lv.nQ) lv.nQ=maxCommonQ;
          }
        }
        ensureGrid();

        dataLines.forEach(line=>{
          const cols=line.split(',').map(s=>s.trim().replace(/^"|"$/g,''));
          if(cols.length<2) return;
          const qid=cols[colQ]||'';
          const tagStr=cols[colTags]||'';
          const aiTagStr=colAiTags>=0?(cols[colAiTags]||''):'';
          const srcStr=colSrc>=0?(cols[colSrc]||''):'';
          const testId=colTest>=0?(cols[colTest]||''):'';

          // 教師タグのバリデーション
          const tags=tagStr.split(/[;|]/).map(t=>t.trim()).filter(t=>t);
          const validated=[];
          tags.forEach(t=>{
            if(validTags.has(t)) validated.push(t);
            else if(t&&!unknownTags.includes(t)) unknownTags.push(t);
          });

          // AIタグのバリデーション
          const aiTags=aiTagStr.split(/[;|]/).map(t=>t.trim()).filter(t=>t);
          const validatedAi=aiTags.filter(t=>validTags.has(t));

          const teacherSrc=srcStr||( validated.length>0 ? 'manual' : null );

          const indivM=qid.match(indivPattern);
          if(indivM){
            // 個人別形式: S01_Q01 → 指定生徒・指定回に適用
            const si=parseInt(indivM[1],10)-1;
            const qi=parseInt(indivM[2],10)-1;
            // test_id が指定されていれば絞り込む
            const targets=testId
              ? lv.tests.filter((_,ti)=>`test${String(ti+1).padStart(2,'0')}`===testId)
              : lv.tests.filter(t=>t.kind==='individual');
            let wrote=false;
            targets.forEach(t=>{
              if(t.kind!=='individual') return;
              const ps=t.perStudent&&t.perStudent[si];
              if(!ps) return;
              if(!ps.questions) ps.questions=[];
              while(ps.questions.length<=qi) ps.questions.push({teacher:[],ai:[],teacherSource:null});
              ps.questions[qi].teacher=validated;
              if(validatedAi.length>0) ps.questions[qi].ai=validatedAi;
              ps.questions[qi].teacherSource=teacherSrc;
              wrote=true;
            });
            if(wrote&&validated.length>0) applied++;
            if(wrote&&validatedAi.length>0) appliedAi++;
            if(!wrote) skipped++;
          } else {
            // 共通形式: Q01 / Q01a (サブ問) → 全共通テスト回の対応する問題に適用
            const mSub=qid.match(/^Q(\d+)([a-z]?)$/i);
            if(!mSub){ skipped++; return; }
            const parentIdx=parseInt(mSub[1],10)-1;
            const subLbl=mSub[2]?mSub[2].toLowerCase():null;
            const targets=testId
              ? lv.tests.filter((_,ti)=>`test${String(ti+1).padStart(2,'0')}`===testId)
              : lv.tests.filter(t=>t.kind!=='individual');
            let wrote=false;
            targets.forEach(t=>{
              if(t.kind==='individual') return;
              // 対応するqiを探す
              let qi=-1;
              if(subLbl){
                qi=t.questions.findIndex(q=>q.subLabel===subLbl&&q.parentQ===parentIdx);
              } else {
                // サブ問なし：parentQ===parentIdx かつ subLabel===null の問題
                qi=t.questions.findIndex((q,i)=>q.subLabel===null&&(i===parentIdx||(q.parentQ===null&&i===parentIdx)));
                if(qi<0) qi=parentIdx; // フォールバック
              }
              if(qi<0||!t.questions[qi]) return;
              t.questions[qi].teacher=validated;
              if(validatedAi.length>0) t.questions[qi].ai=validatedAi;
              t.questions[qi].teacherSource=teacherSrc;
              wrote=true;
            });
            if(wrote&&validated.length>0) applied++;
            if(wrote&&validatedAi.length>0) appliedAi++;
            if(!wrote) skipped++;
          }
        });
        let msg=` 問題タグを読込：${applied}問に教師タグ、${appliedAi}問にAIタグを設定`;
        if(skipped>0) msg+=`（${skipped}行スキップ）`;
        if(unknownTags.length>0) msg+=`。未知のタグを無視: ${unknownTags.join(', ')}`;
        state.live.csvStatus=msg;
        state.live.tagsCsvLoaded=true;
        // STEP1bのテキストエリアに、現在の回のAIタグを「Q1: tag;tag」形式で反映
        // （編集して「AIタグを取り込む」を押せば表・CSV双方に反映される一つの
        // データにするため。個人別回はこの欄の対象外なのでそのまま）
        const atNow=activeTest();
        if(atNow&&atNow.kind!=='individual') atNow.aireply=aiTagsToReplyText(atNow);
        render();
      }catch(e){
        state.live.csvStatus=' 問題タグCSVエラー: '+e.message;
        render();
      }
    };
    reader.readAsText(file);
  }

  // 問題タグ用CSVのテンプレート
  function downloadCSVTemplateTags(){
    const lv=state.live;
    let csv='question_id,teacher_tags\n';
    csv+='# タグはセミコロン区切り。例: Q01,relative-clause;vocabulary\n';
    csv+=`# 使用可能なタグ: ${TAGS.join(', ')}\n`;
    // 共通テスト回
    const commonTest=lv.tests.find(t=>t.kind!=='individual');
    const nQ=commonTest?(commonTest.nQ||lv.nQ):lv.nQ;
    for(let q=1;q<=nQ;q++)
      csv+=`Q${String(q).padStart(2,'0')},\n`;
    // 個人別回があれば生徒ごとに追記
    lv.tests.forEach((t,ti)=>{
      if(t.kind!=='individual') return;
      const tid=`test${String(ti+1).padStart(2,'0')}`;
      for(let s=0;s<lv.nStudents;s++){
        const ps=t.perStudent&&t.perStudent[s];
        const pnQ=ps?ps.nQ:(t.nQ||lv.nQ);
        const sid=`S${String(s+1).padStart(2,'0')}`;
        for(let q=1;q<=pnQ;q++)
          csv+=`${sid}_Q${String(q).padStart(2,'0')},\n`;
      }
    });
    downloadFile(csv,'question_tags_template.csv');
  }

  // 入力済み教師タグをCSVで書き出し（保存・引き継ぎ用）
  //   共通テスト回: test_id, question_id(Q01), teacher_tags
  //   個人別回:    test_id, question_id(S01_Q01), teacher_tags
  function exportTagsCSV(){
    const lv=state.live;
    ensureGrid();
    let csv='test_id,question_id,teacher_tags,ai_tags,teacher_source\n';
    let count=0;
    lv.tests.forEach((t,ti)=>{
      const tid=`test${String(ti+1).padStart(2,'0')}`;
      if(t.kind!=='individual'){
        const nQ=t.nQ||lv.nQ;
        for(let q=0;q<nQ;q++){
          const qq=t.questions[q]; if(!qq) continue;
          const tTags=(qq.teacher||[]).join(';');
          const aTags=(qq.ai||[]).join(';');
          if(!tTags&&!aTags) continue;
          const src=qq.teacherSource||'';
          const baseNum = qq.subLabel!==null ? qq.parentQ+1 : q+1;
          const qid = qq.subLabel
            ? `Q${String(baseNum).padStart(2,'0')}${qq.subLabel}`
            : `Q${String(q+1).padStart(2,'0')}`;
          csv+=`${tid},${qid},${tTags},${aTags},${src}\n`;
          count++;
        }
      } else {
        for(let s=0;s<lv.nStudents;s++){
          const ps=t.perStudent&&t.perStudent[s]; if(!ps) continue;
          const sid=`S${String(s+1).padStart(2,'0')}`;
          for(let q=0;q<ps.nQ;q++){
            const qq=ps.questions&&ps.questions[q]; if(!qq) continue;
            const tTags=(qq.teacher||[]).join(';');
            const aTags=(qq.ai||[]).join(';');
            if(!tTags&&!aTags) continue;
            const src=qq.teacherSource||'';
            csv+=`${tid},${sid}_Q${String(q+1).padStart(2,'0')},${tTags},${aTags},${src}\n`;
            count++;
          }
        }
      }
    });
    const st=root.querySelector('#csv-status');
    if(count===0){
      if(st) st.textContent=' 保存できるタグデータがありません。';
      return;
    }
    downloadFile(csv,'question_tags_saved.csv');
    if(st) st.textContent=` ${count}問のタグデータ（教師タグ・AIタグ）をCSVに保存しました。`;
  }

  // 入力済みの全テスト回データをCSVで書き出し（保存・引き継ぎ用）
  function exportLiveCSV(){
    const lv=state.live;
    ensureGrid();
    let csv='test_id,question_id,student_id,correct\n';
    let count=0;
    lv.tests.forEach((t,ti)=>{
      const tid=`test${String(ti+1).padStart(2,'0')}`;
      if(t.kind!=='individual'){
        const nQ=t.nQ||lv.nQ;
        for(let q=0;q<nQ;q++){
          const qq=t.questions&&t.questions[q];
          const baseNum = qq&&qq.subLabel!==null ? qq.parentQ+1 : q+1;
          const qid = qq&&qq.subLabel
            ? `Q${String(baseNum).padStart(2,'0')}${qq.subLabel}`
            : `Q${String(q+1).padStart(2,'0')}`;
          for(let s=0;s<lv.nStudents;s++){
            const v=(t.grid[s]&&t.grid[s][q]!==undefined)?t.grid[s][q]:null;
            if(v===null||v===undefined) continue;
            csv+=`${tid},${qid},S${String(s+1).padStart(2,'0')},${v}\n`;
            count++;
          }
        }
      } else {
        // 個人別回：問題番号は生徒ごと（例 S01_Q01）として区別
        for(let s=0;s<lv.nStudents;s++){
          const ps=t.perStudent[s]; if(!ps) continue;
          const sid=`S${String(s+1).padStart(2,'0')}`;
          for(let q=0;q<ps.nQ;q++){
            const v=ps.answers[q];
            if(v===null||v===undefined) continue;
            csv+=`${tid},${sid}_Q${String(q+1).padStart(2,'0')},${sid},${v}\n`;
            count++;
          }
        }
      }
    });
    const st=root.querySelector('#csv-status');
    if(count===0){
      if(st) st.textContent=' 保存できる入力データがありません。';
      return;
    }
    downloadFile(csv,'responses_saved.csv');
    if(st) st.textContent=` ${count}件の解答データをCSVに保存しました。`;
  }

  function exportPlan(){
    const map=buildMap(state.data,state.data.cfg.nTests);
    const valid=TAGS.filter(t=>map[t]!==null);
    const TOTAL=20; const weights={}; let wsum=0;
    valid.forEach(t=>{const w=Math.max(0.05,1-map[t]);weights[t]=w;wsum+=w;});
    let csv='tag,tag_ja,class_accuracy,planned_questions\n';
    valid.map(t=>({t,acc:map[t],n:Math.max(1,Math.round(TOTAL*weights[t]/wsum))}))
      .sort((a,b)=>a.acc-b.acc)
      .forEach(p=>csv+=`${p.t},${TAG_JA[p.t]},${p.acc.toFixed(4)},${p.n}\n`);
    downloadFile(csv,'question_plan.csv');
  }

  // ============================================================
  // A: JSONセッション保存・復元
  // ============================================================
  const SESSION_VERSION = 1;

  function exportSession(){
    const payload = {
      _version: SESSION_VERSION,
      _saved: new Date().toISOString(),
      live: JSON.parse(JSON.stringify(state.live))
    };
    const json = JSON.stringify(payload, null, 2);
    const blob = new Blob([json], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `tsumazuki_session_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    // 保存済みフラグを更新
    localStorage.setItem('tsumazuki_last_export', Date.now().toString());
    localStorage.setItem('tsumazuki_saved_hash', liveHash());
    render();
  }

  function importSession(file){
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const payload = JSON.parse(reader.result);
        if(!payload.live) throw new Error('形式が不正です（live フィールドがありません）');
        state.live = payload.live;
        ensureGrid();
        state.appMode = 'live';
        state.data = null;
        // 自動保存にも反映
        autoSave();
        const savedAt = payload._saved
          ? new Date(payload._saved).toLocaleString('ja-JP')
          : '不明';
        alert(`セッションを復元しました（保存日時: ${savedAt}）\n\n` +
          `テスト${state.live.tests.length}回・生徒${state.live.nStudents}名のデータを読み込みました。`);
        render();
      } catch(e) {
        alert('JSONの読み込みに失敗しました: ' + e.message);
      }
    };
    reader.readAsText(file);
  }

  // ============================================================
  // B: localStorage 自動保存
  // ============================================================
  const LS_KEY   = 'tsumazuki_autosave';
  const LS_TIME  = 'tsumazuki_autosave_time';
  const LS_AUTO  = 'tsumazuki_autosave_enabled';
  const LS_HASH  = 'tsumazuki_saved_hash';

  function autoSaveEnabled(){
    return localStorage.getItem(LS_AUTO) !== 'off';
  }

  // state.live の簡易ハッシュ（変更検出用）
  function liveHash(){
    try { return JSON.stringify(state.live).length.toString(); }
    catch(e){ return '0'; }
  }

  function hasUnsaved(){
    if(!autoSaveEnabled()) return false;
    const savedHash = localStorage.getItem(LS_HASH);
    return savedHash !== null && savedHash !== liveHash();
  }

  function autoSave(){
    if(!autoSaveEnabled()) return;
    if(state.appMode !== 'live') return;
    try {
      localStorage.setItem(LS_KEY,  JSON.stringify(state.live));
      localStorage.setItem(LS_TIME, Date.now().toString());
      localStorage.setItem(LS_HASH, liveHash());
    } catch(e){
      console.warn('自動保存失敗:', e);
    }
  }

  function autoLoad(){
    if(!autoSaveEnabled()) return false;
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return false;
    try {
      state.live = JSON.parse(raw);
      ensureGrid();
      return true;
    } catch(e){
      return false;
    }
  }

  function lastSaveTimeStr(){
    const t = localStorage.getItem(LS_TIME);
    if(!t) return '';
    const d = new Date(parseInt(t));
    return `最終自動保存: ${d.toLocaleTimeString('ja-JP')}`;
  }

  function clearAutoSave(){
    if(!confirm('ブラウザに保存された自動保存データを消去しますか？')) return;
    localStorage.removeItem(LS_KEY);
    localStorage.removeItem(LS_TIME);
    localStorage.removeItem(LS_HASH);
    render();
  }

  function downloadFile(text,name){
    const blob=new Blob([text],{type:'text/csv'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download=name; a.click();
  }

  // HTMLエスケープ（プロンプト中の < > & を安全に表示）
  function escapeHTML(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;');
  }

  // 初期化：自動保存が有効なら前回セッションを復元
  ensureGrid();
  if(autoSaveEnabled()){
    const restored = autoLoad();
    if(restored){
      state.appMode = 'live';
      // 復元通知は軽量にステータスとして表示（アラートは出さない）
    }
  }
  render();
})();
</script>
