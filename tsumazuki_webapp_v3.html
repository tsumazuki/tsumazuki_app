<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>つまずきマップ研究シミュレータ</title>

        https://ユーザー名.github.io/リポジトリ名/
     画像 screenshot.jpg は、このHTMLと同じ場所に置いてください。
     ※ 相対パスでは多くのSNSがプレビューを生成できないため、
        og:image / og:url は必ず絶対URL（https://〜）で記述します。
     ============================================================ -->

<meta property="og:description" content="英語読解のAI活用授業 ／ 弱点分析・AIタグ検証・問題自動生成。まずダミーモードで挙動を確かめられます。">

<meta property="og:url" content="https://tsumazuki.github.io/tsumazuki_app/tsumazuki_webapp_v3.html">

<meta property="og:image:width" content="1200">

<!-- Twitter/X 用（大きな画像つきカード） -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="つまずきマップ研究シミュレータ">
<meta name="twitter:description" content="英語読解のAI活用授業 ／ 弱点分析・AIタグ検証・問題自動生成">
<meta name="twitter:image" content="https://tsumazuki.github.io/tsumazuki_app/screenshot.jpg">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

<!-- つまずきマップ研究 Webアプリ版 v3：ダミー/本番モード + 問題生成 -->
<div id="app-root"></div>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Spline+Sans+Mono:wght@400;600&display=swap');

  #app-root {
    --ink: #1a2233;
    --paper: #f4f1ea;
    --card: #ffffff;
    --line: #d8d2c4;
    --accent: #b5462f;
    --accent2: #2f5d62;
    --good: #2f7d4f;
    --warn: #c98a2b;
    --bad: #b5462f;
    --mute: #8a8474;
    --dummy: #2f5d62;
    --live: #b5462f;
    font-family: 'Zen Kaku Gothic New', sans-serif;
    color: var(--ink);
    background: var(--paper);
    background-image: radial-gradient(var(--line) 0.6px, transparent 0.6px);
    background-size: 22px 22px;
    padding: 24px 20px 60px;
    line-height: 1.7;
    max-width: 1100px;
    margin: 0 auto;
  }
  #app-root * { box-sizing: border-box; }

  .hdr { border-bottom: 3px solid var(--ink); padding-bottom: 12px; margin-bottom: 14px; }
  .hdr h1 { font-size: 1.55rem; font-weight: 700; margin: 0 0 3px; letter-spacing: -0.01em; }
  .hdr .sub { color: var(--mute); font-size: 0.84rem; }

  /* モード切替 */
  .mode-switch {
    display: flex; gap: 0; margin: 14px 0 6px; border: 2px solid var(--ink);
    border-radius: 4px; overflow: hidden; width: fit-content;
  }
  .mode-btn {
    padding: 9px 22px; cursor: pointer; font-weight: 700; font-size: 0.9rem;
    background: var(--card); border: none; transition: all .15s;
    display: flex; align-items: center; gap: 7px;
  }
  .mode-btn:first-child { border-right: 2px solid var(--ink); }
  .mode-btn .dot { width: 9px; height: 9px; border-radius: 50%; }
  .mode-btn[data-mode=dummy] .dot { background: var(--dummy); }
  .mode-btn[data-mode=live] .dot { background: var(--live); }
  .mode-btn.active[data-mode=dummy] { background: var(--dummy); color: #fff; }
  .mode-btn.active[data-mode=dummy] .dot { background: #fff; }
  .mode-btn.active[data-mode=live] { background: var(--live); color: #fff; }
  .mode-btn.active[data-mode=live] .dot { background: #fff; }

  .mode-banner {
    font-size: 0.8rem; padding: 7px 14px; border-radius: 3px; margin-bottom: 16px;
    font-weight: 500;
  }
  .mode-banner.dummy { background: #e3eded; color: var(--dummy);
    border-left: 4px solid var(--dummy); }
  .mode-banner.live { background: #f6e4df; color: var(--live);
    border-left: 4px solid var(--live); }

  .steps { display: flex; gap: 5px; margin: 0 0 22px; flex-wrap: wrap; }
  .step-tab {
    flex: 1; min-width: 120px; border: 1.5px solid var(--line);
    background: var(--card); padding: 9px 11px; cursor: pointer;
    border-radius: 3px; transition: all .15s;
  }
  .step-tab:hover { border-color: var(--accent2); }
  .step-tab.active { border-color: var(--ink); box-shadow: 3px 3px 0 var(--ink); }
  .step-tab .n {
    font-family: 'Spline Sans Mono', monospace; font-size: 0.68rem;
    color: var(--accent); font-weight: 600;
  }
  .step-tab .t { font-size: 0.85rem; font-weight: 500; }
  .step-tab.done .n::after { content: ' ✓'; color: var(--good); }
  .step-tab.locked { opacity: .45; cursor: not-allowed; }

  .panel { display: none; }
  .panel.active { display: block; animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .card {
    background: var(--card); border: 1.5px solid var(--line);
    border-radius: 4px; padding: 19px 21px; margin-bottom: 16px;
  }
  .card h2 {
    font-size: 1.02rem; margin: 0 0 4px; font-weight: 700;
    display: flex; align-items: baseline; gap: 8px;
  }
  .card h2 .tag {
    font-family: 'Spline Sans Mono', monospace; font-size: 0.66rem;
    background: var(--ink); color: var(--paper); padding: 2px 7px;
    border-radius: 2px; font-weight: 600;
  }
  .card .desc { color: var(--mute); font-size: 0.84rem; margin-bottom: 13px; }

  .ctrl-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(185px, 1fr));
    gap: 13px 18px; margin: 14px 0;
  }
  .ctrl label { font-size: 0.79rem; font-weight: 500; display: block; margin-bottom: 3px; }
  .ctrl .val {
    font-family: 'Spline Sans Mono', monospace; color: var(--accent);
    font-weight: 600; float: right;
  }
  .ctrl input[type=range] { width: 100%; accent-color: var(--accent2); }
  .ctrl .hint { font-size: 0.71rem; color: var(--mute); }

  button.run {
    font-family: 'Zen Kaku Gothic New', sans-serif; font-weight: 700;
    background: var(--ink); color: var(--paper); border: none;
    padding: 10px 20px; font-size: 0.9rem; cursor: pointer;
    border-radius: 3px; box-shadow: 3px 3px 0 var(--accent);
    transition: transform .1s; margin-right: 8px;
  }
  button.run:hover { transform: translate(-1px,-1px); }
  button.run:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 var(--accent); }
  button.ghost {
    background: transparent; color: var(--ink); border: 1.5px solid var(--ink);
    box-shadow: none; padding: 8px 15px; font-size: 0.82rem; font-weight: 500;
    border-radius: 3px; cursor: pointer; margin-right: 8px;
  }
  button.ghost:hover { background: var(--ink); color: var(--paper); }
  button:disabled { opacity: .4; cursor: not-allowed; }

  .metrics { display: flex; gap: 12px; flex-wrap: wrap; margin: 13px 0; }
  .metric {
    flex: 1; min-width: 110px; border: 1.5px solid var(--line);
    border-radius: 3px; padding: 11px 13px; background: var(--paper);
  }
  .metric .k { font-size: 0.71rem; color: var(--mute); }
  .metric .v {
    font-family: 'Spline Sans Mono', monospace; font-size: 1.4rem;
    font-weight: 600; line-height: 1.2;
  }
  .metric .v.good { color: var(--good); }
  .metric .v.warn { color: var(--warn); }
  .metric .v.bad { color: var(--bad); }

  .bar-row { display: flex; align-items: center; gap: 9px; margin: 5px 0; }
  .bar-row .lbl {
    width: 168px; font-size: 0.76rem; text-align: right;
    font-family: 'Spline Sans Mono', monospace; line-height: 1.3;
  }
  /* タグソースのバッジ */
  .src-badge {
    display: inline-block; font-size: 0.6rem; font-weight: 600;
    padding: 1px 5px; border-radius: 2px; vertical-align: middle;
    font-family: 'Zen Kaku Gothic New', sans-serif; line-height: 1.3;
    margin-left: 2px;
  }
  .src-manual   { background: #e8f1ea; color: #2d5a3a; border: 1px solid #b0c8b6; }
  .src-ai       { background: #f0ecf5; color: #4a3a6a; border: 1px solid #c0b0d0; }
  .src-ai-edit  { background: #fcf2e0; color: #7a5a1a; border: 1px solid #d8c890; }
  .src-mixed    { background: #ece8e0; color: #4a4030; border: 1px solid #c0b8a8; }
  .bar-track {
    flex: 1; height: 21px; background: var(--paper);
    border: 1px solid var(--line); border-radius: 2px; position: relative;
  }
  .bar-fill { height: 100%; border-radius: 1px; transition: width .5s ease; }
  .bar-row .pct {
    width: 88px; font-size: 0.74rem; font-family: 'Spline Sans Mono', monospace;
  }

  svg.scatter { width: 100%; max-width: 420px; display: block; margin: 8px auto; }

  table.cmp { width: 100%; border-collapse: collapse; font-size: 0.81rem; margin-top: 9px; }
  table.cmp th, table.cmp td {
    border: 1px solid var(--line); padding: 5px 8px; text-align: right;
  }
  table.cmp th { background: var(--ink); color: var(--paper); font-weight: 500; }
  table.cmp td:first-child, table.cmp th:first-child {
    text-align: left; font-family: 'Spline Sans Mono', monospace;
  }
  table.cmp tr:nth-child(even) td { background: var(--paper); }
  /* 生徒別プロンプト・QRコード */
  .stu-prompt-list { display:flex; flex-direction:column; gap:16px; margin-top:12px; }
  .stu-prompt-card {
    border:1px solid var(--border); border-radius:8px; overflow:hidden;
  }
  .stu-prompt-head {
    display:flex; align-items:center; gap:10px;
    padding:8px 14px; background:var(--surface); border-bottom:1px solid var(--border);
    font-size:.85rem; font-weight:700;
  }
  .stu-acc-pill {
    font-size:.73rem; font-weight:600; padding:2px 8px; border-radius:10px;
    background:#fde8e8; color:#b00;
  }
  .stu-acc-pill.mid { background:#fff4d6; color:#7a5000; }
  .stu-acc-pill.ok  { background:#e8f5e9; color:#2d5a3a; }
  .stu-prompt-body { padding:10px 14px; }
  .stu-weak-tags { display:flex; gap:5px; flex-wrap:wrap; margin-bottom:8px; }
  .stu-weak-tag {
    font-size:.73rem; padding:2px 8px; border-radius:10px;
    background:#fde8e8; color:#b00; border:1px solid #f5a5a5;
  }
  .qr-area { display:flex; align-items:flex-start; gap:14px; margin-top:8px; }
  .qr-canvas-wrap {
    flex-shrink:0; background:#fff; padding:6px; border-radius:6px;
    border:1px solid var(--border); display:none;
  }
  .qr-canvas-wrap.show { display:block; }
  .qr-prompt-text {
    flex:1; font-size:.74rem; font-family:'Spline Sans Mono',monospace;
    white-space:pre-wrap; word-break:break-all;
    background:#f8f8f6; border:1px solid var(--border); border-radius:5px;
    padding:8px; max-height:160px; overflow-y:auto; color:var(--ink);
  }
  .qr-btns { display:flex; gap:6px; margin-top:6px; flex-wrap:wrap; }
  .qr-note { font-size:.72rem; color:var(--mute); margin-top:4px; }
  .all-stu-btn {
    display:inline-flex; align-items:center; gap:6px;
    padding:7px 16px; border-radius:8px; font-size:.85rem; font-weight:600;
    background:var(--accent); color:#fff; border:none; cursor:pointer;
    margin-bottom:12px;
  }
  .all-stu-btn:hover { filter:brightness(1.1); }

  /* セッション保存バー */
  .session-bar {
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    padding:7px 16px; background:var(--surface); border-bottom:1px solid var(--border);
    font-size:.82rem;
  }
  .session-label { font-weight:600; color:var(--ink); margin-right:2px; }
  .sess-btn {
    padding:3px 11px; border-radius:6px; border:1px solid var(--border);
    background:#fff; font-size:.81rem; cursor:pointer; white-space:nowrap;
    color:var(--ink); transition:background .15s;
  }
  .sess-btn:hover { background:var(--accent2); }
  .sess-time { font-size:.77rem; color:var(--mute); }
  .unsaved-badge {
    padding:2px 9px; border-radius:10px; font-size:.77rem; font-weight:600;
    background:#fff4d6; color:#7a5000; border:1px solid #f0c040;
    animation: pulse-badge 1.8s ease-in-out infinite;
  }
  @keyframes pulse-badge { 0%,100%{opacity:1} 50%{opacity:.6} }

  .tag-chip { display:inline-block; padding:1px 7px; border-radius:10px; font-size:.78rem;
    background:var(--surface); border:1px solid var(--border); margin:1px 2px; }
  .tag-chip.bad  { background:#fde8e8; border-color:#f5a5a5; color:#b00; }
  .tag-chip.warn { background:#fff4d6; border-color:#f0c040; color:#7a5000; }
  /* CSV保存/読み込みタブ */
  .csv-section-head {
    font-size:.83rem; font-weight:700; color:var(--ink);
    padding:6px 0 4px; border-bottom:2px solid var(--accent2); margin-bottom:8px;
  }
  .csv-save-row { display:flex; gap:10px; flex-wrap:wrap; }
  .save-btn {
    padding:7px 18px; border-radius:8px; font-size:.87rem; font-weight:600;
    cursor:pointer; border:none; transition:filter .15s;
  }
  .primary-save {
    background:var(--accent); color:#fff;
  }
  .primary-save:hover { filter:brightness(1.1); }

  .fb-qtext { font-size:.78rem; color:var(--mute); margin-top:3px;
    white-space:pre-wrap; line-height:1.4; max-height:60px; overflow:hidden; }

  .callout {
    border-left: 4px solid var(--accent2); background: #eef2f1;
    padding: 10px 15px; font-size: 0.84rem; margin: 13px 0; border-radius: 0 3px 3px 0;
  }
  .callout.warn { border-color: var(--warn); background: #faf3e6; }
  .callout.privacy {
    border-color: var(--good); background: #e8f1ea;
    display: flex; align-items: flex-start; gap: 8px;
  }
  .callout.privacy .lock { font-size: 1.1rem; line-height: 1.3; }
  .callout b { font-weight: 700; }

  /* タグ選択モーダル */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(26,34,51,0.55);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000; padding: 20px;
  }
  .modal {
    background: var(--card); border: 2px solid var(--ink); border-radius: 6px;
    padding: 20px 22px; max-width: 460px; width: 100%;
    box-shadow: 6px 6px 0 var(--ink);
  }
  .modal h3 { margin: 0 0 4px; font-size: 1rem; font-weight: 700; }
  .modal .msub { font-size: 0.78rem; color: var(--mute); margin-bottom: 12px; }
  .tag-pick-grid {
    display: grid; grid-template-columns: repeat(2,1fr); gap: 7px; margin: 10px 0;
  }
  .tag-pick {
    border: 1.5px solid var(--line); border-radius: 4px; padding: 8px 10px;
    cursor: pointer; font-size: 0.82rem; background: var(--paper);
    display: flex; align-items: center; gap: 7px; transition: all .12s;
  }
  .tag-pick:hover { border-color: var(--accent2); }
  .tag-pick.sel {
    border-color: var(--ink); background: var(--ink); color: #fff;
  }
  .tag-pick .chk {
    width: 16px; height: 16px; border: 1.5px solid var(--line);
    border-radius: 3px; flex-shrink: 0; display: flex;
    align-items: center; justify-content: center; font-size: 0.7rem;
    background: #fff; color: var(--ink);
  }
  .tag-pick.sel .chk { background: var(--good); border-color: var(--good); color:#fff; }
  .tag-pick .tnum {
    font-family: 'Spline Sans Mono', monospace; font-size: 0.68rem;
    opacity: 0.6; flex-shrink: 0;
  }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }

  /* 折れ線グラフの色別凡例 */
  .line-legend {
    display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 8px 0 4px;
    padding: 10px 12px; background: var(--paper);
    border: 1px solid var(--line); border-radius: 4px;
  }
  .ll-item { font-size: 0.78rem; display: flex; align-items: center; gap: 5px; }
  .ll-line {
    display: inline-block; width: 18px; height: 3px; border-radius: 2px;
  }
  .ll-en {
    font-family: 'Spline Sans Mono', monospace; font-size: 0.66rem;
    color: var(--mute); margin-left: 3px;
  }
  /* 回めくり（◀▶） */
  .map-nav {
    display: flex; align-items: center; gap: 12px; margin: 6px 0 10px;
  }
  .map-nav button {
    width: 32px; height: 32px; border: 1.5px solid var(--ink);
    background: var(--card); border-radius: 4px; cursor: pointer;
    font-size: 0.9rem; font-weight: 700; color: var(--ink);
  }
  .map-nav button:hover:not(:disabled) { background: var(--ink); color: #fff; }
  .map-nav button:disabled { opacity: .3; cursor: not-allowed; }
  .map-nav .mn-label {
    font-weight: 700; font-size: 0.92rem; min-width: 130px; text-align: center;
  }
  /* 生徒選択プルダウン */
  .stu-select {
    margin-left: 8px; padding: 6px 10px; font-size: 0.85rem;
    font-family: 'Spline Sans Mono', monospace; cursor: pointer;
    border: 1.5px solid var(--line); border-radius: 4px;
    background: var(--card); color: var(--ink);
  }
  .stu-select:hover { border-color: var(--accent2); }
  /* テスト回の種別バッジ */
  .kind-badge {
    display: inline-block; font-size: 0.6rem; font-weight: 700;
    padding: 0 4px; border-radius: 2px; vertical-align: middle;
  }
  .kind-badge.com { background: #e8f1ea; color: #2d5a3a; }
  .kind-badge.ind { background: #f0ecf5; color: #4a3a6a; }
  /* テスト回の種別選択 */
  .kind-pick {
    display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px;
    margin-bottom: 10px; padding: 8px 10px; background: var(--paper);
    border-radius: 4px;
  }
  .kind-opt { font-size: 0.8rem; cursor: pointer; display: inline-flex;
    align-items: center; gap: 4px; }
  /* 回ごとの問題数スライダー */
  .round-q {
    display: flex; flex-direction: column; gap: 3px;
    margin: 4px 0 12px; max-width: 380px;
  }
  .round-q input[type="range"] { width: 100%; }
  /* 個人別入力テーブル */
  .indiv-table th, .indiv-table td { border: 1px solid var(--line); }
  .indiv-table .indiv-tag:hover { background: var(--paper); }
  .indiv-cell {
    width: 48px; height: 28px; border: none; cursor: pointer; font-size: 0.85rem;
    font-family: 'Spline Sans Mono', monospace; background: var(--card);
  }
  .indiv-cell.c1 { background: #d6ead9; color: var(--good); font-weight: 700; }
  .indiv-cell.c0 { background: #f2dcd7; color: var(--bad); font-weight: 700; }
  .indiv-cell.cx { background: var(--card); color: var(--line); }
  /* クラス/個人 切替タブ */
  .scope-tabs { display: flex; gap: 0; margin: 4px 0 14px; border-bottom: 2px solid var(--line); }
  .scope-tab {
    padding: 8px 20px; cursor: pointer; font-size: 0.88rem; font-weight: 600;
    color: var(--mute); border-bottom: 3px solid transparent; margin-bottom: -2px;
  }
  .scope-tab:hover { color: var(--ink); }
  .scope-tab.active { color: var(--ink); border-bottom-color: var(--accent); }
  /* 偏差値カード */
  .dev-cards { display: flex; gap: 10px; flex-wrap: wrap; margin: 10px 0; }
  .dev-card {
    flex: 1; min-width: 120px; border: 1.5px solid var(--line);
    border-radius: 5px; padding: 12px 14px; background: var(--paper); text-align: center;
  }
  .dev-card.primary { border-color: var(--accent); background: #fdf3ee; }
  .dev-card .dev-k { font-size: 0.74rem; color: var(--mute); margin-bottom: 4px; }
  .dev-card .dev-v {
    font-size: 1.7rem; font-weight: 700; font-family: 'Spline Sans Mono', monospace;
    color: var(--ink); line-height: 1.1;
  }
  .dev-card.primary .dev-v { color: var(--accent); }
  .dev-card .dev-u { font-size: 0.9rem; font-weight: 400; color: var(--mute); }
  .dev-card .dev-sub { font-size: 0.7rem; color: var(--mute); margin-top: 3px; }
  /* 個人マップのクラス平均マーカー */
  .class-marker {
    position: absolute; top: -2px; bottom: -2px; width: 2px;
    background: var(--ink); z-index: 2;
  }
  .class-marker::after {
    content: "│"; position: absolute; top: -1px; left: -3px;
    font-size: 0.6rem; color: var(--ink);
  }

  .empty { color: var(--mute); font-size: 0.84rem; font-style: italic;
    text-align: center; padding: 28px; }

<script>
(function () {
  const root = document.getElementById('app-root');

  // ============================================================
  // 共通定義
  // ============================================================
  // ▼▼▼ タグを変更したいときは、この TAG_CONFIG だけを編集してください ▼▼▼
  //   en       : タグの英語名（半角英数とハイフンのみ。スペース不可）
  //   ja       : タグの日本語名（画面に併記される）
  //   baseline : ダミーモード用の「クラスの初期理解度」0〜1。
  //              小さいほどそのタグが弱点。本番モードでは使われない。
  //   行を増減すればタグが増減します。8〜10個程度を推奨。
  //   （ハイフンを含む英語名でも可。例 "relative-clause"）
  const TAG_CONFIG = [
    { en:"vocabulary",         ja:"語彙",    baseline:0.75 },
    { en:"idiom",              ja:"熟語",    baseline:0.60 },
    { en:"tense",              ja:"時制",    baseline:0.70 },
    { en:"relative-clause",    ja:"関係詞",  baseline:0.35 },
    { en:"participle",         ja:"分詞",    baseline:0.40 },
    { en:"sentence-structure", ja:"文構造",  baseline:0.55 },
    { en:"reference",          ja:"指示語",  baseline:0.65 },
    { en:"inference",          ja:"推論",    baseline:0.45 },
  ];
  // ダミーモードで「AIが混同しやすいタグの組」。左のタグを右のタグと取り違える。
  // 使うタグ名は上の TAG_CONFIG の en と一致させること。不要なら {} でよい。
  const AI_CONFUSION = { "participle":"relative-clause", "inference":"reference" };
  // ▲▲▲ 編集はここまで。以下は TAG_CONFIG から自動生成されるので触らない ▲▲▲

  const TAGS = TAG_CONFIG.map(t=>t.en);
  const TAG_JA = {};
  const CLASS_BASELINE = {};
  TAG_CONFIG.forEach(t=>{ TAG_JA[t.en]=t.ja; CLASS_BASELINE[t.en]=t.baseline; });

  function makeRng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
  function gauss(rng,m,sd){const u1=Math.max(rng(),1e-9),u2=rng();
    return m+sd*Math.sqrt(-2*Math.log(u1))*Math.cos(2*Math.PI*u2);}
  const clip01 = x => Math.min(0.98, Math.max(0.02, x));

  // ---- ダミーデータ生成（中程度モデル） ----
  function generate(cfg){
    const rng = makeRng(cfg.seed);
    const ability=[], gain=[];
    for(let s=0;s<cfg.nStudents;s++){
      ability.push(gauss(rng,0,cfg.spread));
      gain.push(Math.max(0,gauss(rng,cfg.gain,0.03)));
    }
    const truth=[];
    for(let s=0;s<cfg.nStudents;s++){
      truth.push([]);
      for(let t=1;t<=cfg.nTests;t++){
        const row={};
        for(const tag of TAGS){
          const base=CLASS_BASELINE[tag]+ability[s];
          row[tag]=clip01(base+gain[s]*(t-1)+gauss(rng,0,0.04));
        }
        truth[s].push(row);
      }
    }
    // 問題のタグ構成は「1セット」だけ決めて全テスト回で使い回す。
    // こうしないと回ごとにタグ分布が変わり、時系列比較が成立しない。
    const qTemplate=[];   // [{teacher:[...], ai:[...]}, ...] 長さ nQ
    for(let q=1;q<=cfg.nQ;q++){
      const nTag=rng()<0.7?1:2;
      const pool=TAGS.slice(), chosen=[];
      for(let i=0;i<nTag;i++) chosen.push(pool.splice(Math.floor(rng()*pool.length),1)[0]);
      let aiSet=new Set(chosen);
      if(rng()<0.20){
        const r=rng();
        if(r<0.34){for(const c of[...aiSet])if(AI_CONFUSION[c]){aiSet.delete(c);aiSet.add(AI_CONFUSION[c]);}}
        else if(r<0.67&&aiSet.size>1){aiSet.delete([...aiSet][Math.floor(rng()*aiSet.size)]);}
        else{aiSet.add(TAGS[Math.floor(rng()*TAGS.length)]);}
      }
      qTemplate.push({teacher:chosen,ai:[...aiSet]});
    }
    // 全テスト回に同じタグ構成を展開
    const questions=[];
    for(let t=1;t<=cfg.nTests;t++){
      for(let q=1;q<=cfg.nQ;q++){
        const tmpl=qTemplate[q-1];
        questions.push({test:t,q:q,
          teacher:tmpl.teacher.slice(), ai:tmpl.ai.slice()});
      }
    }
    const responses=[];
    for(const qq of questions){
      for(let s=0;s<cfg.nStudents;s++){
        const p=qq.teacher.reduce((a,tg)=>a+truth[s][qq.test-1][tg],0)/qq.teacher.length;
        responses.push({test:qq.test,q:qq.q,student:s,correct:rng()<p?1:0});
      }
    }
    // ダミーは全テスト回が共通テスト（全員同じ問題）
    const cfg2={...cfg, testKinds: Array.from({length:cfg.nTests},()=>'common')};
    return {truth,questions,responses,cfg:cfg2,mode:'dummy'};
  }

  // ---- 分析関数（両モード共通） ----
  function buildMap(data,upToTest){
    const acc={}; TAGS.forEach(t=>acc[t]={sum:0,n:0});
    const qmap={}; data.questions.forEach(q=>qmap[q.test+'_'+q.q]=q);
    for(const r of data.responses){
      if(r.test>upToTest) continue;
      if(r.correct===null||r.correct===undefined) continue;
      const q=qmap[r.test+'_'+r.q]; if(!q) continue;
      for(const tg of q.teacher){acc[tg].sum+=r.correct;acc[tg].n++;}
    }
    const out={}; TAGS.forEach(t=>out[t]=acc[t].n?acc[t].sum/acc[t].n:null);
    return out;
  }
  // 特定のテスト回1回分だけのタグ別正答率（時系列表示用）
  function buildMapForTest(data,testNo){
    const acc={}; TAGS.forEach(t=>acc[t]={sum:0,n:0});
    const qmap={}; data.questions.forEach(q=>qmap[q.test+'_'+q.q]=q);
    for(const r of data.responses){
      if(r.test!==testNo) continue;
      if(r.correct===null||r.correct===undefined) continue;
      const q=qmap[r.test+'_'+r.q]; if(!q) continue;
      for(const tg of q.teacher){acc[tg].sum+=r.correct;acc[tg].n++;}
    }
    const out={}; TAGS.forEach(t=>out[t]=acc[t].n?acc[t].sum/acc[t].n:null);
    return out;
  }
  // 各タグが「何回のテストで出題されたか」を数える（欠損回の把握用）
  // 返り値: { tag: {present: 出題された回数, total: 全テスト回数} }
  function tagPresence(data){
    const nT=data.cfg.nTests;
    const out={}; TAGS.forEach(t=>out[t]={present:0,total:nT});
    for(let k=1;k<=nT;k++){
      const m=buildMapForTest(data,k);
      TAGS.forEach(t=>{ if(m[t]!==null) out[t].present++; });
    }
    return out;
  }

  // ===== 個人単位の集計 =====
  // 特定の生徒のタグ別正答率（全テスト回まとめ、または特定回）
  //   studentIdx: 生徒インデックス（0始まり）
  //   testNo: null なら全回まとめ、数値ならその回だけ
  function buildMapForStudent(data, studentIdx, testNo){
    const acc={}; TAGS.forEach(t=>acc[t]={sum:0,n:0});
    const qmap={}; data.questions.forEach(q=>qmap[q.test+'_'+q.q]=q);
    for(const r of data.responses){
      if(r.student!==studentIdx) continue;
      if(testNo!=null && r.test!==testNo) continue;
      if(r.correct===null||r.correct===undefined) continue;
      const q=qmap[r.test+'_'+r.q]; if(!q) continue;
      for(const tg of q.teacher){acc[tg].sum+=r.correct;acc[tg].n++;}
    }
    const out={}; TAGS.forEach(t=>out[t]=acc[t].n?acc[t].sum/acc[t].n:null);
    return out;
  }

  // 各生徒の総合得点（全問の正答率）。testNo=null で全回まとめ
  //   返り値: [{student, correct, total, rate}] （rate=正答率0〜1）
  function studentTotalScores(data, testNo){
    const nS=data.cfg.nStudents;
    const acc=[]; for(let s=0;s<nS;s++) acc.push({student:s,correct:0,total:0});
    for(const r of data.responses){
      if(testNo!=null && r.test!==testNo) continue;
      if(r.correct===null||r.correct===undefined) continue;
      if(r.student<0||r.student>=nS) continue;
      acc[r.student].total++;
      acc[r.student].correct+=r.correct;
    }
    return acc.map(a=>({...a, rate: a.total? a.correct/a.total : null}));
  }

  // クラス内偏差値を算出（総合得点ベース）
  //   返り値: [{student, correct, total, rate, deviation}] と統計情報
  //   deviation = 50 + 10 * (rate - mean) / sd （sd=0なら全員50）
  function studentDeviations(data, testNo){
    const scores=studentTotalScores(data, testNo);
    const valid=scores.filter(s=>s.rate!=null);
    if(valid.length===0){
      return {scores: scores.map(s=>({...s,deviation:null})), mean:null, sd:null, n:0};
    }
    const rates=valid.map(s=>s.rate);
    const mean=rates.reduce((a,b)=>a+b,0)/rates.length;
    const variance=rates.reduce((a,b)=>a+(b-mean)*(b-mean),0)/rates.length;
    const sd=Math.sqrt(variance);
    const out=scores.map(s=>{
      if(s.rate==null) return {...s, deviation:null};
      const dev = sd>1e-9 ? 50 + 10*(s.rate-mean)/sd : 50;
      return {...s, deviation: dev};
    });
    return {scores: out, mean, sd, n: valid.length};
  }
  // タグごとの「教師タグソース」内訳を集計
  //   各タグについて、そのタグを含む問題が「教員手動/AIコピー/AI修正」の
  //   どれで付けられたかを数える。返り値: { tag: {manual, aiCopy, aiEdited, total} }
  //   total はそのタグが教師タグとして付いている問題の数（テスト回ごと重複あり）
  function tagSourceBreakdown(data){
    const out={};
    TAGS.forEach(t=>out[t]={manual:0,aiCopy:0,aiEdited:0,total:0});
    if(!data.questions) return out;
    data.questions.forEach(q=>{
      if(!q.teacher||q.teacher.length===0) return;
      const src=q.teacherSource;
      q.teacher.forEach(tg=>{
        if(!out[tg]) return;
        out[tg].total++;
        if(src==='ai-copy') out[tg].aiCopy++;
        else if(src==='ai-edited') out[tg].aiEdited++;
        else out[tg].manual++;  // null も manual 扱い（ダミーモード等）
      });
    });
    return out;
  }
  // タグソース内訳から「主たる由来」を返す（バッジ表示用）
  //   全てmanualなら 'manual'、全てaiCopyなら 'ai-copy'、
  //   ai-edited が混じれば 'ai-edited'、混在なら 'mixed'
  function dominantSource(brk){
    if(!brk||brk.total===0) return null;
    if(brk.aiEdited>0 && (brk.manual>0||brk.aiCopy>0)) return 'mixed';
    if(brk.aiEdited>0) return 'ai-edited';
    if(brk.aiCopy>0 && brk.manual>0) return 'mixed';
    if(brk.aiCopy>0) return 'ai-copy';
    return 'manual';
  }
  function truthMean(data,upToTest){
    const out={};
    TAGS.forEach(tg=>{
      let sum=0,n=0;
      for(let s=0;s<data.cfg.nStudents;s++)
        for(let t=0;t<upToTest;t++){sum+=data.truth[s][t][tg];n++;}
      out[tg]=sum/n;
    });
    return out;
  }
  function tagAgreement(data){
    let sum=0,perfect=0,evaluated=0;
    for(const q of data.questions){
      if(!q.ai||q.ai.length===0) continue;
      const a=new Set(q.teacher),b=new Set(q.ai);
      const inter=[...a].filter(x=>b.has(x)).length;
      const uni=new Set([...a,...b]).size;
      const j=uni?inter/uni:1;
      sum+=j; if(j===1)perfect++; evaluated++;
    }
    return {mean:evaluated?sum/evaluated:0,perfect,total:evaluated};
  }
  function pearson(x,y){
    const n=x.length,mx=x.reduce((a,b)=>a+b)/n,my=y.reduce((a,b)=>a+b)/n;
    let sxy=0,sxx=0,syy=0;
    for(let i=0;i<n;i++){const dx=x[i]-mx,dy=y[i]-my;sxy+=dx*dy;sxx+=dx*dx;syy+=dy*dy;}
    return sxy/Math.sqrt(sxx*syy||1e-9);
  }
  function recovery(data,upToTest){
    const est=buildMap(data,upToTest),tru=truthMean(data,upToTest);
    let errSum=0,sqSum=0,n=0; const ex=[],ey=[];
    TAGS.forEach(tg=>{
      if(est[tg]===null) return;
      const e=est[tg]-tru[tg];
      errSum+=Math.abs(e);sqSum+=e*e;n++;ex.push(tru[tg]);ey.push(est[tg]);
    });
    return {mae:errSum/n,rmse:Math.sqrt(sqSum/n),corr:pearson(ex,ey),est,tru};
  }

  function dummyDataPreview(){
    const d=state.data;
    if(!d||d.mode!=='dummy') return '';
    const nT=d.cfg.nTests, nQ=d.cfg.nQ, nS=d.cfg.nStudents;
    // 表示中のテスト回を整える
    if(state.dummyDataViewTest>=nT) state.dummyDataViewTest=0;
    const vt=state.dummyDataViewTest;  // 0始まり
    const testNo=vt+1;

    // この回の問題タグを取り出す
    const qmap={};
    d.questions.filter(q=>q.test===testNo).forEach(q=>{ qmap[q.q]=q; });
    // 正誤を {studentIdx: [q0_correct, q1_correct, ...]} の形にまとめる
    const grid=[];
    for(let s=0;s<nS;s++) grid.push(new Array(nQ).fill(null));
    d.responses.filter(r=>r.test===testNo).forEach(r=>{
      grid[r.student][r.q-1]=r.correct;
    });
    // ヘッダ：Q1 教師タグ / AIタグ（食い違うときだけ）を表示
    let qhdr='<th>生徒＼問題</th>';
    for(let q=1;q<=nQ;q++){
      const qq=qmap[q]||{teacher:[],ai:[]};
      const tlbl=qq.teacher.map(t=>TAG_JA[t]).join('/')||'(なし)';
      const sameAsTeacher = qq.teacher.length===qq.ai.length &&
        qq.teacher.every(t=>qq.ai.includes(t));
      let aiLine='';
      if(!sameAsTeacher){
        const albl=qq.ai.map(t=>TAG_JA[t]).join('/')||'(なし)';
        aiLine=`<br><span style="font-size:.62rem;color:#a04a6a">AI: ${albl} ★</span>`;

    // 本体

    // 表示するのは最大15人まで（多すぎると重い）
    const maxRows=Math.min(nS,15);
    for(let s=0;s<maxRows;s++){
      body+=`<tr><td class="sid">S${String(s+1).padStart(2,'0')}</td>`;
      for(let q=0;q<nQ;q++){
        const v=grid[s][q];
        const cls=v===1?'c1':v===0?'c0':'cx';
        const label=v===1?'○':v===0?'×':'－';
        body+=`<td><span class="cell-view ${cls}">${label}</span></td>`;

      body+='</tr>';

      : '';

    const navHTML = nT>1 ? `
      <div class="map-nav">
        <button id="dummy-prev" ${vt<=0?'disabled':''}>&#9664;</button>
        <span class="mn-label">第${testNo}回 / 全${nT}回</span>
        <button id="dummy-next" ${vt>=nT-1?'disabled':''}>&#9654;</button>
      </div>` : '';

    return `<div class="dummy-preview">
      <h2 style="font-size:.95rem;margin:18px 0 6px">生成されたダミーデータ（参考表示）</h2>
      <div class="small" style="margin-bottom:8px">

      </div>

      <div class="small" style="margin-top:8px;color:var(--mute)">
        ★ … AIタグが教師タグと食い違っている問題（混同・欠落・過剰のいずれか）。
        STEP 3 でAIタグの一致度を測ります。
      </div>
    </div>`;
  }

        <button class="ghost" id="import-aitags">AIタグを取り込む</button>
        <span class="small" id="aitag-status">${escapeHTML((activeTest()&&activeTest().aitagStatus)||'')}</span>
      </div>

      <div style="margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)">
        <div class="small" style="font-weight:500;margin-bottom:4px">
          &#9315; （任意）AIタグをそのまま教師タグとして使う</div>
        <div class="small" style="margin-bottom:6px">
          教員が個別にタグ付けする手間を省きたい場合、取り込んだAIタグを教師タグにも
          コピーできます。これでつまずきマップを自動作成できます。
          タグの由来は記録されるので、マップ上で「AI由来」と「教員手動」を区別できます。</div>
        <button class="ghost" id="copy-ai-to-teacher">AIタグを教師タグとして使う</button>
        ${lv.aiCopyUsed
          ? '<span class="ai-copy-badge">AIタグを教師タグとして使用中です</span>'
          : ''}
        <span class="small" id="ai-copy-status">${escapeHTML(lv.aiCopyStatus||'')}</span>
      </div>
    </div>

    <div class="card" style="text-align:center;background:transparent;border:none;box-shadow:none;padding-top:8px">
      <button class="run" id="live-apply" style="font-size:1rem;padding:14px 32px">この内容で分析する</button>
      <div id="live-result"></div>
    </div>`;
  }

  // テスト回の切り替えタブ
  function testTabsHTML(){
    const lv=state.live;
    let commonTabs='', indivTabs='';
    lv.tests.forEach((t,i)=>{
      let filled=0, total=0;
      if(t.kind==='individual'){
        (t.perStudent||[]).forEach(ps=>{
          total+=ps.nQ||0;
          (ps.answers||[]).forEach(v=>{ if(v===0||v===1) filled++; });
        });
      } else {
        total=lv.nStudents*(t.nQ||lv.nQ);
        (t.grid||[]).forEach(row=>row.forEach(v=>{ if(v===0||v===1) filled++; }));
      }
      const tab=`<div class="ttab ${i===lv.activeTest?'active':''}" data-ttab="${i}">
        第${i+1}回<br><span class="tprog">${filled}/${total}</span></div>`;
      if(t.kind==='individual') indivTabs+=tab;
      else commonTabs+=tab;
    });
    const cur=lv.tests[lv.activeTest];
    const curKind=cur?cur.kind||'common':'common';
    const curNQ=cur?(cur.nQ||lv.nQ):lv.nQ;
    const curMainN = cur&&cur.questions ? mainQCount(cur.questions) : curNQ;
    const subInfo = curMainN<curNQ
      ? '<span style="color:var(--mute);font-size:.72rem">（サブ問込み合計 '+curNQ+' 列）</span>' : '';
    const roundQSlider = curKind==='common' ? `
      <div class="round-q">
        <span class="small" style="font-weight:500">第${lv.activeTest+1}回の大問数：
          <span class="val" id="lv-roundq">${curMainN}</span>
          ${subInfo}
        </span>
        <input type="range" id="rl-roundq" min="3" max="30" value="${curMainN}">
        <span class="small" style="color:var(--mute)">サブ問を除いた大問数で設定します。</span>
      </div>` : '';
    return `<div class="test-tabs">
      <div class="test-tabs-row">
        <span class="test-tabs-row-label">共通</span>
        ${commonTabs||'<span class="small" style="color:var(--mute)">なし</span>'}
      </div>
      <div class="test-tabs-row">
        <span class="test-tabs-row-label">個人別</span>
        ${indivTabs||'<span class="small" style="color:var(--mute)">なし</span>'}
        <div class="ttab add" data-ttab="add" title="テスト回を追加">＋ 回を追加</div>
        ${lv.tests.length>1?'<div class="ttab del" data-ttab="del" title="現在の回を削除">－ 削除</div>':''}
      </div>
    </div>
    <div class="small" style="margin-bottom:4px">
      編集中：<b>第${lv.activeTest+1}回</b>（${curKind==='common'?'共通テスト':'個人別問題'}）。タブで回を切り替え。</div>
    <div class="kind-pick">
      <span class="small" style="font-weight:500">第${lv.activeTest+1}回の種別：</span>
      <label class="kind-opt"><input type="radio" name="testkind" value="common"
        ${curKind==='common'?'checked':''}> 共通テスト（全員同じ問題・偏差値の対象）</label>
      <label class="kind-opt"><input type="radio" name="testkind" value="individual"
        ${curKind==='individual'?'checked':''}> 個人別問題（生徒ごとに違う問題・偏差値なし）</label>
    </div>
    ${roundQSlider}`;
  }

  // 本番モード：手入力グリッド（現在の編集回を表示）
  function gridInputHTML(){
    const lv=state.live;
    const at=activeTest();
    const nQ=at.nQ||lv.nQ;
    const qs=at.questions;
    const mainN=mainQCount(qs);
    let qhdr='<th>生徒＼問題</th>';
    for(let q=0;q<nQ;q++){
      const tags=qs[q]||{teacher:[],ai:[],subLabel:null};
      const isSub = tags.subLabel !== null;
      const lbl = qLabel(q, qs);
      const tagTxt = tags.teacher.map(t=>TAG_JA[t]).join('/')||'タグ未設定';
      const subCls = isSub ? 'class="qhdr qhdr-sub"' : 'class="qhdr"';
      qhdr+=`<th ${subCls} data-qi="${q}" title="クリックでタグを設定/分割">
        ${lbl}<br>
        <span style="font-size:.62rem;color:#bbb">${tagTxt}</span></th>`;
    }
    let body='';
    for(let s=0;s<lv.nStudents;s++){
      body+=`<tr><td class="sid">S${String(s+1).padStart(2,'0')}</td>`;
      for(let q=0;q<nQ;q++){
        const isSub = (qs[q]||{}).subLabel !== null;
        const v=(at.grid[s]&&at.grid[s][q]!==undefined)?at.grid[s][q]:null;
        const cls=v===1?'c1':v===0?'c0':'cx';
        const label=v===1?'○':v===0?'×':'－';
        const cellSt = isSub ? 'style="background:#f0f2f2"' : '';
        body+=`<td ${cellSt}><button class="cell-btn ${cls}" data-s="${s}" data-q="${q}">${label}</button></td>`;
      }
      body+='</tr>';
    }
    const mainInfo = mainN < nQ
      ? `大問 ${mainN} 問（うちサブ問あり）、合計 ${nQ} 列`
      : `${nQ} 問`;
    return `<div class="small" style="margin-bottom:6px">
      セルをクリックで ○(正解)→×(不正解)→－(未入力) と切替。
      問題のヘッダをクリックでタグを設定・問題の分割ができます。
      現在 ${mainInfo}。</div>
      <div class="grid-input"><table class="entry">
      <thead><tr>${qhdr}</tr></thead><tbody>${body}</tbody></table></div>`;
  }

  // 本番モード：個人別問題の入力（1画面1生徒）
  function indivInputHTML(){
    const lv=state.live;
    const at=activeTest();
    const si=lv.indivStudentIdx||0;
    const ps=at.perStudent[si];
    // 生徒切替＋この生徒の問題数スライダー
    const nav=`<div class="map-nav" style="margin-top:4px">
      <button id="indiv-prev" ${si<=0?'disabled':''}>&#9664;</button>
      <span class="mn-label">生徒 S${String(si+1).padStart(2,'0')} （${si+1}/${lv.nStudents}人）</span>
      <button id="indiv-next" ${si>=lv.nStudents-1?'disabled':''}>&#9654;</button>
      ${studentSelectHTML('indiv-select', si)}
    </div>`;
    const qSlider=`<div class="round-q">
      <span class="small" style="font-weight:500">S${String(si+1).padStart(2,'0')} の問題数：
        <span class="val" id="indiv-q">${ps.nQ}</span></span>
      <input type="range" id="rl-indivq" min="1" max="30" value="${ps.nQ}">
      <span class="small" style="color:var(--mute)">生徒ごとに問題数を変えられます</span>
    </div>`;
    // 問題ごとの行：タグ（クリックで設定）＋正誤ボタン
    let rows='';
    for(let q=0;q<ps.nQ;q++){
      const tg=ps.questions[q]||{teacher:[],ai:[]};
      const tlabel=tg.teacher.map(t=>TAG_JA[t]).join('/')||'タグ未設定';
      const v=ps.answers[q];
      const cls=v===1?'c1':v===0?'c0':'cx';
      const label=v===1?'○':v===0?'×':'－';
      rows+=`<tr>
        <td class="sid">Q${q+1}</td>
        <td class="indiv-tag" data-iq="${q}" title="クリックで教師タグを設定"
          style="cursor:pointer;text-align:left;padding:4px 8px;font-size:.78rem">
          ${tlabel}</td>
        <td><button class="indiv-cell ${cls}" data-iq="${q}">${label}</button></td>
      </tr>`;
    }
    return nav + qSlider + `
      <div class="small" style="margin:8px 0 6px">
        この生徒に出した問題ごとに、タグ（クリックで設定）と正誤（○×）を入力します。
        生成AIで作った個人別問題のタグ構成をそのまま写すと、つまずきマップに反映されます。</div>
      <div class="grid-input"><table class="entry indiv-table">
        <thead><tr><th>問題</th><th>教師タグ</th><th>正誤</th></tr></thead>
        <tbody>${rows}</tbody></table></div>`;
  }

  // ---- STEP 2: つまずきマップ ----
  function panelMap(){
    if(!state.data){
      return `<div class="panel ${state.step===1?'active':''}" data-panel="1">
        <div class="card"><h2><span class="tag">STEP 2</span>つまずきマップ</h2>
        <div class="empty">STEP 1 でデータを準備してください。</div></div></div>`;
    }
    // クラス/個人 の切替タブ
    const scopeTabs=`<div class="scope-tabs">
      <div class="scope-tab ${state.mapScope==='class'?'active':''}" data-scope="class">
        クラス全体</div>
      <div class="scope-tab ${state.mapScope==='student'?'active':''}" data-scope="student">
        個人別</div>
    </div>`;
    const body = state.mapScope==='student' ? studentMapBody() : classMapBody();
    return `<div class="panel ${state.step===1?'active':''}" data-panel="1">
      <div class="card"><h2><span class="tag">STEP 2</span>つまずきマップ</h2>
      ${scopeTabs}${body}</div></div>`;
  }

  // クラス全体のつまずきマップ本体
  function classMapBody(){
    let body='';
    {
      const nT=state.data.cfg.nTests;
      const presence=tagPresence(state.data);
      const map=buildMap(state.data,nT);  // 全回まとめた正答率
      const sourceBrk=tagSourceBreakdown(state.data);
      const allTags=TAGS.filter(t=>presence[t].present>0);
      const sorted=allTags.slice().sort((a,b)=>{
        const va=map[a]===null?2:map[a], vb=map[b]===null?2:map[b];
        return va-vb;
      });
      // 全体のソース内訳サマリー（タグソース表示する価値があるかの判定にも使う）
      let totalManual=0,totalAiCopy=0,totalAiEdited=0;
      sorted.forEach(t=>{
        if(sourceBrk[t]){
          totalManual+=sourceBrk[t].manual;
          totalAiCopy+=sourceBrk[t].aiCopy;
          totalAiEdited+=sourceBrk[t].aiEdited;
        }
      });
      const showSrc = (totalAiCopy+totalAiEdited)>0;  // AI由来があるときだけ表示
      const sourceSummary = showSrc ? sourceSummaryHTML(totalManual,totalAiCopy,totalAiEdited) : '';
      const sourceLegend = showSrc ? sourceLegendHTML() : '';

      if(sorted.length===0){
        body=`<div class="empty">有効なタグ付き問題がありません。問題にタグを設定してください。</div>`;
      } else if(nT<=1){
        body=`<div class="desc">教師タグを正として、タグ別のクラス平均正答率を出します。
        低いタグ＝クラスの弱点。これが「つまずきマップ」です。</div>
        ${sourceSummary}
        ${barRows(map,sorted,presence,showSrc?sourceBrk:null)}
        ${mapLegend()}
        ${sourceLegend}
        <div class="callout">最下位3タグ：<b>${sorted.slice(0,3).map(t=>TAG_JA[t]).join('・')}</b>
        がこのクラスの弱点です。テスト回を増やすと時系列変化を見られます。</div>`;
      } else {
        // テスト複数回
        const perTest=[];
        for(let k=1;k<=nT;k++) perTest.push(buildMapForTest(state.data,k));
        if(state.mapViewTest===null||state.mapViewTest>=nT)
          state.mapViewTest=nT-1;
        const vt=state.mapViewTest;
        const shown=perTest[vt];
        const shownTags=allTags.slice().sort((a,b)=>{
          const va=shown[a]===null?2:shown[a], vb=shown[b]===null?2:shown[b];
          return va-vb;
        });
        const first=perTest[0], latest=perTest[nT-1];
        body=`<div class="desc">テストを重ねるごとに、つまずきマップがどう変化したかを示します。
        全${nT}回の累計マップ、各回のマップ、変化、推移の順に表示します。</div>
        ${sourceSummary}

        <h2 style="font-size:.9rem;margin:14px 0 2px">① 全${nT}回 累計のつまずきマップ（棒）</h2>
        <div class="small" style="margin-bottom:6px">
        全テスト回をまとめた正答率です。サンプル数が多く、期間全体のクラスの傾向を最も安定して示します。</div>
        ${barRows(map,sorted,presence,showSrc?sourceBrk:null)}
        ${mapLegend()}
        ${sourceLegend}

        <h2 style="font-size:.9rem;margin:18px 0 2px">② 各回のつまずきマップ（棒）</h2>
        <div class="map-nav">
          <button id="map-prev" ${vt<=0?'disabled':''}>&#9664;</button>
          <span class="mn-label">第${vt+1}回 / 全${nT}回</span>
          <button id="map-next" ${vt>=nT-1?'disabled':''}>&#9654;</button>
        </div>
        ${barRows(shown,shownTags,null,showSrc?sourceBrk:null)}
        ${mapLegend()}
        <div class="small" style="margin-top:6px;color:var(--warn)">
        ※「出題なし」のタグは、その回にそのタグの問題が無かったことを示します。</div>

        <h2 style="font-size:.9rem;margin:18px 0 4px">③ 第1回 → 第${nT}回 の変化</h2>
        <table class="cmp"><tr><th>タグ</th><th>第1回</th><th>第${nT}回</th>
          <th>変化</th><th>出題回数</th></tr>
        ${sorted.map(tg=>{
          const v0=first[tg], v1=latest[tg];
          const p=presence[tg];
          const f0=v0===null?'－':(v0*100).toFixed(0)+'%';
          const f1=v1===null?'－':(v1*100).toFixed(0)+'%';
          let chg='－', col='var(--mute)';
          if(v0!==null&&v1!==null){
            const d=v1-v0;
            col=d>0.01?'var(--good)':d<-0.01?'var(--bad)':'var(--mute)';
            chg=(d>0?'+':'')+(d*100).toFixed(1)+'pt';
          }
          return `<tr><td>${tg} ${TAG_JA[tg]}</td><td>${f0}</td><td>${f1}</td>
            <td style="color:${col};font-weight:600">${chg}</td>
            <td>${p.present}/${p.total}回</td></tr>`;
        }).join('')}</table>
        <div class="callout">正答率が上がったタグは指導の効果が出た可能性、
        下がった・伸びないタグは引き続き重点的な指導が必要、と読み取れます。
        出題回数が全回に満たないタグは、変化の判断に注意が必要です。</div>

        <h2 style="font-size:.9rem;margin:18px 0 4px">④ タグ別 正答率の推移（折れ線）</h2>
        ${lineChartSVG(perTest,sorted)}
        ${lineLegendHTML(sorted,presence)}
        <div class="small" style="margin-top:4px">
        折れ線が途切れている箇所は、その回にそのタグの問題が出題されなかったことを示します。</div>`;
      }
    }
    return body;
  }

  // 生徒選択プルダウンのHTML。selectId はイベント紐付け用のid、
  // curIdx は現在の生徒インデックス（0始まり）。
  function studentSelectHTML(selectId, curIdx){
    const nS = state.data ? state.data.cfg.nStudents
      : (state.live ? state.live.nStudents : 0);
    let opts='';
    for(let s=0;s<nS;s++){
      opts+=`<option value="${s}" ${s===curIdx?'selected':''}>`
        +`S${String(s+1).padStart(2,'0')}</option>`;
    }
    return `<select id="${selectId}" class="stu-select">${opts}</select>`;
  }

  // テスト回の種別配列を取得（無ければ全てcommon扱い）
  function testKinds(data){
    if(data.cfg.testKinds && data.cfg.testKinds.length===data.cfg.nTests)
      return data.cfg.testKinds;
    return Array.from({length:data.cfg.nTests},()=>'common');
  }
  // 共通テスト回（偏差値の対象）の回番号リスト（1始まり）
  function commonTestNos(data){
    const kinds=testKinds(data);
    const out=[];
    kinds.forEach((k,i)=>{ if(k==='common') out.push(i+1); });
    return out;
  }
  // 偏差値表示に使う「最新の共通テスト回」。無ければ null
  function latestCommonTestNo(data){
    const list=commonTestNos(data);
    return list.length? list[list.length-1] : null;
  }

  // 個人別のつまずきマップ本体（◀▶／プルダウンで生徒を切り替え）
  function studentMapBody(){
    const data=state.data;
    const nS=data.cfg.nStudents;
    const nT=data.cfg.nTests;
    if(nS<=0) return `<div class="empty">生徒データがありません。</div>`;
    // 表示中の生徒インデックスを整える
    if(state.mapStudentIdx>=nS) state.mapStudentIdx=0;
    if(state.mapStudentIdx<0) state.mapStudentIdx=0;
    const si=state.mapStudentIdx;

    // 偏差値・順位は「共通テスト回」でのみ意味を持つ（全員同じ問題のため）。
    // 個人別問題回は問題が生徒ごとに違うので偏差値を出さない。
    const devTestNo=latestCommonTestNo(data);
    const hasCommon = devTestNo!=null;
    const devInfo = hasCommon ? studentDeviations(data, devTestNo) : null;
    const myScore = hasCommon ? devInfo.scores[si] : null;
    // 順位を計算（正答率の高い順、同率は同順位）
    let rank=null;
    if(hasCommon && myScore.rate!=null){
      rank=1+devInfo.scores.filter(s=>s.rate!=null && s.rate>myScore.rate).length;
    }

    // 個人のタグ別マップ（こちらは全回まとめで出す。タグ集計は問題が違っても成立）
    const presence=tagPresence(data);
    const myMap=buildMapForStudent(data, si, null);
    const classMap=buildMap(data, nT);  // 比較用クラス平均
    const allTags=TAGS.filter(t=>presence[t].present>0);
    const sorted=allTags.slice().sort((a,b)=>{
      const va=myMap[a]==null?2:myMap[a], vb=myMap[b]==null?2:myMap[b];
      return va-vb;
    });

    // 生徒切替ナビ
    const nav=`<div class="map-nav">
      <button id="stu-prev" ${si<=0?'disabled':''}>&#9664;</button>
      <span class="mn-label">生徒 S${String(si+1).padStart(2,'0')} （${si+1}/${nS}人）</span>
      <button id="stu-next" ${si>=nS-1?'disabled':''}>&#9654;</button>
      ${studentSelectHTML('stu-select', si)}
    </div>`;

    // 偏差値カード（共通テスト回がある場合のみ）
    let devCard;
    if(!hasCommon){
      devCard=`<div class="callout">この期間には共通テスト（全員が同じ問題を解いた回）が
        ないため、偏差値・順位は表示しません。個人別問題は生徒ごとに問題が異なるため、
        偏差値の母集団になりません。下のタグ別正答率で弱点を確認してください。</div>`;
    } else if(myScore.rate==null){
      devCard=`<div class="callout warn">この生徒の共通テスト（第${devTestNo}回）の
        解答データがありません。</div>`;
    } else {
      const kindList=commonTestNos(data);
      const noteMulti = kindList.length>1
        ? `<span style="color:var(--mute)">（最新の共通テスト 第${devTestNo}回 基準）</span>` : '';
      devCard=`<div class="small" style="margin:6px 0 2px">
        偏差値・順位は共通テスト（第${devTestNo}回）の総合得点に基づきます。${noteMulti}</div>
        <div class="dev-cards">
          <div class="dev-card"><div class="dev-k">総合得点</div>
            <div class="dev-v">${myScore.correct}<span class="dev-u">/${myScore.total}</span></div>
            <div class="dev-sub">${(myScore.rate*100).toFixed(0)}%</div></div>
          <div class="dev-card primary"><div class="dev-k">クラス内偏差値</div>
            <div class="dev-v">${myScore.deviation.toFixed(1)}</div>
            <div class="dev-sub">第${devTestNo}回 共通テスト</div></div>
          <div class="dev-card"><div class="dev-k">クラス内順位</div>
            <div class="dev-v">${rank}<span class="dev-u">/${devInfo.n}人</span></div>
            <div class="dev-sub">クラス平均 ${(devInfo.mean*100).toFixed(0)}%</div></div>
        </div>`;
    }

    // 個人タグマップ（クラス平均との対比つき）
    let bars='';
    if(sorted.length===0){
      bars=`<div class="empty">この生徒のタグ付き解答がありません。</div>`;
    } else {
      bars=sorted.map(tg=>{
        const v=myMap[tg];
        if(v==null){
          return `<div class="bar-row">
            <div class="lbl">${tg}<br><span style="font-size:.68rem;color:var(--mute)">${TAG_JA[tg]}</span></div>
            <div class="bar-track"><div class="bar-fill" style="width:0%"></div></div>
            <div class="pct" style="color:var(--mute)">出題なし</div></div>`;
        }
        const col=v<0.5?'var(--bad)':v<0.7?'var(--warn)':'var(--good)';
        const cls=classMap[tg];
        // クラス平均位置のマーカー
        const marker = (cls!=null)
          ? `<div class="class-marker" style="left:${cls*100}%"
               title="クラス平均 ${(cls*100).toFixed(0)}%"></div>` : '';
        const diff = (cls!=null) ? (v-cls) : null;
        const diffLabel = diff==null ? '' :
          `<span style="font-size:.66rem;color:${diff>=0?'var(--good)':'var(--bad)'}">
            ${diff>=0?'+':''}${(diff*100).toFixed(0)}pt</span>`;
        return `<div class="bar-row">
          <div class="lbl">${tg}<br><span style="font-size:.68rem;color:var(--mute)">${TAG_JA[tg]} ${diffLabel}</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:${v*100}%;background:${col}"></div>${marker}</div>
          <div class="pct">${(v*100).toFixed(0)}%</div></div>`;
      }).join('');
    }

    return `<div class="desc">生徒一人ひとりの、タグ別正答率（個人のつまずきマップ）と
    クラス内での総合得点・偏差値・順位を表示します。◀▶で生徒を切り替えられます。</div>
    ${nav}
    ${devCard}
    <h2 style="font-size:.9rem;margin:16px 0 4px">S${String(si+1).padStart(2,'0')} のつまずきマップ</h2>
    <div class="small" style="margin-bottom:6px">
    バーがこの生徒の正答率、縦線 │ がクラス平均です。クラス平均より低いタグがこの生徒の弱点です。</div>
    ${bars}
    ${sorted.length>0?`<div class="legend" style="margin-top:6px">
      <span><span class="swatch" style="background:var(--bad)"></span>弱点 (〜50%)</span>
      <span><span class="swatch" style="background:var(--warn)"></span>要強化 (50-70%)</span>
      <span><span class="swatch" style="background:var(--good)"></span>定着 (70%〜)</span>
      <span>│ クラス平均</span></div>`:''}
    <div class="callout" style="margin-top:12px">
      個人の弱点タグは、STEP 5 で「この生徒向けの問題」を作る際の根拠になります。
      偏差値は外部模試と同じく、共通テスト（全員同じ問題）の総合得点に基づくクラス内の位置です。</div>`;
  }

  // 棒グラフの行（共通）。presence を渡すと出題頻度（4/5など）を、
  // sourceBrk を渡すとタグソースのバッジ（教師手動/AIコピー/AI修正/混在）を添える
  function barRows(map,sorted,presence,sourceBrk){
    return sorted.map(tg=>{
      const v=map[tg];
      // 出題頻度の注記
      let freq='';
      if(presence&&presence[tg]){
        const p=presence[tg];
        if(p.present<p.total){
          freq=` <span style="color:var(--warn);font-size:.66rem">出題 ${p.present}/${p.total}回</span>`;
        }
      }
      // タグソースのバッジ
      const srcBadge = sourceBrk ? sourceBadgeHTML(sourceBrk[tg]) : '';
      if(v===null){
        return `<div class="bar-row">
          <div class="lbl">${tg} ${srcBadge}<br><span style="font-family:'Zen Kaku Gothic New';font-size:.68rem;color:var(--mute)">${TAG_JA[tg]}</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:0%"></div></div>
          <div class="pct" style="color:var(--mute)">出題なし</div></div>`;
      }
      const col=v<0.5?'var(--bad)':v<0.7?'var(--warn)':'var(--good)';
      return `<div class="bar-row">
        <div class="lbl">${tg} ${srcBadge}<br><span style="font-family:'Zen Kaku Gothic New';font-size:.68rem;color:var(--mute)">${TAG_JA[tg]}${freq}</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${v*100}%;background:${col}"></div></div>
        <div class="pct">${(v*100).toFixed(1)}%</div></div>`;
    }).join('');
  }
  // タグソース内訳からバッジHTMLを返す
  function sourceBadgeHTML(brk){
    const d=dominantSource(brk);
    if(!d) return '';
    const labels={
      'manual':   {short:'教員',  cls:'src-manual',   title:'教員が手動で設定したタグ'},
      'ai-copy':  {short:'AI',    cls:'src-ai',       title:'AIタグをそのままコピー'},
      'ai-edited':{short:'AI修正',cls:'src-ai-edit',  title:'AIタグを教員が修正'},
      'mixed':    {short:'混在',  cls:'src-mixed',    title:'問題によって由来が異なる'},
    };
    const L=labels[d];
    return `<span class="src-badge ${L.cls}" title="${L.title}">${L.short}</span>`;
  }
  // タグソース内訳のサマリー（マップ上部に表示）
  function sourceSummaryHTML(m,c,e){
    const total=m+c+e;
    if(total===0) return '';
    const parts=[];
    if(m>0) parts.push(`教員手動 ${m}件`);
    if(c>0) parts.push(`AIタグから ${c}件`);
    if(e>0) parts.push(`AI修正 ${e}件`);
    return `<div class="callout" style="font-size:.78rem;margin:8px 0">
      <b>タグの由来（このマップが何のタグで作られたか）：</b>${parts.join(' ／ ')}
      <span style="color:var(--mute)">（タグごとの内訳は各バーのバッジで確認できます）</span>
    </div>`;
  }
  // タグソースバッジの凡例
  function sourceLegendHTML(){
    return `<div class="legend" style="margin-top:4px">
      <span><span class="src-badge src-manual">教員</span>教員が手動で設定</span>
      <span><span class="src-badge src-ai">AI</span>AIタグをそのままコピー</span>
      <span><span class="src-badge src-ai-edit">AI修正</span>AIタグを教員が修正</span>
      <span><span class="src-badge src-mixed">混在</span>問題により由来が異なる</span></div>`;
  }
  function mapLegend(){
    return `<div class="legend">
      <span><span class="swatch" style="background:var(--bad)"></span>弱点 (〜50%)</span>
      <span><span class="swatch" style="background:var(--warn)"></span>要強化 (50-70%)</span>
      <span><span class="swatch" style="background:var(--good)"></span>定着 (70%〜)</span></div>`;
  }

  // タグごとの色を返す（折れ線と凡例で共通利用）
  // 基本は固定パレット。タグ数がパレットを超えたら色相環から自動生成して補う。
  const LINE_PALETTE=['#b5462f','#c98a2b','#3f7d6e','#2f5d62','#46587a',
                      '#7a6f54','#a04a6a','#5a7a3a','#385f8a','#9a5a2a',
                      '#5a3a6a','#2a6a5a'];
  function tagColor(tags,tg){
    const i=tags.indexOf(tg);
    const idx=(i<0?0:i);
    if(idx<LINE_PALETTE.length) return LINE_PALETTE[idx];
    // パレットを超えたぶんは色相を等間隔にずらして生成（色被りを防ぐ）
    const hue=(idx*47)%360;
    return `hsl(${hue},45%,42%)`;
  }

  // 折れ線グラフSVG：タグ別正答率の推移
  // 欠損回（その回にそのタグの問題が無い）では線が途切れ、
  // 再びそのタグが出題された回でまた線がつながる。
  function lineChartSVG(perTest,tags){
    const nT=perTest.length;
    const W=640,H=320,padL=46,padR=92,padT=18,padB=38;
    const plotW=W-padL-padR, plotH=H-padT-padB;
    const sx=i=>padL + (nT<=1?plotW/2:i/(nT-1)*plotW);
    const sy=v=>padT + (1-v)*plotH;
    let grid='';
    [0,0.25,0.5,0.75,1].forEach(v=>{
      grid+=`<line x1="${padL}" y1="${sy(v)}" x2="${padL+plotW}" y2="${sy(v)}"
        stroke="#d8d2c4" stroke-width="0.7"/>
        <text x="${padL-6}" y="${sy(v)+3}" font-size="9" text-anchor="end"
        fill="#8a8474" font-family="monospace">${Math.round(v*100)}%</text>`;
    });
    for(let i=0;i<nT;i++){
      grid+=`<text x="${sx(i)}" y="${H-padB+15}" font-size="9.5" text-anchor="middle"
        fill="#8a8474">第${i+1}回</text>`;
    }
    // 各タグの折れ線：連続して値がある区間ごとに別パスを描く
    let lines='';
    const labelData=[];   // 右端ラベル用 {tag, col, y}
    tags.forEach(tg=>{
      const col=tagColor(tags,tg);
      let dots='';
      let segments=[], cur=[];
      let lastY=null;
      for(let i=0;i<nT;i++){
        const v=perTest[i][tg];
        if(v===null){
          if(cur.length) segments.push(cur);
          cur=[];
        } else {
          const x=sx(i),y=sy(v);
          cur.push([x,y]);
          dots+=`<circle cx="${x}" cy="${y}" r="3.4" fill="${col}"/>`;
          lastY=y;
        }
      }
      if(cur.length) segments.push(cur);
      segments.forEach(seg=>{
        if(seg.length===1){
          const [x,y]=seg[0];
          lines+=`<circle cx="${x}" cy="${y}" r="5.5" fill="none"
            stroke="${col}" stroke-width="1.3" stroke-dasharray="2 2"/>`;
          return;
        }
        let d='';
        seg.forEach((p,k)=>{ d+=(k===0?'M':'L')+p[0]+' '+p[1]+' '; });
        lines+=`<path d="${d}" fill="none" stroke="${col}" stroke-width="2"/>`;
      });
      lines+=dots;
      // 最後に値があった点の高さを右端ラベルの初期位置にする
      if(lastY!==null) labelData.push({tag:tg,col:col,y:lastY});
    });

    // 右端ラベルの衝突回避：y順に並べ、最小間隔(11px)を確保するよう調整
    const MIN_GAP=11;
    labelData.sort((a,b)=>a.y-b.y);
    for(let i=1;i<labelData.length;i++){
      if(labelData[i].y - labelData[i-1].y < MIN_GAP){
        labelData[i].y = labelData[i-1].y + MIN_GAP;
      }
    }
    // 下にはみ出したぶんを上方向へ押し戻す
    const bottom=padT+plotH;
    let overflow=labelData.length?labelData[labelData.length-1].y-bottom:0;
    if(overflow>0){
      for(let i=0;i<labelData.length;i++) labelData[i].y-=overflow;
    }
    // ラベルと、線の終点からラベルへの引き出し線を描く
    let labels='';
    labelData.forEach(ld=>{
      labels+=`<text x="${padL+plotW+6}" y="${ld.y+3}" font-size="9"
        fill="${ld.col}" font-weight="600">${TAG_JA[ld.tag]}</text>`;
    });

    return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg"
      style="width:100%;max-width:${W}px;display:block;margin:6px auto">
      <rect x="${padL}" y="${padT}" width="${plotW}" height="${plotH}"
        fill="#f4f1ea" stroke="#1a2233" stroke-width="1"/>
      ${grid}${lines}${labels}
      <text x="${padL+plotW/2}" y="${H-4}" font-size="10" text-anchor="middle"
        fill="#1a2233">テスト回</text>
    </svg>`;
  }

  // 折れ線グラフの色別タグ名リスト（凡例）
  function lineLegendHTML(tags,presence){
    return `<div class="line-legend">
      ${tags.map(tg=>{
        const col=tagColor(tags,tg);
        let freq='';
        if(presence&&presence[tg]&&presence[tg].present<presence[tg].total){
          freq=` <span style="color:var(--warn);font-size:.66rem">(${presence[tg].present}/${presence[tg].total}回)</span>`;
        }
        return `<span class="ll-item">
          <span class="ll-line" style="background:${col}"></span>
          ${TAG_JA[tg]}<span class="ll-en">${tg}</span>${freq}</span>`;
      }).join('')}
    </div>`;
  }

  // ---- STEP 3: AIタグ検証 ----
  function panelAgree(){
    let body=`<div class="empty">STEP 1 でデータを準備してください。</div>`;
    if(state.data){
      const ag=tagAgreement(state.data);
      if(ag.total===0){
        body=`<div class="empty">AIタグが未設定です。${state.appMode==='live'
          ?'本番モードでAIタグ検証を行うには、各問題にAIタグも入力してください（今回は省略可）。'
          :''}</div>`;
      } else {
        const cls=ag.mean>0.85?'good':ag.mean>0.7?'warn':'bad';
        const stat={}; TAGS.forEach(t=>stat[t]={tp:0,fn:0,fp:0});
        state.data.questions.forEach(q=>{
          if(!q.ai||q.ai.length===0) return;
          const ts=new Set(q.teacher),as=new Set(q.ai);
          TAGS.forEach(t=>{
            if(ts.has(t)&&as.has(t))stat[t].tp++;
            else if(ts.has(t)&&!as.has(t))stat[t].fn++;
            else if(!ts.has(t)&&as.has(t))stat[t].fp++;
          });
        });
        // 不一致問題を収集してフィードバックUI用データを作る
        const qTexts = extractQuestionTexts((activeTest()&&activeTest().qtext)||state.live.qtext||'');
        const mismatches = [];
        state.data.questions.forEach((q,qi)=>{
          if(!q.ai||q.ai.length===0) return;
          const ts=new Set(q.teacher), as=new Set(q.ai);
          const missed=[...ts].filter(t=>!as.has(t));
          const extra =[...as].filter(t=>!ts.has(t));
          if(missed.length===0&&extra.length===0) return;
          mismatches.push({qi, qn:qi+1, teacher:[...ts], ai:[...as], missed, extra,
            text: qTexts[qi+1]||''});
        });

        const feedbackSection = state.appMode==='live' ? (()=>{
          if(mismatches.length===0){
            return `<div class="callout" style="margin-top:16px">
              ✅ すべての問題でAIタグと教師タグが一致しています。フィードバックは不要です。</div>`;
          }
          const rows = mismatches.map(m=>{
            const missHtml = m.missed.length
              ? m.missed.map(t=>`<span class="tag-chip bad">${t} ${TAG_JA[t]||''}</span>`).join(' ')
              : '―';
            const extHtml  = m.extra.length
              ? m.extra.map(t=>`<span class="tag-chip warn">${t} ${TAG_JA[t]||''}</span>`).join(' ')
              : '―';
            const textPrev = m.text
              ? `<div class="fb-qtext">${escapeHTML(m.text.slice(0,120))}${m.text.length>120?'…':''}</div>`
              : '';
            return `<tr>
              <td style="font-weight:600">Q${m.qn}</td>
              <td>${m.teacher.map(t=>`<span class="tag-chip">${t}</span>`).join(' ')}</td>
              <td>${m.ai.map(t=>`<span class="tag-chip">${t}</span>`).join(' ')}</td>
              <td>${missHtml}</td>
              <td>${extHtml}</td>
            </tr>
            ${m.text?`<tr><td colspan="5" style="padding:2px 8px 8px">${textPrev}</td></tr>`:''}`;
          }).join('');
          return `<h3 style="margin:20px 0 6px;font-size:.95rem">
            &#9888;&#65039; タグ不一致の問題（${mismatches.length}問）とAIフィードバック用プロンプト</h3>
          <div class="desc">以下の問題でAIタグが教師タグと異なります。
          タグ付け会話を継続中のAIに貼り付けることで、AIにミスを指摘して修正させられます。</div>
          <div style="overflow-x:auto">
          <table class="cmp">
            <tr><th>問題</th><th>教師タグ（正解）</th><th>AIタグ</th>
                <th>見落とし</th><th>過剰付与</th></tr>
            ${rows}
          </table></div>
          <div style="margin-top:14px">
            <button class="ghost" id="make-fbprompt">フィードバック用プロンプトを生成</button>
          </div>
          <div id="fb-prompt-area" style="margin-top:10px"></div>`;
        })() : '';

        body=`<div class="desc">生成AIにタグ付けさせた結果と教師タグの一致度を測ります。
        一致度が高いほど、AIによるタグ付けを信頼して使えることを示します。</div>
        <div class="metrics">
          <div class="metric"><div class="k">平均Jaccard一致度</div>
            <div class="v ${cls}">${ag.mean.toFixed(3)}</div></div>
          <div class="metric"><div class="k">完全一致した問題</div>
            <div class="v">${ag.perfect}/${ag.total}</div></div>
        </div>
        <table class="cmp"><tr><th>タグ</th><th>一致</th><th>AI見落とし</th><th>AI過剰付与</th></tr>
        ${TAGS.map(t=>`<tr><td>${t} ${TAG_JA[t]}</td><td>${stat[t].tp}</td>
          <td>${stat[t].fn}</td><td>${stat[t].fp}</td></tr>`).join('')}</table>
        ${state.appMode==='dummy'?`<div class="callout warn">ダミーでは
        <b>分詞→関係詞</b>、<b>推論→指示語</b> をAIが混同しやすく設定しています。</div>`:''}
        ${feedbackSection}`;
      }
    }
    return `<div class="panel ${state.step===2?'active':''}" data-panel="2">
      <div class="card"><h2><span class="tag">STEP 3</span>AIタグ付けの信頼性</h2>${body}</div></div>`;
  }

  // ---- STEP 4: パラメータリカバリー（ダミー専用） ----
  function panelRecovery(){
    let body;
    if(state.appMode==='live'){
      body=`<div class="callout warn"><b>本番モードではこのステップは行いません。</b>
      パラメータリカバリーは「仕込んだ真値」と推定値を照合する検証で、真値が存在するダミーモード専用です。
      実データの妥当性は STEP 3（AIタグ検証）で確認します。</div>`;
    } else if(!state.data){
      body=`<div class="empty">STEP 1 でダミークラスを生成してください。</div>`;
    } else {
      const full=recovery(state.data,state.data.cfg.nTests);
      const corrCls=full.corr>0.9?'good':full.corr>0.75?'warn':'bad';
      const maeCls=full.mae<0.05?'good':full.mae<0.1?'warn':'bad';
      const series=[];
      for(let k=1;k<=state.data.cfg.nTests;k++) series.push({k,...recovery(state.data,k)});
      body=`<div class="desc">最初に仕込んだ「本当の理解度」と、マップが正答率から推定した値を照合します。
      真値を知っているのはダミーだからこそ。実生徒では不可能な検証です。</div>
      <div class="metrics">
        <div class="metric"><div class="k">真値との相関</div>
          <div class="v ${corrCls}">${full.corr.toFixed(3)}</div></div>
        <div class="metric"><div class="k">平均絶対誤差 MAE</div>
          <div class="v ${maeCls}">${full.mae.toFixed(3)}</div></div>
        <div class="metric"><div class="k">RMSE</div>
          <div class="v">${full.rmse.toFixed(3)}</div></div>
      </div>
      ${scatterSVG(full)}
      <h2 style="font-size:.9rem;margin:16px 0 4px">テスト回数と推定精度</h2>
      <div class="desc">回数を増やすと誤差が下がるなら、実践に必要なテスト回数の目安になります。</div>
      <table class="cmp"><tr><th>テスト回数</th><th>MAE（誤差）</th><th>相関</th></tr>
      ${series.map(s=>`<tr><td>${s.k}回</td><td>${s.mae.toFixed(4)}</td>
        <td>${s.corr.toFixed(4)}</td></tr>`).join('')}</table>`;
    }
    return `<div class="panel ${state.step===3?'active':''}" data-panel="3">
      <div class="card"><h2><span class="tag">STEP 4</span>パラメータリカバリー</h2>${body}</div></div>`;
  }

  // ---- STEP 5: 問題自動生成 ----
  function panelQGen(){
    // パートA：弱点連動の出題計画（つまずきマップに基づく。データがある時のみ）
    let weakPart='';
    if(state.data){
      const nS=state.data.cfg.nStudents;
      const wg=state.weakGen;
      const isStu = wg.scope==='student';
      if(isStu && wg.studentIdx>=nS) wg.studentIdx=0;
      // 対象に応じてマップを切り替え（クラス全体 or 特定生徒）
      const map = isStu
        ? buildMapForStudent(state.data, wg.studentIdx, null)
        : buildMap(state.data, state.data.cfg.nTests);
      const valid=TAGS.filter(t=>map[t]!==null);

      // 対象切替タブ＋（個人なら）生徒ナビ
      const scopeTabs=`<div class="scope-tabs">
        <div class="scope-tab ${!isStu?'active':''}" data-wscope="class">クラスの弱点</div>
        <div class="scope-tab ${isStu?'active':''}" data-wscope="student">個人の弱点</div>
      </div>`;
      const stuNav = isStu ? `<div class="map-nav">
        <button id="wstu-prev" ${wg.studentIdx<=0?'disabled':''}>&#9664;</button>
        <span class="mn-label">生徒 S${String(wg.studentIdx+1).padStart(2,'0')} （${wg.studentIdx+1}/${nS}人）</span>
        <button id="wstu-next" ${wg.studentIdx>=nS-1?'disabled':''}>&#9654;</button>
        ${studentSelectHTML('wstu-select', wg.studentIdx)}
      </div>` : '';
      const targetLabel = isStu ? `S${String(wg.studentIdx+1).padStart(2,'0')}` : 'このクラス';
      const accColName = isStu ? '本人正答率' : 'クラス正答率';

      if(valid.length===0){
        weakPart=`<div class="card">
          <h2><span class="tag">STEP 5-A</span>弱点連動の出題計画</h2>

        <div class="callout">この出題計画と生成問題を${isStu?'この生徒':'生徒'}に解かせ、次のテストで

        解かせた結果は、STEP 1 で新しいテスト回として記録すると、STEP 2 の推移で確認できます。</div>

        ${isStu ? `

  // STEP5-B：通常問題の作成カード（タグと出題数を手動指定）
